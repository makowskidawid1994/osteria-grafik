  display: flex; align-items: center; justify-content: center;
}
.adc.avail-yes { background: rgba(52,211,153,.18); color: #34D399; font-weight: 700; }
.adc.avail-no { background: rgba(220,38,38,.2); color: #FCA5A5; font-weight: 700; }
.adc.adc-empty { cursor: default; }
.adc.adc-past { color: rgba(255,255,255,.10); cursor: default; }
.adc.adc-blocked { background: rgba(255,255,255,.05); color: rgba(255,255,255,.2); cursor: not-allowed; }
.avail-date-card { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.avail-date-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.avail-date-name { font-size: 13px; font-weight: 600; flex:1; color: #fff; }
.avail-date-stats { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 500; display: flex; gap: 6px; }

/* ─── Add emp button ─── */
.add-emp-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 16px 14px; padding: 10px; background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.08);
  border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,.45); font-family: var(--font); transition: all .12s;
}
.add-emp-btn:hover { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.75); }

.td-sum-cell { text-align: right; padding: 9px 14px; white-space: nowrap; }
.sum-h { font-size: 13px; font-weight: 700; color: #fff; }
.sum-cost { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 400; margin-top: 1px; }

/* ─── Month table ─── */
.month-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-tbl {
  width: 100%; border-collapse: collapse; min-width: 520px;
  background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);
  border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
}
.month-tbl thead th {
  background: rgba(255,255,255,.04); color: rgba(255,255,255,.45); font-size: 9px; font-weight: 600;
  padding: 8px 3px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid rgba(255,255,255,.08); text-transform: uppercase;
}
.month-tbl thead th.mth-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.month-tbl thead th.mth-day { min-width: 28px; }
.month-tbl thead th.mth-day .mdn { font-size: 12px; font-weight: 700; color: #fff; display: block; margin-top: 1px; letter-spacing: -.2px; text-transform: none; }
.month-tbl thead th.mth-day.mtoday { background: rgba(255,255,255,.10); color: white; }
.month-tbl thead th.mth-day.mtoday .mdn { color: white; }
.month-tbl tbody tr { border-top: 1px solid rgba(255,255,255,.07); }
.month-tbl tbody tr:hover { background: rgba(255,255,255,.04); }
.month-tbl tbody td { border-right: 1px solid rgba(255,255,255,.07); padding: 0; }
.month-tbl tbody td:last-child { border-right: none; }
.mtd-emp { display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px; }
.mtd-day {
  text-align: center; cursor: pointer; padding: 5px 2px; min-height: 44px;
  vertical-align: middle; transition: background .1s; font-size: 9px;
}
.mtd-day:hover { background: rgba(255,255,255,.04); }
.mtd-day.mtoday-cell { background: rgba(255,255,255,.06); }
.mtd-day.mweekend { background: rgba(220,38,38,.06); }
.month-tbl thead th.mth-day.mweekend-h { background: rgba(220,38,38,.15); color: var(--danger); }
.month-tbl thead th.mth-day.mweekend-h .mdn { color: var(--danger); }
.mtd-day.mweekend .mchip { background: var(--danger); }
.mchip { display: inline-block; background: rgba(255,255,255,.2); color: white; font-size: 8px; font-weight: 600; padding: 2px 4px; border-radius: 3px; white-space: nowrap; }

/* ─── Employees list ─── */
.emp-list { padding: 8px 16px; display: flex; flex-direction: column; }
.emp-row {
  background: transparent; border-bottom: 1px solid rgba(255,255,255,.07);
  padding: 12px 0; display: flex; align-items: center; gap: 10px;
  transition: background .1s;
}
.emp-row:last-child { border-bottom: none; }
.emp-row:hover { background: rgba(255,255,255,.04); }
.emp-row-info { flex: 1; }
.emp-row-name { font-size: 13px; font-weight: 600; color: #fff; }
.emp-row-meta { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
.emp-row-stat { font-size: 11px; color: rgba(255,255,255,.65); font-weight: 500; margin-top: 2px; }
.emp-rate { text-align: right; }
.emp-rate-val { font-size: 15px; font-weight: 700; letter-spacing: -.3px; color: #fff; }
.emp-rate-lbl { font-size: 10px; color: rgba(255,255,255,.45); }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius); background: none; border: 1px solid rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  color: rgba(255,255,255,.45); transition: all .12s;
}
.icon-btn:hover { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.75); }

/* ─── Availability ─── */
.bday-we { color: var(--accent); }
.bday-we.bday-on { background: #1E293B; color: white; }
.avail-card { background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.05) 100%); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,.12); padding: 14px 16px; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: 0 2px 14px rgba(0,0,0,.18); animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) .05s both; }
.avail-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.avail-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.aday {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .1s;
}
.aday-label { font-size: 9px; font-weight: 500; color: rgba(255,255,255,.45); }
.aday-circle {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.10);
  display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .12s;
}
.aday.yes .aday-circle { border-color: var(--green); background: var(--green); color: white; }
.aday.no .aday-circle { border-color: var(--danger); background: var(--danger); color: white; }
.aday.yes { background: rgba(52,211,153,.15); }
.aday.no { background: rgba(220,38,38,.15); }

/* ─── Dashboard ─── */
.dash-wrap { padding: 12px 16px; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-box {
  background: linear-gradient(145deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);
  border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,.10);
  padding: 14px 14px 12px; backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 2px 12px rgba(0,0,0,.16); animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
}
.stat-box.accent { background: linear-gradient(145deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.07) 100%); border-color: rgba(255,255,255,.14); }
.stat-box-label { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 500; margin-bottom: 5px; letter-spacing: .2px; text-transform: uppercase; }
.stat-box.accent .stat-box-label { color: rgba(255,255,255,.55); }
.stat-box-val { font-size: 22px; font-weight: 700; letter-spacing: -.6px; color: #fff; }
.stat-box.accent .stat-box-val { color: white; }
.stat-box-sub { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 3px; }
.stat-box.accent .stat-box-sub { color: rgba(255,255,255,.45); }
.dash-section-title { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.35); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.dash-emp-rows { display: flex; flex-direction: column; }
.dash-emp-row {
  background: transparent; border-bottom: 1px solid rgba(255,255,255,.07);
  padding: 10px 0; display: flex; align-items: center; gap: 10px;
}
.dash-emp-row:last-child { border-bottom: none; }
.der-info { flex: 1; }
.der-name { font-size: 13px; font-weight: 600; color: #fff; }
.der-meta { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
.der-right { text-align: right; }
.der-rate { font-size: 13px; font-weight: 700; color: #fff; }
.der-cost { font-size: 11px; color: rgba(255,255,255,.55); font-weight: 500; }

/* ─── Employee dashboard ─── */
.emp-dash { padding: 12px 16px; }
.cta-card {
  background: linear-gradient(145deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.06) 100%);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; color: white;
  border: 1px solid rgba(255,255,255,.12); backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
  position: relative; overflow: hidden;
}
.cta-card::before {
  content:''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
}
.cta-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; letter-spacing: -.3px; }
.cta-sub { font-size: 12px; opacity: .6; }
.cta-btn {
  display: inline-block; margin-top: 12px; background: rgba(255,255,255,.10); color: white;
  border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: var(--font);
}
.info-card {
  background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.05) 100%);
  border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,.10);
  padding: 12px 14px; margin-bottom: 8px; backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.08);
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) .05s both;
}
.info-card-title { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.my-shifts-list { display: flex; flex-direction: column; }
.my-shift-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.my-shift-row:last-child { border-bottom: none; }
.msr-date { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
.msr-time { font-size: 13px; color: #fff; font-weight: 700; }
.msr-h { font-size: 11px; color: rgba(255,255,255,.45); }

/* ─── Stats grid (emp) ─── */
.emp-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.estat { background: linear-gradient(145deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.04) 100%); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,.10); padding: 10px 8px; text-align: center; box-shadow: 0 1px 8px rgba(0,0,0,.12); animation: fadeInUp .35s cubic-bezier(.2,.8,.2,1) both; }
.estat-val { font-size: 19px; font-weight: 700; letter-spacing: -.5px; color: #fff; }
.estat-lbl { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 500; margin-top: 2px; }

/* ─── Export button ─── */
.export-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,.65); font-family: var(--font); transition: all .12s; margin-bottom: 8px;
}
.export-btn:hover { border-color: rgba(255,255,255,.2); color: #fff; }
.export-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

/* ─── Month selector for export ─── */
.month-sel-row { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.month-sel-row::-webkit-scrollbar { display: none; }
.msel-btn { padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07); color: rgba(255,255,255,.55); cursor: pointer; transition: all .12s; font-family: var(--font); flex-shrink: 0; }
.msel-btn.active { background: rgba(255,255,255,.12); color: white; border-color: rgba(255,255,255,.12); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
  backdrop-filter: none;
}
.modal-overlay.open, .modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: linear-gradient(180deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.08) 100%);
  border-radius: 24px 24px 0 0; width: 100%; max-width: 480px;
  padding: 18px 20px 36px; transform: translateY(100%);
  transition: transform .22s cubic-bezier(.32,.72,0,1); max-height: 88vh; overflow-y: auto;
  border: 1px solid rgba(255,255,255,.12); border-bottom: none;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 -8px 40px rgba(0,0,0,.35);
}
.modal-overlay.open .modal, .modal-overlay.active .modal { transform: translateY(0); }
.modal-pill { width: 32px; height: 3px; background: rgba(255,255,255,.10); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; letter-spacing: -.3px; color: #fff; }
.modal-sub { font-size: 12px; color: rgba(255,255,255,.45); margin-bottom: 16px; }
.mfield { margin-bottom: 12px; }
.mfield label { display: block; font-size: 11px; font-weight: 500; color: rgba(255,255,255,.55); margin-bottom: 4px; letter-spacing: .1px; }
.mfield input, .mfield select {
  width: 100%; padding: 9px 12px; border: 1px solid rgba(255,255,255,.07); border-radius: var(--radius);
  font-size: 14px; font-family: var(--font); outline: none; color: #fff; background: rgba(255,255,255,.08);
  transition: border-color .12s;
}
.mfield input:focus, .mfield select:focus { border-color: rgba(255,255,255,.3); box-shadow: 0 0 0 2px rgba(255,255,255,.06); }
.mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 6px; margin-top: 18px; }
.mbtn-cancel { padding: 11px 14px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.mbtn-delete { flex: 1; padding: 11px; background: rgba(220,38,38,.2); color: var(--danger); border: 1px solid rgba(220,38,38,.3); border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.mbtn-save { flex: 2; padding: 11px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .12s; }
.mbtn-save:hover { background: var(--accent-hover); }
.cost-preview { background: rgba(255,255,255,.07); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: rgba(255,255,255,.55); margin-top: 4px; display: none; border: 1px solid rgba(255,255,255,.1); }
.cost-preview strong { color: #fff; font-weight: 700; }

/* ─── Toast — minimalny ─── */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(20,4,10,.92); color: white; padding: 12px 22px; border-radius: 28px;
  font-size: 14px; font-weight: 600; z-index: 500; opacity: 0; pointer-events: none;
  white-space: nowrap; transition: all .22s cubic-bezier(.32,.72,0,1);
  box-shadow: 0 8px 32px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.07);
  max-width: 90vw; white-space: normal; text-align: center; line-height: 1.4;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.toast-err { background: rgba(180,20,30,.92); border-color: rgba(255,100,100,.3); }

/* ─── Geo Error Overlay — środek ekranu ─── */
.geo-error-overlay {
  position: fixed; inset: 0; z-index: 600;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
  background: rgba(0,0,0,.7);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.geo-error-overlay.show { opacity: 1; pointer-events: auto; }
.geo-error-card {
  background: #2A0E18;
  border: 1px solid rgba(248,113,113,.3);
  border-radius: 24px;
  padding: 32px 28px 24px;
  text-align: center;
  max-width: 320px; width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  transform: scale(.92) translateY(10px);
  transition: transform .28s cubic-bezier(.16,1,.3,1);
}
.geo-error-overlay.show .geo-error-card { transform: scale(1) translateY(0); }
.geo-error-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(220,38,38,.2);
  border: 2px solid rgba(248,113,113,.4);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  font-size: 28px;
}
.geo-error-title {
  font-size: 17px; font-weight: 800; color: #F5E8EC; letter-spacing: -.3px; margin-bottom: 10px;
  font-family: 'Inter',sans-serif;
}
.geo-error-msg {
  font-size: 14px; color: rgba(245,232,236,.6); line-height: 1.55; margin-bottom: 24px;
  font-family: 'Inter',sans-serif;
}
.geo-error-btn {
  width: 100%; padding: 14px; border-radius: 14px; border: none; cursor: pointer;
  background: rgba(255,255,255,.1); color: #F5E8EC;
  font-size: 15px; font-weight: 700; font-family: 'Inter',sans-serif;
  transition: background .15s;
}
.geo-error-btn:active { background: rgba(255,255,255,.10); }

/* ─── Misc ─── */
.empty-state { text-align: center; padding: 52px 24px; color: rgba(255,255,255,.4); }
.empty-state svg { width: 36px; height: 36px; stroke: rgba(255,255,255,.10); margin-bottom: 12px; }
.empty-state p { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.65); }
.empty-state span { font-size: 12px; }
.spinner { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.07); border-top-color: #fff; border-radius: 50%; animation: spin .65s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.sect-label { padding: 14px 16px 5px; font-size: 10px; font-weight: 600; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: .5px; }

/* ─── Ewidencja (Clock) — dark, spójne z resztą aplikacji ─── */
.clock-wrap { padding: 0 0 90px; display: flex; flex-direction: column; gap: 0; min-height: calc(100dvh - 56px); background: transparent; }

/* Hero — ciemny panel z gradientem jak home screen */
.clock-hero {
  background: transparent;
  padding: 36px 24px 40px; text-align: center; display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden;
  flex-shrink: 0;
}
.clock-hero::before {
  content: ''; display: none;
}
.clock-time-big {
  font-size: 60px; font-weight: 300; letter-spacing: -3px; color: #fff;
  font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 2px;
  font-family: 'Inter',sans-serif;
  position: relative; z-index: 1;
  animation: countUp .5s cubic-bezier(.2,.8,.2,1) both;
}
.clock-date {
  font-size: 13px; color: rgba(255,255,255,.4); margin-bottom: 32px; letter-spacing: .2px;
  font-family: 'Inter',sans-serif;
  position: relative; z-index: 1;
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) .1s both;
}

/* Wielki okrągły przycisk */
.clock-big-btn-wrap { position: relative; margin-bottom: 20px; z-index: 1; animation: fadeInUp .5s cubic-bezier(.2,.8,.2,1) .2s both; }
.clock-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.08);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.04);
}
.clock-ring::before {
  content: ''; position: absolute; inset: 7px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.07);
}
.clock-btn-round {
  width: 118px; height: 118px; border-radius: 50%; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; font-family: 'Inter',sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -.2px;
  transition: transform .18s cubic-bezier(.25,0,.25,1), box-shadow .18s; position: relative; z-index: 1;
}
.clock-btn-round:active { transform: scale(.93); }
.clock-btn-round svg { width: 30px; height: 30px; }

.clock-btn-round.state-idle {
  background: linear-gradient(145deg, #E8402E, #B82E1E); color: white;
  box-shadow: 0 8px 36px rgba(200,50,30,.55), 0 2px 8px rgba(0,0,0,.3);
  animation: idle-pulse 3s ease-in-out infinite;
}
@keyframes idle-pulse {
  0%,100% { box-shadow: 0 8px 36px rgba(200,50,30,.55), 0 2px 8px rgba(0,0,0,.3); }
  50% { box-shadow: 0 8px 48px rgba(200,50,30,.8), 0 2px 12px rgba(0,0,0,.35); }
}
.clock-btn-round.state-idle svg { stroke: none; fill: white; }

.clock-btn-round.state-working {
  background: linear-gradient(145deg, #22C55E, #16A34A); color: white;
  box-shadow: 0 8px 36px rgba(22,163,74,.55), 0 2px 8px rgba(0,0,0,.3);
  animation: working-glow 2.5s ease-in-out infinite;
}
.clock-btn-round.state-working svg { stroke: white; fill: none; stroke-width: 2; }
@keyframes working-glow {
  0%,100% { box-shadow: 0 8px 36px rgba(22,163,74,.55), 0 2px 8px rgba(0,0,0,.3); }
  50% { box-shadow: 0 8px 56px rgba(22,163,74,.75), 0 2px 8px rgba(0,0,0,.3); }
}

.clock-btn-round.state-break {
  background: linear-gradient(145deg, #E8402E, #B82E1E); color: white;
  box-shadow: 0 8px 36px rgba(200,50,30,.5), 0 2px 8px rgba(0,0,0,.3);
}
.clock-btn-round.state-break svg { stroke: white; fill: none; stroke-width: 2; }
.clock-btn-round:disabled { opacity: .45; cursor: not-allowed; }

.clock-elapsed {
  font-size: 30px; font-weight: 300; letter-spacing: -1px; color: #fff;
  font-variant-numeric: tabular-nums; display: none; margin-bottom: 2px;
  font-family: 'Inter',sans-serif;
  position: relative; z-index: 1;
}
.clock-status-label {
  font-size: 12px; color: rgba(255,255,255,.35); letter-spacing: .2px; margin-bottom: 20px;
  font-family: 'Inter',sans-serif;
  position: relative; z-index: 1;
}

/* Przyciski pomocnicze (przerwa / zakończ) w hero */
.clock-secondary-row { display: flex; gap: 10px; width: 100%; z-index: 1; position: relative; }
.clock-sec-btn {
  flex: 1; padding: 12px 10px; border-radius: 14px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Inter',sans-serif; border: 1.5px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.85); background: rgba(255,255,255,.08);
  transition: background .18s, transform .12s; letter-spacing: -.1px;
}
.clock-sec-btn:active { transform: scale(.96); background: rgba(255,255,255,.14); }
.clock-sec-btn.danger { border-color: rgba(220,38,38,.35); color: rgba(252,165,165,.9); background: rgba(220,38,38,.1); }
.clock-sec-btn.danger:active { background: rgba(220,38,38,.2); }

.clock-geo-status {
  font-size: 13px; font-weight: 600; margin-top: 16px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: 'Inter',sans-serif;
  letter-spacing: .1px;
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(255,255,255,.10);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  transition: opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1);
  position: relative; z-index: 1;
}
.clock-geo-status.geo-visible {
  animation: geoFadeIn .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes geoFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.clock-geo-ok { color: #4ADE80; }
.clock-geo-err { color: rgba(252,165,165,.95); }
.clock-geo-loading { color: rgba(255,255,255,.4); }

/* Reszta widoku — przezroczysta sekcja */
.clock-body { background: transparent; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

.clock-history-card {
  background: linear-gradient(145deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);
  border: 1px solid rgba(255,255,255,.10); border-radius: var(--radius-lg); overflow: hidden;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.18);
  position: relative;
}
.clock-history-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
}
.clock-history-title { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .5px; padding: 12px 14px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
.clock-session-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  transition: background .12s;
}
.clock-session-row:hover { background: rgba(255,255,255,.03); }
.clock-session-row:last-child { border-bottom: none; }
.csr-date { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); min-width: 70px; }
.csr-times { flex: 1; font-size: 13px; font-weight: 600; color: #fff; }
.csr-break { font-size: 11px; color: var(--warn); font-weight: 500; margin-top: 1px; }
.csr-dur { text-align: right; }
.csr-dur-h { font-size: 15px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.csr-dur-min { font-size: 10px; color: var(--text-3); }

/* Manager live panel */
.clock-live-card {
  background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.05) 100%);
  border: 1px solid rgba(255,255,255,.12); border-radius: 20px; overflow: hidden;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.10);
  position: relative;
}
.clock-live-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
}
.clock-live-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; padding: 12px 14px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.clock-live-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); transition: background .12s; }
.clock-live-row:hover { background: rgba(255,255,255,.03); }
.clock-live-row:last-child { border-bottom: none; }
.clr-name { flex: 1; font-size: 13px; font-weight: 600; }
.clr-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.clr-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.clr-badge-in { background: var(--green-bg); color: var(--green); }
.clr-badge-break { background: rgba(251,191,36,.12); color: var(--warn); }
.clr-badge-out { background: var(--bg-solid); color: var(--text-3); border: 1px solid var(--border); }
.clr-time { font-size: 12px; color: var(--text-3); min-width: 60px; text-align: right; }
.clr-edit-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--text-3); cursor: pointer; font-family: var(--font); white-space: nowrap; }
.clr-edit-btn:active { background: var(--bg-solid); }

/* Modal edycji sesji */
.sess-edit-modal { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sem-title { font-size: 16px; font-weight: 700; color: var(--text); }
.sem-name { font-size: 13px; color: var(--text-3); margin-top: -8px; }
.sem-field { display: flex; flex-direction: column; gap: 4px; }
.sem-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
.sem-input { border: 1px solid var(--border-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: var(--font); color: var(--text); background: var(--bg-card); -webkit-appearance: none; }
.sem-input:focus { outline: none; border-color: var(--brand); }
.sem-row { display: flex; gap: 10px; }
.sem-row .sem-field { flex: 1; }
.sem-actions { display: flex; gap: 10px; padding-top: 4px; }
.sem-btn-save { flex: 1; background: var(--brand); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; }
.sem-btn-del { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239,68,68,.3); border-radius: 8px; padding: 12px 16px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; }

/* ─── Chat zespołowy ─── */
.chat-screen { display: flex; flex-direction: column; height: 100%; }
.chat-msgs {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch;
}
.chat-bubble-wrap-UNUSED { display: flex; }
.chat-av {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: white;
}
/* ─── Chat bubbles — WhatsApp style ─── */
.chat-bubble-wrap { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 2px; padding: 0 12px; }
.chat-bubble-wrap.mine { flex-direction: row-reverse; }
.chat-bubble-wrap.grouped { margin-bottom: 1px; }
.chat-av-col { width: 32px; flex-shrink: 0; display: flex; align-items: flex-end; }
.chat-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
.chat-av-placeholder { width: 32px; }
.chat-msg-col { display: flex; flex-direction: column; max-width: 75%; }
.chat-bubble-wrap.mine .chat-msg-col { align-items: flex-end; }
.chat-sender { font-weight: 600; font-size: 11px; color: var(--brand); margin-bottom: 3px; padding-left: 4px; }
.chat-bubble {
  padding: 8px 12px 6px; word-break: break-word; position: relative;
  font-size: 15px; line-height: 1.45;
}
/* Wiadomości innych — ciemne po lewej (Revolut-style) */
.chat-bubble.other {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.07); color: var(--text);
  border-radius: 18px 18px 18px 4px;
}
/* Wiadomości własne — bordowe po prawej */
.chat-bubble-wrap.mine .chat-bubble {
  background: var(--brand); color: white;
  border-radius: 18px 18px 4px 18px;
}
/* Grupowanie — zaokrąglenia dla środkowych w grupie */
.chat-bubble.other.in-group { border-radius: 4px 18px 18px 4px; }
.chat-bubble-wrap.mine .chat-bubble.in-group { border-radius: 18px 4px 4px 18px; }
.chat-bubble.other.group-last { border-radius: 4px 18px 18px 18px; }
.chat-bubble-wrap.mine .chat-bubble.group-last { border-radius: 18px 4px 18px 18px; }
.chat-meta { font-size: 10px; color: var(--text-3); margin-top: 3px; padding: 0 4px; }
.chat-bubble-wrap.mine .chat-meta { text-align: right; color: rgba(255,255,255,.6); }
/* Znacznik czasu w bańce */
.chat-time-inline { font-size: 10px; opacity: .6; margin-left: 6px; float: right; margin-top: 3px; }
.chat-input-bar {
  display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.04) 100%);
  border-top: 1px solid rgba(255,255,255,.08); align-items: flex-end;
}
.chat-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 22px;
  font-size: 14px; font-family: var(--font); outline: none; resize: none;
  max-height: 120px; line-height: 1.4; transition: border-color .15s;
  background: var(--bg-solid); color: var(--text);
}
.chat-input:focus { border-color: var(--brand-light); background: var(--surface); }
.chat-send-btn {
  width: 42px; height: 42px; border-radius: 50%; background: var(--brand);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s; color: white;
  box-shadow: 0 2px 10px rgba(123,29,46,.35);
}
.chat-send-btn:active { transform: scale(.93); }
.chat-send-btn svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; }
.chat-day-label {
  text-align: center; font-size: 11px; color: var(--text-3); font-weight: 500;
  padding: 4px 10px; background: var(--border); border-radius: 10px;
  align-self: center; margin: 4px 0;
}
.chat-empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }

/* ─── Dashboard pracownika ─── */
.emp-dash { padding: 0 0 100px; min-height: calc(100dvh - 56px); background: transparent; }
.emp-dash-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 16px 12px;
}
.emp-dash-greeting { font-size: 12px; color: var(--text-3); font-weight: 500; letter-spacing: .2px; }
.emp-dash-name { font-size: 22px; font-weight: 700; letter-spacing: -.5px; color: var(--text); line-height: 1.1; margin-top: 2px; }
.emp-dash-dept-badge {
  background: var(--accent-soft); color: var(--text-2); font-size: 11px; font-weight: 600;
  padding: 5px 11px; border-radius: 20px; white-space: nowrap; text-transform: capitalize;
}
.emp-next-shift {
  margin: 4px 16px 16px; padding: 20px; border-radius: 18px;
  background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,.06) 100%);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 4px 20px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
  color: white; position: relative; overflow: hidden;
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) .05s both;
}
.emp-next-shift::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
}
.emp-next-empty { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); box-shadow: none; }
.emp-next-empty .ens-eyebrow { color: var(--text-3); }
.ens-eyebrow { font-size: 11px; font-weight: 600; opacity: .6; letter-spacing: .3px; text-transform: uppercase; margin-bottom: 8px; }
.ens-time { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.ens-dur { font-size: 12px; opacity: .6; margin-top: 8px; }
.emp-next-empty .ens-time, .emp-next-empty .ens-dur { color: var(--text-2); }
.emp-section-title {
  font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .5px;
  text-transform: uppercase; padding: 0 16px; margin-bottom: 10px;
}
.emp-week-strip {
  display: flex; gap: 6px; padding: 0 16px; margin-bottom: 20px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.emp-week-strip::-webkit-scrollbar { display: none; }
.emp-week-day {
  flex: 1; min-width: 40px; display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px; border-radius: 12px; background: linear-gradient(145deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%); border: 1.5px solid rgba(255,255,255,.09);
  gap: 4px; transition: all .15s;
}
.emp-week-today { border-color: var(--brand); background: var(--brand); color: white; }
.emp-week-we { opacity: .5; }
.ewd-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.emp-week-today .ewd-label { color: rgba(255,255,255,.6); }
.ewd-num { font-size: 15px; font-weight: 700; }
.ewd-shift { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 2px 5px; border-radius: 6px; }
.emp-week-today .ewd-shift { background: rgba(255,255,255,.2); color: white; }
.ewd-off { font-size: 10px; color: transparent; height: 18px; }
.emp-stats-row { display: flex; gap: 10px; padding: 0 16px; margin-bottom: 20px; }
.emp-stat-card {
  flex: 1;
  background: linear-gradient(145deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.05) 100%);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 14px;
  padding: 14px 10px; text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform .15s;
}
.emp-stat-card:active { transform: scale(.97); }
.esc-val { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.esc-label { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 3px; }
.emp-past-list {
  margin: 0 16px; border-radius: 16px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.10);
  background: linear-gradient(145deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.18);
  position: relative;
}
.emp-past-list::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
}
.emp-past-row {
  display: flex; align-items: center; padding: 13px 14px; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.emp-past-row:last-child { border-bottom: none; }
.epr-date { flex: 1; font-size: 13px; font-weight: 500; color: var(--text-2); }
.epr-time { font-size: 13px; font-weight: 600; color: var(--text); }
.epr-h { font-size: 12px; color: var(--text-3); min-width: 36px; text-align: right; }

/* ─── Badge powiadomień ─── */
.bnav-badge {
  position: absolute; top: 4px; right: 50%; transform: translateX(calc(50% + 10px));
  background: var(--danger); color: white; font-size: 9px; font-weight: 700;
  min-width: 16px; height: 16px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; padding: 0 4px;
  border: 2px solid var(--bg); pointer-events: none;
}

/* ─── Profil pracownika (sheet) ─── */
.profile-sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400;
  display: flex; align-items: flex-end; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.profile-sheet-overlay.open { opacity: 1; pointer-events: all; }
.profile-sheet {
  background: linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.10) 100%);
  width: 100%; border-radius: 24px 24px 0 0;
  padding: 0 0 calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 85vh; overflow-y: auto;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  border: 1px solid rgba(255,255,255,.12); border-bottom: none;
  box-shadow: 0 -8px 40px rgba(0,0,0,.4);
}
.profile-sheet-overlay.open .profile-sheet { transform: translateY(0); }
.profile-sheet-pill { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 12px auto 0; }
.profile-sheet-header {
  display: flex; align-items: center; gap: 14px; padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.profile-sheet-av {
  width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 20px; font-weight: 700; color: white; flex-shrink: 0;
}
.profile-sheet-name { font-size: 18px; font-weight: 700; letter-spacing: -.4px; }
.profile-sheet-role { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.profile-stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: rgba(255,255,255,.08); border-top: 1px solid rgba(255,255,255,.1); border-bottom: 1px solid rgba(255,255,255,.1); margin-top: 0; }
.profile-stat { background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.05) 100%); padding: 14px 10px; text-align: center; animation: countUp .5s cubic-bezier(.2,.8,.2,1) .1s both; }
.profile-stat-val { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
.profile-stat-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 2px; letter-spacing: .2px; }
.profile-actions { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.profile-action-btn {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: linear-gradient(135deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.05) 100%);
  border: 1px solid rgba(255,255,255,.10); border-radius: var(--radius-lg);
  cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--text); transition: all .15s cubic-bezier(.2,.8,.2,1); text-align: left;
  box-shadow: 0 1px 8px rgba(0,0,0,.12);
}
.profile-action-btn:hover { background: linear-gradient(135deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.08) 100%); border-color: rgba(255,255,255,.15); }
.profile-action-btn:active { transform: scale(.97); }
.profile-action-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; color: var(--text-3); flex-shrink: 0; }
.profile-action-btn.danger { color: var(--danger); }
.profile-action-btn.danger svg { color: var(--danger); }

/* ─── Animacje wejścia kart ─── */
@keyframes slide-up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
.anim-in { animation: slide-up .3s cubic-bezier(.2,.8,.2,1) both; }
.anim-in:nth-child(1) { animation-delay: .03s; }
.anim-in:nth-child(2) { animation-delay: .08s; }
.anim-in:nth-child(3) { animation-delay: .13s; }
.anim-in:nth-child(4) { animation-delay: .18s; }
.anim-in:nth-child(5) { animation-delay: .23s; }

  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(typeof currentUser!=='undefined'&&currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  return extra?{...h,...extra}:h;
}

async function sbFetch(path, opts={}) {
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  const {headers:extraH, ...restOpts}=opts;
  const r=await fetch(SB_URL+path,{headers:{...h,...(extraH||{})}, ...restOpts});
  if(!r.ok){
    const txt=await r.text();
    let msg=txt;
    try{const j=JSON.parse(txt);msg=j.message||j.hint||txt;}catch(_){}
    throw new Error(msg);
  }
  if(r.status===204) return [];
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

    if(data.error||!data.access_token) throw new Error(data.error_description||'Błąd logowania');
    currentUser=data;
    const rows=await sbFetch(`/rest/v1/user_roles?email=eq.${encodeURIComponent(email)}&select=role`).catch(()=>[]);

    saveSession();
    // Załaduj employees (mały request) żeby splash miał imię, max 2s timeout

      const empRows=await Promise.race([
        sbFetch('/rest/v1/employees?select=id,name,email,department,rate_net&active=eq.true&order=department,name'),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),2000))
      ]);

    document.getElementById('app').style.display='block';

// Wyciąga ładne imię z emaila — dla kont właściciela zwraca "Dawid" itp.
function getDisplayName(email, fromDb=null){
  if(fromDb) return fromDb.trim().split(/\s+/)[0];
  const local=email.split('@')[0].replace(/[0-9]/g,'');
  // Sprawdź znane konta
  const knownMap={'makowskidawid':'Dawid'};
  const key=email.split('@')[0].toLowerCase().replace(/[0-9]/g,'');
  if(knownMap[key]) return knownMap[key];
  // Próbuj wyciągnąć imię (zakładamy format: nazwisko+imię lub imię+nazwisko)
  // np. "makowskidawid" → capitalize("dawid") ? trudne bez słownika
  // Przynajmniej capitalize pierwszą literę
  return local.charAt(0).toUpperCase()+local.slice(1);
}

function showWelcomeSplash(email, overrideName=null){
  return new Promise(resolve=>{
    const now=new Date(); const h=now.getHours();
    const gr=h<12?'Dzień dobry':(h<18?'Cześć':'Dobry wieczór');
    // Użyj gotowego imienia (z bazy) lub fallback z emaila
    const firstName=overrideName||getDisplayName(email);

    const splash=document.createElement('div');
    splash.id='welcome-splash';
    splash.style.cssText=`
      position:fixed;inset:0;z-index:9999;
      background:#1C0810;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;
      pointer-events:none;
    `;
    splash.innerHTML=`
      <div style="
        font-family:'Inter',sans-serif;
        font-size:17px;font-weight:500;
        color:rgba(255,255,255,.45);
        letter-spacing:.3px;
        opacity:0;
        transform:translateY(12px);
        transition:opacity .5s ease,transform .5s ease;
      " id="sp-greet">${gr},</div>
      <div style="
        font-family:'Inter',sans-serif;
        font-size:48px;font-weight:800;
        color:#fff;
        letter-spacing:-2px;
        line-height:1;
        opacity:0;
        transform:translateY(16px);
        transition:opacity .55s ease .1s,transform .55s ease .1s;
      " id="sp-name">${firstName}!</div>
    `;
    document.body.appendChild(splash);

    // Animate in
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        document.getElementById('sp-greet').style.cssText+='opacity:1;transform:translateY(0)';
        document.getElementById('sp-name').style.cssText+='opacity:1;transform:translateY(0)';
      });
    });

    // Czekaj 1.6s, potem pokaż app (pod splash) i fade out splash
    setTimeout(()=>{
      // Najpierw ukryj auth i pokaż app — pod splashem, niewidoczne dla użytkownika
      resolve();
      // Potem fade out splasha
      splash.style.transition='opacity .45s ease';
      splash.style.opacity='0';
      setTimeout(()=>{ splash.remove(); }, 460);
    }, 1600);
  });
}

// Zapisz sesję do localStorage
function saveSession(){
  if(!currentUser) return;
  try{localStorage.setItem('oa_session',JSON.stringify({user:currentUser,role:currentRole,ts:Date.now()}));}catch(_){}
}

// Przywróć sesję z localStorage (max 12h)
async function tryRestoreSession(){
  try{
    const raw=localStorage.getItem('oa_session');
    if(!raw) return false;
    const {user,role,ts}=JSON.parse(raw);
    if(!user||!role||Date.now()-ts>12*3600*1000) return false;
    // Sprawdź czy token nadal ważny
    if(user.expires_at && Date.now()/1000 > user.expires_at-60) return false;
    currentUser=user; currentRole=role;
    return true;
  }catch(_){return false;}
}

async function loadWorkSessions(){

  const me=getCurrentEmployee();
  if(me){

async function loadShiftsForCurrentPeriod(){
  let from,to;
  if(schedView==='week'){
    const w=getWeekRange(currentWeekOffset);
    from=w.from; to=w.to;
  } else {
    const m=getMonthRange(currentMonthOffset);
    from=m.from; to=m.to;
  }
  shifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);
}

function getWeekRange(offset){
  const now=new Date();
  const dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now); mon.setDate(now.getDate()-dow+offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return{from:fd(mon),to:fd(sun),monDate:mon};
}

function getMonthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  return{from:fd(first),to:fd(last),first,last,year:first.getFullYear(),month:first.getMonth()};
}

function fd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function today(){return fd(new Date());}
function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm); if(m<0)m+=1440; return m/60;
}
function avatarColor(n){
  const c=['#7B1D2E','#6B1520','#8B2535','#5A1018','#9B2D40','#4A0D14','#7F1F30','#601228'];
  let h=0; for(let ch of n)h=ch.charCodeAt(0)+((h<<5)-h); return c[Math.abs(h)%c.length];
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function wNum(d){const j4=new Date(d.getFullYear(),0,4);return Math.ceil((((d-j4)/86400000)+j4.getDay()+1)/7);}
function monthName(m){return['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'][m];}

function showView(v, pushHistory=true){
  const prev=currentView;
  currentView=v;
  if(pushHistory && prev!==v) history.pushState({view:v},'',`#${v}`);
  // Ustaw klasę widoku na body (jak Revolut — każdy widok = własny gradient)
  const viewClasses = ['view-home','view-sched','view-clock','view-dash','view-chat','view-recipes','view-recipe-detail','view-kitchen','view-finance','view-emps','view-avail','view-waste','view-handover','view-manager'];
  document.body.classList.remove(...viewClasses);
  document.body.classList.add('view-'+v);
  updateSubTopbar();
  // Header usunięty — zawsze ukryty

  // Dolny nav — tylko w starych widokach
  const bnav=document.getElementById('bottom-nav');
  const mc=document.getElementById('main-content');
  if(VIEWS_WITH_BNAV.has(v)){
    bnav.style.display='flex';
    mc.classList.remove('no-bnav');
    document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
    const el=document.getElementById('nav-'+v);
    if(el) el.classList.add('active');
  } else {
    bnav.style.display='none';
    mc.classList.add('no-bnav');
  }
  // FAB chat — ukryj w chacie
  const fab=document.getElementById('chat-fab');
  if(fab) fab.style.display=v==='chat'?'none':'flex';
  // Tryb chat — specjalny layout fullscreen
  mc.classList.toggle('chat-view', v==='chat');
  // Animacja wejścia (synchroniczne widoki)
  if(v!=='chat' && v!=='dash'){
    mc.classList.remove('view-transition'); void mc.offsetWidth; mc.classList.add('view-transition');
  }
  renderView();
}

            <div class="hw-stat-lbl">Pracowników</div>
          </div>
        </div>

      </div>
    </div>

  </div>`;

  updateFabBadge();

  /* Live timer — aktualizuj co sekundę gdy trwa zmiana */
  if(window._hwTimerInt) clearInterval(window._hwTimerInt);
  if(active){
    const startMs = new Date(active.clock_in).getTime();
    const shiftStart = myShiftToday ? new Date(`${tod}T${(myShiftToday.start_time||'00:00').slice(0,5)}:00`).getTime() : startMs;
    const shiftEnd   = myShiftToday ? new Date(`${tod}T${(myShiftToday.end_time||'23:59').slice(0,5)}:00`).getTime() : (shiftStart + 8*3600000);
    const shiftLen   = Math.max(shiftEnd - shiftStart, 1);
    const tick = () => {
      const el = document.getElementById('hw-live-timer');
      const fill = document.getElementById('hw-shift-fill');
      if(!el) { clearInterval(window._hwTimerInt); return; }
      const elapsed = Date.now() - startMs;
      const h = Math.floor(elapsed/3600000);
      const m = Math.floor((elapsed%3600000)/60000);
      const s = Math.floor((elapsed%60000)/1000);
      el.textContent = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if(fill){
        const pct = Math.min(100, (elapsed / shiftLen) * 100);
        fill.style.width = pct + '%';
      }
    };
    tick();
    window._hwTimerInt = setInterval(tick, 1000);
  }
}

function toggleHwMore(btn){
  const extra = document.getElementById('hw-extra-rows');
  if(!extra) return;
  const open = extra.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.querySelector('span') && (btn.querySelector('span').textContent = open ? 'Mniej' : 'Więcej');
  // Zamień tekst w przycisku
  const textNode = [...btn.childNodes].find(n=>n.nodeType===3);
  if(textNode) textNode.textContent = open ? ' Mniej' : ' Więcej';
}

function hbTap(el, view){
  if(!el) return;
  const wrap=el.querySelector('.hb-ripple-wrap');
  if(wrap){
    const r=document.createElement('span');
    r.className='hb-ripple';
    wrap.innerHTML=''; wrap.appendChild(r);
    setTimeout(()=>r.remove(),500);
  }
  // Delikatne wygaszenie całego home wrapu przed przejściem
  const hw=el.closest('.hw-wrap');
  if(hw){ hw.style.transition='opacity .18s ease'; hw.style.opacity='0'; }
  setTimeout(()=>showView(view), 200);
}

function filterRecipesSearch(q){
  const resultsEl = document.getElementById('recipe-search-results');
  const catsEl = document.getElementById('recipe-categories-list');
  if(!resultsEl||!catsEl) return;
  const term = q.trim().toLowerCase();
  if(!term){
    resultsEl.style.display='none';
    catsEl.style.display='flex';
    resultsEl.innerHTML='';
    return;
  }
  const hits = recipesLocal.filter(r=>
    r.name.toLowerCase().includes(term) ||
    r.ingredients.some(i=>i.name.toLowerCase().includes(term))
  );
  catsEl.style.display='none';
  resultsEl.style.display='flex';
  if(hits.length===0){
    resultsEl.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;">Brak wyników dla „${q}"</div>`;
  } else {
    const catMap={};
    RECIPE_CATEGORIES.forEach(c=>catMap[c.id]=c.label);
    resultsEl.innerHTML=hits.map(r=>`
      <div onclick="currentRecipeId='${r.id}';showView('recipe-detail');" style="background:var(--bg-card);border:1px solid var(--border-2);border-radius:14px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px;">${r.name}</div>
            <div style="font-size:11px;color:var(--text-3);">${catMap[r.category]||r.category} · ${r.ingredients.length} skł.</div>
          </div>
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>`).join('');
  }
}

function parseIngredients(raw){
  return raw.split('\n').map(l=>{
    const p=l.split('|').map(x=>x.trim());
    return{name:p[0]||'',qty:p[1]||'',unit:p[2]||''};
  }).filter(x=>x.name);
}

function saveNewRecipe(){
  const name=document.getElementById('rc-name').value.trim();
  if(!name){showToast('Podaj nazwę dania');return;}
  const r={
    id:'r'+(Date.now()),
    category:document.getElementById('rc-cat').value,
    name,
    portions:parseInt(document.getElementById('rc-portions').value)||1,
    prep_time:parseInt(document.getElementById('rc-time').value)||30,
    allergens:document.getElementById('rc-allergens').value.split(',').map(x=>x.trim()).filter(Boolean),
    ingredients:parseIngredients(document.getElementById('rc-ingredients').value),
    method:document.getElementById('rc-method').value.trim(),
    notes:document.getElementById('rc-notes').value.trim(),
  };
  recipesLocal.push(r);
  document.getElementById('recipe-modal').remove();
  showToast('Receptura dodana');
  renderView();
}

function saveEditRecipe(id){
  const idx=recipesLocal.findIndex(x=>x.id===id); if(idx<0) return;
  recipesLocal[idx]={
    ...recipesLocal[idx],
    category:document.getElementById('re-cat').value,
    name:document.getElementById('re-name').value.trim(),
    portions:parseInt(document.getElementById('re-portions').value)||1,
    prep_time:parseInt(document.getElementById('re-time').value)||30,
    allergens:document.getElementById('re-allergens').value.split(',').map(x=>x.trim()).filter(Boolean),
    ingredients:parseIngredients(document.getElementById('re-ingredients').value),
    method:document.getElementById('re-method').value.trim(),
    notes:document.getElementById('re-notes').value.trim(),
  };
  document.getElementById('recipe-edit-modal').remove();
  showToast('Zapisano');
  renderView();
}

function deleteRecipe(id){
  recipesLocal=recipesLocal.filter(x=>x.id!==id);
  document.getElementById('recipe-edit-modal')?.remove();
  currentRecipeId=null;
  showToast('Receptura usunięta');
  showView('recipes');
}

function openAddWaste(){
  const dateEl = document.getElementById('waste-date');
  if(dateEl) document.getElementById('waste-date') // keep date
  const modal = document.getElementById('waste-modal');
  if(modal){ modal.style.display='flex'; }
  // Reset pól
  ['wm-ingredient','wm-qty','wm-note'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('wm-suggestions').style.display='none';
}

function closeWasteModal(){
  const modal = document.getElementById('waste-modal');
  if(modal) modal.style.display='none';
}

function filterIngredients(val){
  const box = document.getElementById('wm-suggestions');
  if(!box) return;
  const q = val.trim().toLowerCase();
  const matches = DEFAULT_INGREDIENTS.filter(i=>i.toLowerCase().includes(q)).slice(0,12);
  if(matches.length===0 && q.length===0){
    box.style.display='none'; return;
  }
  box.innerHTML = matches.map(i=>
    `<div onclick="selectIngredient('${i.replace(/'/g,"\\'")}');event.stopPropagation()"
      style="padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)"
      onmouseenter="this.style.background='rgba(139,26,46,.04)'"
      onmouseleave="this.style.background=''">${i}</div>`
  ).join('');
  if(q && !DEFAULT_INGREDIENTS.some(i=>i.toLowerCase()===q)){
    box.innerHTML+=`<div onclick="selectIngredient('${val.replace(/'/g,"\\'")}');event.stopPropagation()"
      style="padding:10px 14px;cursor:pointer;font-size:14px;color:var(--brand)"
      onmouseenter="this.style.background='rgba(139,26,46,.04)'"
      onmouseleave="this.style.background=''">+ Dodaj "${val}"</div>`;
  }
  box.style.display='block';
}

function selectIngredient(name){
  const inp = document.getElementById('wm-ingredient');
  if(inp) inp.value=name;
  const box = document.getElementById('wm-suggestions');
  if(box) box.style.display='none';
}

async function saveWaste(){
  const ingredient = document.getElementById('wm-ingredient')?.value.trim();
  const qty = parseFloat(document.getElementById('wm-qty')?.value);
  const unit = document.getElementById('wm-unit')?.value;
  const reason = document.getElementById('wm-reason')?.value;
  const note = document.getElementById('wm-note')?.value.trim()||null;
  const date = document.getElementById('waste-date')?.value;
  if(!ingredient){showToast('Podaj składnik');return;}
  if(!qty||qty<=0){showToast('Podaj ilość');return;}
  const emp = getCurrentEmployee();
  try{
    await sbFetch('/rest/v1/waste_items',{
      method:'POST',
      headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({item_name:ingredient,quantity:qty,unit,reason,notes:note,date,employee_id:emp?.id||null})
    });
    closeWasteModal();
    showToast('✓ Strata zapisana');
    loadWaste();
  }catch(e){
    showToast('Błąd: '+e.message.slice(0,80));
  }
}

// Zamknij suggestions po kliknięciu poza
document.addEventListener('click',e=>{
  const box=document.getElementById('wm-suggestions');
  if(box && !box.contains(e.target) && e.target.id!=='wm-ingredient') box.style.display='none';
});

function setHandoverPriority(p, btn){
  document.getElementById('hm-priority').value=p;
  const colors={high:'#DC2626',medium:'#D97706',low:'#16A34A'};
  document.querySelectorAll('#hm-priority-btns button').forEach(b=>{
    const active = b===btn;
    b.style.borderColor=active?colors[p]:'var(--border)';
    b.style.color=active?colors[p]:'var(--text-2)';
    b.style.background=active?colors[p]+'20':'var(--bg-card)';
  });
}

  CREATE POLICY "managers_all" ON cash_settlements

let settlementsData = [];
let settlementDateOffset = 0; // 0 = dziś
let settlementFormVisible = false;

async function renderSettlements(mc){
  if(!['owner','manager'].includes(currentRole)){
    mc.innerHTML=`<div class="page-bar"><button class="section-back-btn" onclick="goHome()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Wróć</button><div class="page-bar-title">Rozliczenia</div></div><div style="text-align:center;padding:60px 24px;color:var(--text-3)">Brak dostępu</div>`;

  }

  // Załaduj dane za ostatnie 30 dni
  const dateFrom = new Date(); dateFrom.setDate(dateFrom.getDate()-30);
  const dfStr = dateFrom.toISOString().slice(0,10);

  let rows = [];
  try{
    const res = await sbFetch(`/rest/v1/cash_settlements?select=*&date=gte.${dfStr}&order=date.desc,created_at.desc`);
    if(res.ok) rows = await res.json();
  }catch(e){ console.warn('settlements fetch',e); }
  settlementsData = rows;

  renderSettlementsUI(mc, rows);

function sfField(id, label){
  return `<div style="min-width:0">
    <label style="font-size:11px;color:var(--text-3);display:block;margin-bottom:5px;font-weight:500;letter-spacing:.3px;text-transform:uppercase">${label}</label>
    <input type="number" id="${id}" step="0.01" placeholder="0.00" inputmode="decimal" style="${inputStyle()}">
  </div>`;
}

function inputStyle(){
  return `width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:var(--text);font-size:15px;font-weight:400;font-family:var(--font);box-sizing:border-box;outline:none;-webkit-appearance:none;`;
}

function fmtDatePL(ds){
  if(!ds) return '';
  const [y,m,d] = ds.split('-');
  const names=['','sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
  return `${parseInt(d)} ${names[parseInt(m)]} ${y}`;
}

function settlementCard(r){
  const diff = r.discrepancy!=null ? parseFloat(r.discrepancy) : null;
  const diffColor = diff===null ? 'var(--text-3)' : Math.abs(diff)<1 ? 'var(--green)' : diff>0 ? 'rgba(255,160,80,1)' : '#FF6B6B';
  const diffLabel = diff===null ? '' : `${diff>=0?'+':''}${diff.toFixed(2)} zł`;
  const verifiedBadge = r.verified
    ? `<span style="font-size:11px;padding:2px 8px;border-radius:6px;background:var(--green-bg);color:var(--green);font-weight:700;flex-shrink:0">OK</span>`
    : `<span style="font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--text-3);font-weight:600;flex-shrink:0">Oczekuje</span>`;

  const utarg = r.field_c!=null ? parseFloat(r.field_c).toFixed(2) : null;
  return `<div onclick="openSettlementDetail('${r.id}')"
    style="display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:6px;background:rgba(255,255,255,.04);border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s"
    ontouchstart="this.style.background='rgba(255,255,255,.08)'" ontouchend="this.style.background='rgba(255,255,255,.04)'">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--brand-light);flex-shrink:0">${(r.waiter_name||'?')[0].toUpperCase()}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
        <div style="font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.2px">${r.waiter_name}</div>
        ${utarg?`<div style="font-size:16px;font-weight:700;color:var(--text)">${utarg} zł</div>`:''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:13px;color:var(--text-3)">${fmtDatePL(r.date)}</div>
        <div style="display:flex;align-items:center;gap:8px">
          ${diff!==null?`<span style="font-size:13px;font-weight:600;color:${diffColor}">${diffLabel}</span>`:''}
          ${verifiedBadge}
        </div>
      </div>
    </div>
  </div>`;
}

function openSettlementForm(){
  const wrap = document.getElementById('settlement-form-wrap');
  const overlay = document.getElementById('sf-overlay');
  if(!wrap) return;
  // Przenieś do body, żeby uniknąć containing-block z transform na #main-content
  if(overlay && overlay.parentElement !== document.body) document.body.appendChild(overlay);
  if(wrap.parentElement !== document.body) document.body.appendChild(wrap);
  overlay && (overlay.style.display='block');
  wrap.style.visibility='visible';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ wrap.style.transform='translateY(0)'; });
  });
  const inp = document.getElementById('sf-date');
  if(inp && !inp.value) inp.value = new Date().toISOString().slice(0,10);
}

function openSettlementFormFor(date){
  openSettlementForm();
  const inp = document.getElementById('sf-date');
  if(inp) inp.value = date;
}

function cancelSettlementForm(){
  const wrap = document.getElementById('settlement-form-wrap');
  const overlay = document.getElementById('sf-overlay');
  if(wrap){
    wrap.style.transform='translateY(100%)';
    setTimeout(()=>{ wrap.style.visibility='hidden'; }, 320);
  }
  if(overlay) overlay.style.display='none';
  const inp = document.getElementById('sf-photo');
  if(inp) inp.value='';
  const preview = document.getElementById('sf-photo-preview');
  if(preview) preview.style.display='none';
  const placeholder = document.getElementById('sf-photo-placeholder');
  if(placeholder) placeholder.style.display='flex';
}

function onSettlementPhotoChange(input){
  const file = input.files[0];
  const preview = document.getElementById('sf-photo-preview');
  const placeholder = document.getElementById('sf-photo-placeholder');
  const img = document.getElementById('sf-photo-img');
  if(!file) return;
  if(img) img.src = URL.createObjectURL(file);
  if(preview) preview.style.display='block';
  if(placeholder) placeholder.style.display='none';
}

async function saveSettlement(){
  const btn = document.getElementById('sf-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Zapisywanie...'; }

  try{
    const date = document.getElementById('sf-date')?.value;
    const waiter = document.getElementById('sf-waiter')?.value?.trim();
    if(!date||!waiter){
      if(btn){ btn.disabled=false; btn.textContent='Zapisz rozliczenie'; }
      showToast('Podaj datę i kelnera');
      return;
    }

    // Upload zdjęcia do Supabase Storage
    let photoUrl = null;
    const photoInput = document.getElementById('sf-photo');
    if(photoInput?.files[0]){
      const file = photoInput.files[0];
      const ext = file.name.split('.').pop();
      const path = `${date}/${waiter.replace(/\s+/g,'-')}-${Date.now()}.${ext}`;
      const uploadRes = await fetch(`${SB_URL}/storage/v1/object/koperty/${path}`, {
        method:'POST',
        headers:{
          'apikey': SB_KEY,
          'Authorization': `Bearer ${currentUser?.access_token||SB_KEY}`,
          'Content-Type': file.type
        },
        body: file
      });
      if(uploadRes.ok){
        const uploadData = await uploadRes.json();
        photoUrl = `${SB_URL}/storage/v1/object/public/koperty/${path}`;
      } else {
        console.warn('Photo upload failed', await uploadRes.text());
      }
    }

    const payload = {
      date,
      waiter_name: waiter,
      field_c: numVal('sf-c'),
      field_d: numVal('sf-d'),
      field_e: numVal('sf-e'),
      field_g: numVal('sf-g'),
      field_h: numVal('sf-h'),
      field_j: numVal('sf-j'),
      field_k: numVal('sf-k'),
      field_n: numVal('sf-n'),
      field_nk: numVal('sf-nk'),
      field_p: numVal('sf-p'),
      field_l: numVal('sf-l'),
      comment: document.getElementById('sf-comment')?.value||null,
      photo_url: photoUrl,
      created_by: currentUser?.user?.email||currentUser?.email||null
    };

    let res = await sbFetch('/rest/v1/cash_settlements', {
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body: JSON.stringify(payload)
    });
    // Jeśli field_nk nie istnieje jeszcze w bazie — zapisz bez niego
    if(!res.ok){
      const errText = await res.text();
      if(errText.includes('field_nk')){
        const {field_nk:_, ...payloadWithout} = payload;
        res = await sbFetch('/rest/v1/cash_settlements', {
          method:'POST', headers:{'Prefer':'return=representation'},
          body: JSON.stringify(payloadWithout)
        });
      }
      if(!res.ok) throw new Error(errText);
    }

    // Odśwież listę — zostań w widoku settlements
    showToast('Rozliczenie zapisano ✓');
    currentView = 'settlements';
    const mc = document.getElementById('main-content');
    if(mc) await renderSettlements(mc);

  }catch(e){
    console.error('saveSettlement error', e);
    showToast('Błąd zapisu: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='Zapisz rozliczenie'; }
  }
}

function numVal(id){
  const v = parseFloat(document.getElementById(id)?.value);
  return isNaN(v) ? null : v;
}

  const diff = r.discrepancy!=null ? parseFloat(r.discrepancy) : null;

    ['E — Stan końcowy', r.field_e],

    ['H — Dokumenty KW', r.field_h],
    ['J — Terminal ZAMKNIĘCIE', r.field_j],
    ['K — Karta (kasjer)', r.field_k],

  const html = `<div id="settlement-detail-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:flex-end;padding:0" onclick="if(event.target===this)this.remove()">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <div style="font-size:17px;font-weight:800;color:var(--text)">${r.waiter_name}</div>
          <div style="font-size:12px;color:var(--text-3)">${fmtDatePL(r.date)}</div>
        </div>
        <button onclick="this.closest('#settlement-detail-modal').remove()" style="background:var(--bg-solid);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--text-2)">×</button>
      </div>

      ${r.photo_url?`<img src="${r.photo_url}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;border:1px solid var(--border);margin-bottom:14px">`:''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        ${fields.map(([label,val])=>`
          <div style="background:var(--bg-solid);border:1px solid var(--border-2);border-radius:8px;padding:9px 10px">
            <div style="font-size:10px;color:var(--text-3);margin-bottom:2px">${label}</div>
            <div style="font-size:14px;font-weight:700;color:var(--text)">${parseFloat(val).toFixed(2)} zł</div>
          </div>`).join('')}
      </div>

      ${diff!==null?`<div style="background:${Math.abs(diff)<1?'var(--green-bg)':'var(--danger-bg)'};border-radius:10px;padding:12px 14px;margin-bottom:14px;text-align:center">
        <div style="font-size:11px;color:var(--text-3);margin-bottom:2px">Różnica (POS vs rozliczenie)</div>
        <div style="font-size:22px;font-weight:800;color:${diffColor}">${diff>=0?'+':''}${diff.toFixed(2)} zł</div>
      </div>`:''}

      ${r.comment?`<div style="background:var(--bg-solid);border:1px solid var(--border-2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--text-2);font-style:italic">"${r.comment}"</div>`:''}

      <div style="font-size:11px;color:var(--text-3);text-align:center">Dodano przez: ${r.created_by||'—'}</div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function loadBoard(){
  const list=document.getElementById('board-list');
  if(!list) return;
  try{
    const rows=await sbFetch('/rest/v1/board_items?select=*,employees(name)&order=pinned.desc,created_at.desc&limit=50');
    if(!Array.isArray(rows)||rows.length===0){
      list.innerHTML=`<div style="text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px">Brak ogłoszeń</div>`;

async function loadEvents(){
  const list=document.getElementById('events-list');
  if(!list) return;
  let rows=[];
  try{
    const fetched=await Promise.race([
      sbFetch('/rest/v1/events?select=*&order=date.asc&limit=60'),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),4000))
    ]);
    if(Array.isArray(fetched)&&fetched.length>0){
      rows=fetched;
    } else rows=[...eventsLocal];
  }catch(e){
    rows=[...eventsLocal];
  }
  // Zawsze zapisz do eventsData — potrzebne do otwierania szczegółów po kliknięciu
  eventsData=rows;
  if(rows.length===0){
    list.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px;">Brak zaplanowanych wydarzeń<br><span style="font-size:11px;margin-top:4px;display:block;">Naciśnij + Dodaj żeby dodać pierwsze</span></div>`;
    return;
  }
  const tod=today();
  const upcoming=rows.filter(r=>r.date>=tod).sort((a,b)=>a.date.localeCompare(b.date));
  const past=rows.filter(r=>r.date<tod).sort((a,b)=>b.date.localeCompare(a.date));
  let html='';
  if(upcoming.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);padding:4px 0 8px;">Nadchodzące</div>`;
    html+=upcoming.map(r=>eventCard(r,false)).join('');
  }
  if(past.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);padding:${upcoming.length?'20px':'4px'} 0 8px;">Archiwum</div>`;
    html+=past.slice(0,10).map(r=>eventCard(r,true)).join('');
  }
  list.innerHTML=html;
}

async function saveEvent(editId,isLocal){
  const title=document.getElementById('ev-title').value.trim();
  const date=document.getElementById('ev-date').value;
  if(!title||!date){showToast('Podaj nazwę i datę');return;}
  const data={title,date,type:document.getElementById('ev-type').value,
    description:document.getElementById('ev-desc').value.trim()||null,
    guests:parseInt(document.getElementById('ev-guests').value)||null};

  if(editId&&isLocal){
    // Edycja lokalnego
    const idx=eventsLocal.findIndex(x=>x.id===editId);
    if(idx>=0) eventsLocal[idx]={...eventsLocal[idx],...data};
    document.getElementById('event-modal')?.remove();
    showToast('Zapisano'); renderView(); return;
  }
  if(!editId){
    // Spróbuj dodać do Supabase, fallback lokalny
    try{
      await sbFetch('/rest/v1/events',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(data)});
    }catch(e){
      eventsLocal.push({id:'ev-'+Date.now(),...data,_local:true});
    }
    document.getElementById('event-modal')?.remove();
    showToast('✓ Wydarzenie dodane'); renderView(); return;
  }
  // Edycja Supabase
  try{
    await sbFetch(`/rest/v1/events?id=eq.${editId}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(data)});
  }catch(e){ showToast('Błąd: '+e.message.slice(0,60)); return; }
  document.getElementById('event-modal')?.remove();
  showToast('Zapisano'); renderView();
}

async function deleteEventLocal(id,isLocal){
  if(!confirm('Usunąć wydarzenie?')) return;
  if(isLocal){
    eventsLocal=eventsLocal.filter(x=>x.id!==id);
    showToast('Usunięto'); renderView(); return;
  }
  try{
    await sbFetch(`/rest/v1/events?id=eq.${id}`,{method:'DELETE'});
    showToast('Usunięto'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function deleteEvent(id){
  deleteEventLocal(id,false);
}

function renderSched(mc){

    return;
  }
  if(schedView==='week') renderWeek(mc);

function renderEmployeeDashboard(mc){
  const emp=getCurrentEmployee();
  const tod=today();
  const {from,to,monDate}=getWeekRange(0);
  const myShifts=emp?shifts.filter(s=>s.employee_id===emp.id):[];
  const thisWeekShifts=myShifts.filter(s=>s.date>=from&&s.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const totalH=thisWeekShifts.reduce((s,sh)=>s+calcH(sh.start_time||'10:00:00',sh.end_time||'18:00:00'),0);

  // Następna zmiana
  const upcoming=myShifts.filter(s=>s.date>=tod).sort((a,b)=>a.date.localeCompare(b.date));
  const next=upcoming[0];

  // Dni tygodnia
  const days=['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
  let weekHtml='';
  for(let i=0;i<7;i++){
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    const dStr=fd(d);
    const shift=thisWeekShifts.find(s=>s.date===dStr);
    const isT=dStr===tod;
    const isWe=i>=5;
    weekHtml+=`<div class="emp-week-day${isT?' emp-week-today':''}${isWe?' emp-week-we':''}">
      <div class="ewd-label">${days[i]}</div>
      <div class="ewd-num">${d.getDate()}</div>
      ${shift
        ? `<div class="ewd-shift">${(shift.start_time||'10:00').slice(0,5)}</div>`
        : `<div class="ewd-off">${isWe?'—':''}&#8203;</div>`}
    </div>`;
  }

  // Ostatnie zmiany (grafik — nie ewidencja czasu)
  const past=myShifts.filter(s=>s.date<tod).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);

  let html=`<div class="emp-dash">
    <div class="emp-dash-header">
      <div>
        <div class="emp-dash-greeting">${greeting()}</div>
        <div class="emp-dash-name">${emp?.name||currentUser?.email?.split('@')[0]||''}</div>
      </div>
      <div class="emp-dash-dept-badge">${emp?.department||''}</div>
    </div>`;

  // Karta następna zmiana
  if(next){
    const daysUntil=Math.round((new Date(next.date)-new Date(tod))/(86400000));
    const when=daysUntil===0?'Dziś':daysUntil===1?'Jutro':fmtDateLong(next.date);
    const h=calcH(next.start_time||'10:00:00',next.end_time||'18:00:00');
    html+=`<div class="emp-next-shift">
      <div class="ens-eyebrow">Następna zmiana · ${when}</div>
      <div class="ens-time">${(next.start_time||'10:00').slice(0,5)} – ${(next.end_time||'18:00').slice(0,5)}</div>
      <div class="ens-dur">${h.toFixed(1)} h pracy · ${fmtDateLong(next.date)}</div>
    </div>`;
  } else {
    html+=`<div class="emp-next-shift emp-next-empty">
      <div class="ens-eyebrow">Następna zmiana</div>
      <div class="ens-time" style="font-size:18px;opacity:.5">Brak zaplanowanych zmian</div>
    </div>`;
  }

  // Tydzień w pigułce
  html+=`<div class="emp-section-title">Ten tydzień${totalH>0?` · ${totalH.toFixed(1)} h`:''}</div>
  <div class="emp-week-strip">${weekHtml}</div>`;

  // Statystyki mini
  html+=`<div class="emp-stats-row">
    <div class="emp-stat-card">
      <div class="esc-val">${thisWeekShifts.length}</div>
      <div class="esc-label">Zmiany w tygodniu</div>
    </div>
    <div class="emp-stat-card">
      <div class="esc-val">${totalH>0?totalH.toFixed(1)+'h':'—'}</div>
      <div class="esc-label">Godziny w tygodniu</div>
    </div>
    <div class="emp-stat-card">
      <div class="esc-val">${upcoming.length}</div>
      <div class="esc-label">Nadchodzące</div>
    </div>
  </div>`;

  // Ostatnie zmiany
  if(past.length>0){
    html+=`<div class="emp-section-title">Historia</div><div class="emp-past-list">`;
    past.forEach(s=>{
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      html+=`<div class="emp-past-row">
        <div class="epr-date">${fmtDateLong(s.date)}</div>
        <div class="epr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
        <div class="epr-h">${h.toFixed(1)} h</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div>`;
  mc.innerHTML=html;
}

function greeting(){
  const h=new Date().getHours();
  if(h<12) return'Dzień dobry';
  if(h<18) return'Dobry wieczór';
  return'Dobry wieczór';
}

function fmtDateLong(dateStr){
  if(!dateStr) return'';
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
}

function openEmpModal(id){
  const emp=employees.find(e=>e.id===id); if(!emp)return;
  document.getElementById('em-id').value=id;
  document.getElementById('em-name').value=emp.name;
  document.getElementById('em-dept').value=emp.department;
  document.getElementById('em-rate').value=emp.rate_net||0;
  document.getElementById('em-email').value=emp.email||'';
  document.getElementById('em-sub').textContent=emp.department+' · '+(emp.email||'');
  openModal('emp-modal');
}

async function saveEmp(){
  const id=document.getElementById('em-id').value;
  const p={name:document.getElementById('em-name').value,department:document.getElementById('em-dept').value,rate_net:parseFloat(document.getElementById('em-rate').value)||0,email:document.getElementById('em-email').value};
  try{
    await sbFetch(`/rest/v1/employees?id=eq.${id}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
    const i=employees.findIndex(e=>e.id===id); if(i>=0)employees[i]={...employees[i],...p};
    closeModal('emp-modal'); showToast('Dane zaktualizowane'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}
