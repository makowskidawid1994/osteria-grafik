<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Osteria Antonina — Grafik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0F172A;
  --accent: #16A34A;
  --bg: #F1F5F9;
  --surface: #ffffff;
  --border: #E2E8F0;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;
  --danger: #EF4444;
  --warn: #F59E0B;
  --radius: 10px;
  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ─── Auth ─── */
#auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--primary); padding: 24px;
}
.auth-card {
  background: white; border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
.auth-brand h1 span { color: var(--accent); }
.auth-brand p { font-size: 13px; color: var(--text-2); margin-top: 4px; font-weight: 400; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text);
  transition: border-color .15s; background: #FAFBFC;
}
.field input:focus { border-color: var(--accent); background: white; }
.btn-login {
  width: 100%; padding: 11px; background: var(--primary); color: white; border: none;
  border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 6px;
  font-family: var(--font); letter-spacing: -.1px; transition: opacity .15s;
}
.btn-login:hover { opacity: .85; }
.auth-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; display: none; }

/* ─── App shell ─── */
#app { display: none; }
.header {
  background: var(--primary); color: white; height: 50px; padding: 0 16px;
  display: flex; align-items: center; position: sticky; top: 0; z-index: 100;
}
.header-brand { font-size: 14px; font-weight: 500; flex: 1; letter-spacing: -.2px; }
.header-brand em { color: var(--accent); font-style: normal; }
.role-badge {
  font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-right: 10px;
  background: rgba(22,163,74,.2); color: #4ADE80; letter-spacing: .2px;
}
.header-name { font-size: 12px; color: rgba(255,255,255,.4); margin-right: 12px; }
.btn-out {
  font-size: 12px; color: rgba(255,255,255,.4); background: none; border: 1px solid rgba(255,255,255,.12);
  padding: 4px 10px; border-radius: 5px; cursor: pointer; font-family: var(--font);
  transition: color .15s;
}
.btn-out:hover { color: white; }

/* ─── Bottom nav ─── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: white;
  border-top: 1px solid var(--border); display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-3); font-size: 10px; font-weight: 500;
  border: none; background: none; font-family: var(--font); transition: color .12s; position: relative;
}
.bnav-item.active { color: var(--primary); }
.bnav-item.active svg { stroke: var(--primary); }
.bnav-item svg { width: 20px; height: 20px; stroke: var(--text-3); fill: none; stroke-width: 1.8; transition: stroke .12s; }
.bnav-item.active::before {
  content: ''; position: absolute; top: 0; left: 25%; right: 25%;
  height: 2px; background: var(--accent); border-radius: 0 0 2px 2px;
}

.main { padding-bottom: 64px; }

/* ─── Page header bar ─── */
.page-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.page-bar-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 120px; }
.view-toggle {
  display: flex; background: var(--bg); border-radius: 7px; padding: 2px; gap: 1px;
}
.vt-btn {
  padding: 5px 12px; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; font-family: var(--font); color: var(--text-2);
  transition: all .12s;
}
.vt-btn.active { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ─── Week nav ─── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 0;
}
.wn-btn {
  width: 30px; height: 30px; border: 1px solid var(--border); background: white;
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); font-size: 15px; transition: border-color .12s;
}
.wn-btn:hover { border-color: var(--accent); }
.wn-label { text-align: center; }
.wn-range { font-size: 14px; font-weight: 600; }
.wn-week { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.today-link { color: var(--accent); cursor: pointer; font-weight: 500; }
.today-link:hover { text-decoration: underline; }

/* ─── Dept tabs ─── */
.dept-row {
  display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto;
  scrollbar-width: none;
}
.dept-row::-webkit-scrollbar { display: none; }
.dtab {
  padding: 5px 13px; border-radius: 6px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1px solid var(--border); background: white;
  color: var(--text-2); cursor: pointer; transition: all .1s; font-family: var(--font);
}
.dtab.active { background: var(--primary); color: white; border-color: var(--primary); }

/* ─── Cost strip ─── */
.cost-strip {
  margin: 10px 16px 0; background: var(--primary); border-radius: var(--radius);
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
}
.cs-label { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 500; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
.cs-val { font-size: 18px; font-weight: 600; color: white; letter-spacing: -.3px; }

/* ─── Schedule table ─── */
.sched-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sched-tbl {
  width: 100%; border-collapse: collapse; min-width: 480px;
  background: white; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
}
.sched-tbl thead th {
  background: #F8FAFC; color: var(--text-3); font-size: 10px; font-weight: 500;
  padding: 9px 8px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border);
}
.sched-tbl thead th.th-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.sched-tbl thead th.th-day { min-width: 56px; }
.sched-tbl thead th.th-day .dn { font-size: 15px; font-weight: 600; color: var(--text); display: block; margin-top: 1px; }
.sched-tbl thead th.th-day.today .dn { color: var(--accent); }
.sched-tbl thead th.th-day.today { color: var(--accent); }
.sched-tbl thead th.th-day.weekend { background: #FEF2F2; color: #DC2626; }
.sched-tbl thead th.th-day.weekend .dn { color: #DC2626; }
.td-day-cell.weekend { background: #FFF8F8; }
.td-day-cell.weekend:hover { background: #FFE4E4; }
.td-day-cell.weekend.filled { background: #FDE8E8; }
.td-day-cell.weekend .shift-chip { background: #DC2626; }
.td-day-cell.weekend .shift-cost-lbl { color: #DC2626; }
.sched-tbl thead th.th-sum { min-width: 72px; text-align: right; padding-right: 14px; }
.sched-tbl tbody tr { border-top: 1px solid var(--border); }
.sched-tbl tbody tr:last-child td { }
.sched-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.sched-tbl tbody td:last-child { border-right: none; }

.td-emp-cell { display: flex; align-items: center; gap: 9px; padding: 10px 14px; min-height: 50px; }
.av {
  width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 600; color: white; flex-shrink: 0;
}
.td-emp-name { font-size: 13px; font-weight: 500; }
.td-emp-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.dept-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

.td-day-cell {
  text-align: center; cursor: pointer; padding: 8px 4px; min-height: 50px;
  vertical-align: middle; transition: background .1s;
}
.td-day-cell:hover { background: #F0FDF4; }
.td-day-cell.filled { background: #F0FDF4; }
.td-day-cell.is-today { background: #ECFDF5; }
.shift-chip {
  display: inline-block; background: var(--accent); color: white;
  font-size: 9px; font-weight: 500; padding: 2px 6px; border-radius: 3px;
  white-space: nowrap; letter-spacing: -.1px;
}
.shift-cost-lbl { font-size: 9px; color: var(--accent); font-weight: 500; margin-top: 2px; }
.cell-add { font-size: 15px; color: var(--border); font-weight: 300; }
.td-day-cell.unavail { background: #FEF2F2; }
.cell-unavail { font-size: 10px; color: #FCA5A5; font-weight: 500; }

/* ─── Auto-fill button ─── */
.autofill-btn {
  display: flex; align-items: center; gap: 7px; margin: 10px 16px 0;
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 14px; cursor: pointer; font-family: var(--font); font-size: 13px;
  color: var(--text-2); font-weight: 400; width: calc(100% - 32px); transition: border-color .12s;
}
.autofill-btn:hover { border-color: var(--accent); color: var(--accent); }
.autofill-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }
.autofill-btn strong { font-weight: 600; color: var(--text); }

/* ─── Avail month style ─── */
.avail-month-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 0; background: white; border-bottom: 1px solid var(--border); margin-bottom: 0;
}
.avail-month-title { font-size: 14px; font-weight: 600; }
.avail-month-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.avail-legend { display: flex; gap: 12px; padding: 8px 16px; align-items: center; font-size: 11px; color: var(--text-3); }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 3px; }

/* ─── Date-based avail grid ─── */
.avail-date-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 12px 14px; }
.avail-date-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.avail-date-name { font-size: 13px; font-weight: 500; flex:1; }
.avail-date-stats { font-size: 11px; color: var(--text-3); }
.avail-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.avail-cal-head { text-align: center; font-size: 9px; font-weight: 500; color: var(--text-3); padding: 2px 0; letter-spacing: .2px; }
.adc {
  text-align: center; padding: 4px 2px; border-radius: 5px; cursor: pointer;
  font-size: 11px; font-weight: 400; color: var(--text-2); transition: all .1s; min-height: 28px;
  display: flex; align-items: center; justify-content: center; border: 1px solid transparent;
}
.adc:hover { background: var(--bg); }
.adc.avail-yes { background: #DCFCE7; color: #166534; border-color: #BBF7D0; font-weight: 500; }
.adc.avail-no { background: #FEE2E2; color: #991B1B; border-color: #FECACA; font-weight: 500; }
.adc.adc-empty { cursor: default; }
.adc.adc-past { color: var(--text-3); cursor: default; opacity: .5; }

/* ─── Add emp button ─── */
.add-emp-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 16px 16px; padding: 11px; background: white; border: 1px dashed var(--border);
  border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-3); font-family: var(--font); transition: all .12s;
}
.add-emp-btn:hover { border-color: var(--accent); color: var(--accent); }

.td-sum-cell { text-align: right; padding: 10px 14px; white-space: nowrap; }
.sum-h { font-size: 13px; font-weight: 600; }
.sum-cost { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }

/* ─── Month table ─── */
.month-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-tbl {
  width: 100%; border-collapse: collapse; min-width: 520px;
  background: white; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
}
.month-tbl thead th {
  background: #F8FAFC; color: var(--text-3); font-size: 10px; font-weight: 500;
  padding: 9px 8px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border);
}
.month-tbl thead th.mth-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.month-tbl thead th.mth-day { min-width: 32px; }
.month-tbl thead th.mth-day .mdn { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-top: 1px; }
.month-tbl thead th.mth-day.mtoday { color: var(--accent); }
.month-tbl thead th.mth-day.mtoday .mdn { color: var(--accent); }
.month-tbl tbody tr { border-top: 1px solid var(--border); }
.month-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.month-tbl tbody td:last-child { border-right: none; }
.mtd-emp { display: flex; align-items: center; gap: 9px; padding: 9px 14px; min-height: 44px; }
.mtd-day {
  text-align: center; cursor: pointer; padding: 6px 2px; min-height: 44px;
  vertical-align: middle; transition: background .1s; font-size: 9px;
}
.mtd-day:hover { background: #F0FDF4; }
.mtd-day.mfilled { background: #F0FDF4; }
.mtd-day.mtoday-cell { background: #ECFDF5; }
.mtd-day.mweekend { background: #FFF8F8; }
.month-tbl thead th.mth-day.mweekend-h { background: #FEF2F2; color: #DC2626; }
.month-tbl thead th.mth-day.mweekend-h .mdn { color: #DC2626; }
.mtd-day.mweekend .mchip { background: #DC2626; }
.mchip { display: inline-block; background: var(--accent); color: white; font-size: 8px; font-weight: 500; padding: 1px 4px; border-radius: 2px; white-space: nowrap; }

/* ─── Employees list ─── */
.emp-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.emp-row {
  background: white; border-radius: var(--radius); border: 1px solid var(--border);
  padding: 13px 14px; display: flex; align-items: center; gap: 11px;
}
.emp-row-info { flex: 1; }
.emp-row-name { font-size: 14px; font-weight: 500; }
.emp-row-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; font-weight: 400; }
.emp-row-stat { font-size: 12px; color: var(--accent); font-weight: 500; margin-top: 2px; }
.emp-rate { text-align: right; }
.emp-rate-val { font-size: 15px; font-weight: 600; }
.emp-rate-lbl { font-size: 10px; color: var(--text-3); font-weight: 400; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  color: var(--text-3); font-size: 14px; transition: border-color .12s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Availability ─── */
.avail-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.avail-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 13px 14px; }
.avail-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.avail-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.aday {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .1s;
}
.aday-label { font-size: 9px; font-weight: 500; color: var(--text-3); }
.aday-circle {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .12s;
}
.aday.yes .aday-circle { border-color: var(--accent); background: var(--accent); color: white; }
.aday.no .aday-circle { border-color: var(--danger); background: var(--danger); color: white; }
.aday.yes { background: #F0FDF4; }
.aday.no { background: #FEF2F2; }

/* ─── Dashboard ─── */
.dash-wrap { padding: 12px 16px; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-box { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 14px 14px 12px; }
.stat-box.dark { background: var(--primary); border-color: transparent; }
.stat-box-label { font-size: 11px; color: var(--text-3); font-weight: 400; margin-bottom: 5px; }
.stat-box.dark .stat-box-label { color: rgba(255,255,255,.4); }
.stat-box-val { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
.stat-box.dark .stat-box-val { color: white; }
.stat-box-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; font-weight: 400; }
.stat-box.dark .stat-box-sub { color: rgba(255,255,255,.35); }
.dash-section-title { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
.dash-emp-rows { display: flex; flex-direction: column; gap: 6px; }
.dash-emp-row {
  background: white; border-radius: var(--radius); border: 1px solid var(--border);
  padding: 11px 14px; display: flex; align-items: center; gap: 10px;
}
.der-info { flex: 1; }
.der-name { font-size: 13px; font-weight: 500; }
.der-meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.der-right { text-align: right; }
.der-rate { font-size: 13px; font-weight: 600; }
.der-cost { font-size: 11px; color: var(--accent); font-weight: 500; }

/* ─── Employee dashboard (non-manager view) ─── */
.emp-dash { padding: 12px 16px; }
.cta-card {
  background: var(--accent); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 10px; color: white;
}
.cta-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.cta-sub { font-size: 13px; opacity: .8; font-weight: 400; }
.cta-btn {
  display: inline-block; margin-top: 12px; background: white; color: var(--accent);
  border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font);
}
.info-card {
  background: white; border-radius: var(--radius); border: 1px solid var(--border);
  padding: 14px; margin-bottom: 10px;
}
.info-card-title { font-size: 12px; font-weight: 500; color: var(--text-2); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; }
.my-shifts-list { display: flex; flex-direction: column; gap: 6px; }
.my-shift-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--bg); border-radius: 7px; }
.msr-date { font-size: 13px; font-weight: 500; }
.msr-time { font-size: 13px; color: var(--accent); font-weight: 500; }
.msr-h { font-size: 11px; color: var(--text-3); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
  padding: 18px 20px 32px; transform: translateY(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1); max-height: 88vh; overflow-y: auto;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-pill { width: 30px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.modal-sub { font-size: 13px; color: var(--text-2); margin-bottom: 16px; font-weight: 400; }
.mfield { margin-bottom: 13px; }
.mfield label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
.mfield input, .mfield select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 7px;
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text); background: white;
}
.mfield input:focus, .mfield select:focus { border-color: var(--accent); }
.mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.mbtn-cancel { padding: 11px 16px; background: var(--bg); color: var(--text-2); border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.mbtn-delete { flex: 1; padding: 11px; background: white; color: var(--danger); border: 1px solid var(--danger); border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.mbtn-save { flex: 2; padding: 11px; background: var(--primary); color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.cost-preview { background: var(--bg); border-radius: 7px; padding: 11px 12px; font-size: 12px; color: var(--text-2); margin-top: 4px; display: none; }
.cost-preview strong { color: var(--text); font-weight: 600; }

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--primary); color: white; padding: 8px 16px; border-radius: 6px;
  font-size: 12px; font-weight: 500; z-index: 300; opacity: 0; pointer-events: none;
  white-space: nowrap; transition: all .18s; box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Misc ─── */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-3); }
.empty-state svg { width: 40px; height: 40px; stroke: var(--border); margin-bottom: 12px; }
.empty-state p { font-size: 14px; font-weight: 500; color: var(--text-2); }
.empty-state span { font-size: 12px; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; margin: 32px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.sect-label { padding: 14px 16px 6px; font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <h1>Osteria <span>Antonina</span></h1>
      <p>System zarządzania pracownikami</p>
    </div>
    <div class="field"><label>Email</label><input type="email" id="auth-email" placeholder="adres@email.com" autocomplete="email"></div>
    <div class="field"><label>Hasło</label><input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Zaloguj się</button>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-brand">Osteria <em>Antonina</em></div>
    <span class="role-badge" id="hdr-role"></span>
    <span class="header-name" id="hdr-user"></span>
    <button class="btn-out" onclick="doLogout()">Wyloguj</button>
  </div>
  <div class="main" id="main-content"><div class="spinner"></div></div>
  <nav class="bnav" id="bottom-nav">
    <button class="bnav-item active" id="nav-sched" onclick="showView('sched')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Grafik
    </button>
    <button class="bnav-item" id="nav-emps" onclick="showView('emps')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Pracownicy
    </button>
    <button class="bnav-item" id="nav-avail" onclick="showView('avail')">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Dyspoz.
    </button>
    <button class="bnav-item" id="nav-dash" onclick="showView('dash')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </button>
  </nav>
</div>

<!-- SHIFT MODAL -->
<div class="modal-overlay" id="shift-modal">
  <div class="modal">
    <div class="modal-pill"></div>
    <div class="modal-title" id="sm-title">Dodaj zmianę</div>
    <div class="modal-sub" id="sm-sub"></div>
    <input type="hidden" id="sm-shift-id">
    <div class="mfield"><label>Godzina rozpoczęcia</label><input type="time" id="sm-start" value="10:00"></div>
    <div class="mfield"><label>Godzina zakończenia</label><input type="time" id="sm-end" value="18:00"></div>
    <div class="mfield"><label>Notatka (opcjonalnie)</label><input type="text" id="sm-note" placeholder="np. otwarcie, kuchnia..."></div>
    <div class="cost-preview" id="sm-cost-preview">Koszt zmiany: <strong id="sm-cost-val"></strong></div>
    <div class="modal-actions">
      <button class="mbtn-cancel" onclick="closeModal('shift-modal')">Anuluj</button>
      <button class="mbtn-delete" id="sm-delete" onclick="deleteShift()" style="display:none">Usuń</button>
      <button class="mbtn-save" onclick="saveShift()">Zapisz</button>
    </div>
  </div>
</div>

<!-- EMP MODAL -->
<div class="modal-overlay" id="emp-modal">
  <div class="modal">
    <div class="modal-pill"></div>
    <div class="modal-title">Edytuj pracownika</div>
    <div class="modal-sub" id="em-sub"></div>
    <input type="hidden" id="em-id">
    <div class="mfield"><label>Imię i nazwisko</label><input type="text" id="em-name"></div>
    <div class="mrow">
      <div class="mfield"><label>Dział</label>
        <select id="em-dept"><option value="kuchnia">Kuchnia</option><option value="sala">Sala</option></select>
      </div>
      <div class="mfield"><label>Stawka netto (zł/h)</label><input type="number" id="em-rate" step="0.5" min="0"></div>
    </div>
    <div class="mfield"><label>Email</label><input type="email" id="em-email"></div>
    <div class="modal-actions">
      <button class="mbtn-cancel" onclick="closeModal('emp-modal')">Anuluj</button>
      <button class="mbtn-save" onclick="saveEmp()">Zapisz zmiany</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://kplaunvegdjgkycirzhk.supabase.co';
const SB_KEY = 'sb_publishable_DTD-TNu5Gjb0ug5Vxmpr6w_JVO_KgCF';

let currentUser=null, currentRole=null;
let employees=[], shifts=[], availability=[];
let currentWeekOffset=0, currentDept='all', currentView='sched', schedView='week';
let currentMonthOffset=0;
let currentShiftEmpId=null, currentShiftDate=null;
// availMonth: which month the availability tab is showing (offset from now)
let availMonthOffset=1; // default: next month

async function sbFetch(path, opts={}) {
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  const r=await fetch(SB_URL+path,{headers:h,...opts});
  if(!r.ok) throw new Error(await r.text());
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

async function doLogin() {
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('login-btn');
  btn.textContent='Logowanie...'; btn.disabled=true;
  document.getElementById('auth-err').style.display='none';
  try {
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const data=await r.json();
    if(data.error||!data.access_token) throw new Error(data.error_description||'Błąd logowania');
    currentUser=data;
    const rows=await sbFetch(`/rest/v1/user_roles?email=eq.${encodeURIComponent(email)}&select=role`).catch(()=>[]);
    currentRole=rows?.[0]?.role||'employee';
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('hdr-role').textContent={owner:'Właściciel',manager:'Manager',kitchen:'Kuchnia',front:'Sala',employee:'Pracownik'}[currentRole]||currentRole;
    document.getElementById('hdr-user').textContent=email.split('@')[0];
    if(!canEdit()){
      document.getElementById('nav-dash').style.display='none';
      document.getElementById('nav-emps').style.display='none';
    }
    await loadAllData();
    showView('sched');
  } catch(e) {
    const el=document.getElementById('auth-err');
    el.textContent=e.message; el.style.display='block';
  }
  btn.textContent='Zaloguj się'; btn.disabled=false;
}

function doLogout(){
  currentUser=null; currentRole=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}

function canEdit(){return['owner','manager'].includes(currentRole);}

async function loadAllData(){
  employees=await sbFetch('/rest/v1/employees?select=*&active=eq.true&order=department,name').catch(()=>[]);
  await loadShiftsForCurrentPeriod();
  // Load availability — now date-based (availability_dates table) + legacy day_of_week
  availability=await sbFetch('/rest/v1/availability?select=*').catch(()=>[]);
  availDates=await sbFetch('/rest/v1/availability_dates?select=*').catch(()=>[]);
}

// availDates: [{id, employee_id, date, available}]
let availDates=[];

async function loadShiftsForCurrentPeriod(){
  let from,to;
  if(schedView==='week'){
    const w=getWeekRange(currentWeekOffset);
    from=w.from; to=w.to;
  } else {
    const m=getMonthRange(currentMonthOffset);
    from=m.from; to=m.to;
  }
  shifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);
}

function getWeekRange(offset){
  const now=new Date();
  const dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now); mon.setDate(now.getDate()-dow+offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return{from:fd(mon),to:fd(sun),monDate:mon};
}

function getMonthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  return{from:fd(first),to:fd(last),first,last,year:first.getFullYear(),month:first.getMonth()};
}

function fd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function today(){return fd(new Date());}
function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm); if(m<0)m+=1440; return m/60;
}
function avatarColor(n){
  const c=['#334155','#166534','#92400E','#5B21B6','#1E40AF','#065F46','#9A3412','#881337'];
  let h=0; for(let ch of n)h=ch.charCodeAt(0)+((h<<5)-h); return c[Math.abs(h)%c.length];
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function wNum(d){const j4=new Date(d.getFullYear(),0,4);return Math.ceil((((d-j4)/86400000)+j4.getDay()+1)/7);}
function monthName(m){return['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'][m];}

function showView(v){
  currentView=v;
  document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+v);
  if(el) el.classList.add('active');
  renderView();
}

function renderView(){
  const mc=document.getElementById('main-content');
  if(currentView==='sched') renderSched(mc);
  else if(currentView==='emps') renderEmps(mc);
  else if(currentView==='avail') renderAvail(mc);
  else if(currentView==='dash') renderDash(mc);
}

async function changeWeek(d){
  currentWeekOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function goToToday(){
  currentWeekOffset=0; currentMonthOffset=0;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function changeMonth(d){
  currentMonthOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function switchSchedView(v){
  schedView=v;
  await loadShiftsForCurrentPeriod();
  renderView();
}

function setDept(d){currentDept=d;renderView();}

// ── SCHEDULE ──
function renderSched(mc){
  if(schedView==='week') renderWeek(mc);
  else renderMonth(mc);
}

function renderWeek(mc){
  const{from,to,monDate}=getWeekRange(currentWeekOffset);
  const tod=today();
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    return{date:fd(d),label:['Pon','Wt','Śr','Czw','Pt','Sob','Nd'][i],num:d.getDate()};
  });
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  let tc=0,th=0;
  shifts.forEach(s=>{
    const emp=employees.find(e=>e.id===s.employee_id); if(!emp)return;
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    tc+=h*(emp.rate_net||0); th+=h;
  });

  const sun=new Date(monDate); sun.setDate(monDate.getDate()+6);
  const rng=`${monDate.getDate()}.${pad(monDate.getMonth()+1)} — ${sun.getDate()}.${pad(sun.getMonth()+1)}.${sun.getFullYear()}`;

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn active" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeWeek(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${rng}</div>
      <div class="wn-week">Tydzień ${wNum(monDate)}${currentWeekOffset!==0?` · <span class="today-link" onclick="goToToday()">Dziś</span>`:''}</div>
    </div>
    <button class="wn-btn" onclick="changeWeek(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
    if(th>0){
      html+=`<div class="cost-strip">
        <div><div class="cs-label">Koszt tygodnia</div><div class="cs-val">${tc.toFixed(0)} zł</div></div>
        <div style="text-align:right"><div class="cs-label">Godziny</div><div class="cs-val">${th.toFixed(1)} h</div></div>
      </div>`;
    }
  }

  html+=`<div class="sched-wrap"><table class="sched-tbl"><thead><tr>
    <th class="th-emp">Pracownik</th>`;
  days.forEach((day,i)=>{
    const isT=day.date===tod;
    const isWe=i>=5; // Sat=5, Sun=6 (Mon=0 in our array)
    html+=`<th class="th-day${isT?' today':''}${isWe?' weekend':''}"><span style="text-transform:uppercase;letter-spacing:.3px">${day.label}</span><span class="dn">${day.num}</span></th>`;
  });
  if(canEdit()) html+=`<th class="th-sum">Tyg.</th>`;
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0,eC=0;
    eS.forEach(s=>{const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');eH+=h;eC+=h*(emp.rate_net||0);});
    const dc=emp.department==='kuchnia'?'#B45309':'#1D4ED8';

    html+=`<tr><td><div class="td-emp-cell">
      <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
      <div>
        <div class="td-emp-name">${emp.name}</div>
        <div class="td-emp-dept"><span class="dept-dot" style="background:${dc}"></span>${emp.department}</div>
      </div>
    </div></td>`;

    days.forEach((day,di)=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const isWe=di>=5;
      const h=shift?calcH(shift.start_time||'10:00:00',shift.end_time||'18:00:00'):0;
      const cost=h*(emp.rate_net||0);
      // Check date-based unavailability
      const unavail=availDates.find(a=>a.employee_id===emp.id&&a.date===day.date&&a.available===false);
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      let cellCls='td-day-cell';
      if(shift) cellCls+=' filled';
      if(isT) cellCls+=' is-today';
      if(isWe) cellCls+=' weekend';
      if(unavail&&!shift) cellCls+=' unavail';
      html+=`<td class="${cellCls}" ${ca}>`;
      if(shift){
        html+=`<div class="shift-chip">${(shift.start_time||'10:00').slice(0,5)}–${(shift.end_time||'18:00').slice(0,5)}</div>`;
        if(canEdit()&&(emp.rate_net||0)>1) html+=`<div class="shift-cost-lbl">${cost.toFixed(0)} zł</div>`;
      } else if(unavail){
        html+=`<div class="cell-unavail">✕</div>`;
      } else if(canEdit()){
        html+=`<div class="cell-add">+</div>`;
      }
      html+=`</td>`;
    });

    if(canEdit()){
      html+=`<td class="td-sum-cell">
        ${eH>0?`<div class="sum-h">${eH.toFixed(1)}h</div><div class="sum-cost">${(emp.rate_net||0)>1?eC.toFixed(0)+' zł':eS.length+' zm.'}</div>`:`<span style="color:var(--border)">—</span>`}
      </td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

function renderMonth(mc){
  const{from,to,first,last,year,month}=getMonthRange(currentMonthOffset);
  const tod=today();
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  const daysInMonth=last.getDate();
  // Build array of all days
  const days=Array.from({length:daysInMonth},(_,i)=>{
    const d=new Date(year,month,i+1);
    const dow=d.getDay(); // 0=Sun
    const dateStr=`${year}-${pad(month+1)}-${pad(i+1)}`;
    return{d:i+1,date:dateStr,dow,weekend:dow===0||dow===6};
  });

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn active" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeMonth(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${monthName(month)} ${year}</div>
      ${currentMonthOffset!==0?`<div class="wn-week"><span class="today-link" onclick="goToToday()">Dziś</span></div>`:''}
    </div>
    <button class="wn-btn" onclick="changeMonth(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
  }

  const dowLabels=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'];

  html+=`<div class="month-wrap"><table class="month-tbl"><thead><tr>
    <th class="mth-emp">Pracownik</th>`;
  days.forEach(day=>{
    const isT=day.date===tod;
    const isWe=day.dow===0||day.dow===6;
    html+=`<th class="mth-day${isT?' mtoday':''}${isWe?' mweekend-h':''}">
      <span>${dowLabels[day.dow].slice(0,2)}</span>
      <span class="mdn">${day.d}</span>
    </th>`;
  });
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0; eS.forEach(s=>eH+=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00'));
    html+=`<tr><td><div class="mtd-emp">
      <div class="av" style="background:${avatarColor(emp.name)};width:24px;height:24px;font-size:9px;border-radius:5px">${initials(emp.name)}</div>
      <div>
        <div style="font-size:12px;font-weight:500">${emp.name.split(' ')[0]}</div>
        ${eH>0?`<div style="font-size:10px;color:var(--accent)">${eH.toFixed(0)}h</div>`:''}
      </div>
    </div></td>`;
    days.forEach(day=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      html+=`<td class="mtd-day${shift?' mfilled':''}${isT?' mtoday-cell':''}${day.weekend?' mweekend':''}" ${ca}>`;
      if(shift){
        html+=`<div class="mchip">${(shift.start_time||'10:00').slice(0,5)}</div>`;
      } else if(canEdit()){
        html+=`<span style="color:var(--border);font-size:12px">+</span>`;
      }
      html+=`</td>`;
    });
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

function openEmpModal(id){

  document.getElementById('em-name').value=emp.name;
  document.getElementById('em-dept').value=emp.department;
  document.getElementById('em-rate').value=emp.rate_net||0;
  document.getElementById('em-email').value=emp.email||'';

async function saveEmp(){
  const id=document.getElementById('em-id').value;

// ── AVAILABILITY (date-based per month) ──
function getAvailMonth(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+availMonthOffset;
  const first=new Date(y,m,1); const last=new Date(y,m+1,0);
  return{year:first.getFullYear(),month:first.getMonth(),first,last,daysInMonth:last.getDate()};
}

function renderAvail(mc){
  const myEmail=currentUser?.user?.email;
  const viewEmps=canEdit()?employees:employees.filter(e=>e.email===myEmail);
  const{year,month,first,daysInMonth}=getAvailMonth();
  const tod=today();
  const dowLabels=['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];

  // Legend + month nav
  let html=`<div class="avail-month-nav">
    <div>
      <div class="avail-month-title">Dyspozycyjność — ${monthName(month)} ${year}</div>
      <div class="avail-month-sub">Kliknij dzień: zielony = dostępny, czerwony = niedostępny</div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="wn-btn" onclick="changeAvailMonth(-1)">‹</button>
      <button class="wn-btn" onclick="changeAvailMonth(1)">›</button>
    </div>
  </div>`;

  if(canEdit()){
    // Count how many have submitted for this month
    const submitted=viewEmps.filter(emp=>availDates.some(a=>a.employee_id===emp.id&&a.date.startsWith(`${year}-${pad(month+1)}`))).length;
    html+=`<div class="avail-legend">
      <span><span class="leg-dot" style="background:#16A34A"></span>Dostępny</span>
      <span><span class="leg-dot" style="background:#EF4444"></span>Niedostępny</span>
      <span style="margin-left:auto;color:var(--text-2);font-weight:500">${submitted}/${viewEmps.length} zgłosiło</span>
    </div>`;
    // Auto-fill button — only show for future months
    const isNextMonth=availMonthOffset>=1;
    if(isNextMonth){
      html+=`<button class="autofill-btn" onclick="autoFillFromAvail()">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span>Zaproponuj grafik na <strong>${monthName(month)}</strong> na podstawie dyspozycji</span>
      </button>`;
    }
  }

  html+=`<div class="avail-list">`;

  viewEmps.forEach(emp=>{
    const empDates=availDates.filter(a=>a.employee_id===emp.id&&a.date.startsWith(`${year}-${pad(month+1)}`));
    const yesCount=empDates.filter(a=>a.available===true).length;
    const noCount=empDates.filter(a=>a.available===false).length;

    html+=`<div class="avail-date-card">
      <div class="avail-date-head">
        <div class="av" style="background:${avatarColor(emp.name)};width:26px;height:26px;font-size:10px">${initials(emp.name)}</div>
        <div class="avail-date-name">${emp.name}</div>
        <div class="avail-date-stats">`;
    if(yesCount||noCount) html+=`<span style="color:#16A34A">${yesCount}✓</span> <span style="color:#EF4444">${noCount}✕</span>`;
    else html+=`<span>Brak zgłoszenia</span>`;
    html+=`</div></div>
      <div class="avail-cal">`;
    // Day headers
    dowLabels.forEach(l=>html+=`<div class="avail-cal-head">${l}</div>`);
    // Empty cells before 1st
    const startDow=first.getDay(); // 0=Sun
    for(let i=0;i<startDow;i++) html+=`<div class="adc adc-empty"></div>`;
    // Days
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${year}-${pad(month+1)}-${pad(d)}`;
      const rec=empDates.find(a=>a.date===dateStr);
      const isPast=dateStr<tod;
      let cls='adc';
      if(isPast) cls+=' adc-past';
      else if(rec?.available===true) cls+=' avail-yes';
      else if(rec?.available===false) cls+=' avail-no';
      const click=isPast?'':` onclick="toggleAvailDate('${emp.id}','${dateStr}')"`;
      html+=`<div class="${cls}"${click} id="adc-${emp.id}-${dateStr}">${d}</div>`;
    }
    html+=`</div></div>`;
  });
  html+=`</div>`;
  mc.innerHTML=html;
}

function changeAvailMonth(d){ availMonthOffset+=d; renderView(); }

async function toggleAvailDate(empId,date){
  const ex=availDates.find(a=>a.employee_id===empId&&a.date===date);
  // cycle: none→yes→no→none
  let nv;
  if(!ex) nv=true;
  else if(ex.available===true) nv=false;
  else { // remove
    try{ await sbFetch(`/rest/v1/availability_dates?id=eq.${ex.id}`,{method:'DELETE'}); }catch(e){}
    availDates=availDates.filter(a=>a.id!==ex.id);
    const cell=document.getElementById(`adc-${empId}-${date}`);
    if(cell){cell.className='adc';cell.style.fontWeight='';}
    return;
  }
  try{
    if(ex){
      await sbFetch(`/rest/v1/availability_dates?id=eq.${ex.id}`,{method:'PATCH',body:JSON.stringify({available:nv})});
      ex.available=nv;
    } else {
      const r=await sbFetch('/rest/v1/availability_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({employee_id:empId,date,available:nv})});
      if(Array.isArray(r))availDates.push(...r);
    }
    const cell=document.getElementById(`adc-${empId}-${date}`);
    if(cell){
      cell.className='adc '+(nv?'avail-yes':'avail-no');
    }
  }catch(e){
    // Table may not exist yet — gracefully degrade
    showToast('Tabela availability_dates niedostępna — sprawdź Supabase');
  }
}

// Auto-fill: for the displayed month, insert shifts for employees on days they're available (skipping unavailable)
async function autoFillFromAvail(){
  const{year,month,daysInMonth}=getAvailMonth();
  const prefix=`${year}-${pad(month+1)}`;
  // Load existing shifts for that month
  const mShifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${prefix}-01&date=lte.${prefix}-${pad(daysInMonth)}`).catch(()=>[]);

  let added=0, skipped=0;
  const toInsert=[];

  for(const emp of employees){
    const empUnavail=availDates.filter(a=>a.employee_id===emp.id&&a.available===false&&a.date.startsWith(prefix));
    const unavailSet=new Set(empUnavail.map(a=>a.date));

    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${prefix}-${pad(d)}`;
      const dow=new Date(year,month,d).getDay();
      // Skip Sundays (dow=0) unless specifically marked available
      const isAvailable=availDates.find(a=>a.employee_id===emp.id&&a.date===dateStr&&a.available===true);
      if(!isAvailable) continue; // only fill days employee explicitly said yes
      if(unavailSet.has(dateStr)){skipped++;continue;}
      if(mShifts.find(s=>s.employee_id===emp.id&&s.date===dateStr)){skipped++;continue;}
      toInsert.push({employee_id:emp.id,date:dateStr,start_time:'10:00:00',end_time:'18:00:00',note:'auto'});
    }
  }

  if(!toInsert.length){showToast('Brak dyspozycji do wstawienia — najpierw zaznacz dostępne dni');return;}

  try{
    const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(toInsert)});
    if(Array.isArray(r)) shifts.push(...r);
    showToast(`Dodano ${toInsert.length} zmian na ${monthName(month)}`);
    schedView='month'; currentMonthOffset=availMonthOffset;
    await loadShiftsForCurrentPeriod();
    showView('sched');
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function toggleAvail(empId,day){
  const ex=availability.find(a=>a.employee_id===empId&&a.day_of_week===day);
  const nv=ex?.available===true?false:true;
  try{
    if(ex){
      await sbFetch(`/rest/v1/availability?id=eq.${ex.id}`,{method:'PATCH',body:JSON.stringify({available:nv})});
      ex.available=nv;
    } else {
      const r=await sbFetch('/rest/v1/availability?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({employee_id:empId,day_of_week:day,available:nv})});
      if(Array.isArray(r))availability.push(...r);
    }
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

  [...employees].sort((a,b)=>(b.rate_net||0)-(a.rate_net||0)).forEach(emp=>{

// ── SHIFT MODAL ──
function openShiftModal(empId,empName,date,shiftId){
  const shift=shiftId?shifts.find(s=>s.id===shiftId):null;
  const emp=employees.find(e=>e.id===empId);
  currentShiftEmpId=empId; currentShiftDate=date;
  document.getElementById('sm-title').textContent=shift?'Edytuj zmianę':'Nowa zmiana';
  const d=new Date(date+'T12:00:00');
  document.getElementById('sm-sub').textContent=`${empName} · ${['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()]} ${d.getDate()}.${pad(d.getMonth()+1)}`;
  document.getElementById('sm-shift-id').value=shiftId||'';
  document.getElementById('sm-start').value=(shift?.start_time||'10:00:00').slice(0,5);
  document.getElementById('sm-end').value=(shift?.end_time||'18:00:00').slice(0,5);
  document.getElementById('sm-note').value=shift?.note||'';
  document.getElementById('sm-delete').style.display=shift?'flex':'none';
  updateCostPreview(emp);
  document.getElementById('sm-start').oninput=()=>updateCostPreview(emp);
  document.getElementById('sm-end').oninput=()=>updateCostPreview(emp);
  openModal('shift-modal');
}

function updateCostPreview(emp){
  if(!emp||(emp.rate_net||0)<=1){document.getElementById('sm-cost-preview').style.display='none';return;}
  const h=calcH(document.getElementById('sm-start').value,document.getElementById('sm-end').value);
  document.getElementById('sm-cost-val').textContent=`${(h*(emp.rate_net||0)).toFixed(2)} zł (${h.toFixed(1)}h × ${emp.rate_net} zł/h)`;
  document.getElementById('sm-cost-preview').style.display='block';
}

async function saveShift(){
  const shiftId=document.getElementById('sm-shift-id').value;
  const p={employee_id:currentShiftEmpId,date:currentShiftDate,start_time:document.getElementById('sm-start').value+':00',end_time:document.getElementById('sm-end').value+':00',note:document.getElementById('sm-note').value};
  try{
    if(shiftId){
      await sbFetch(`/rest/v1/shifts?id=eq.${shiftId}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      const i=shifts.findIndex(s=>s.id===shiftId); if(i>=0)shifts[i]={...shifts[i],...p};
    } else {
      const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      if(Array.isArray(r))shifts.push(...r);
    }
    closeModal('shift-modal'); showToast('Zmiana zapisana'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function deleteShift(){
  const id=document.getElementById('sm-shift-id').value; if(!id)return;
  try{
    await sbFetch(`/rest/v1/shifts?id=eq.${id}`,{method:'DELETE'});
    shifts=shifts.filter(s=>s.id!==id); closeModal('shift-modal'); showToast('Zmiana usunięta'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
document.getElementById('auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
