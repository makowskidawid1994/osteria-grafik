<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Osteria Antonina — Grafik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1E293B;
  --accent: #3B82F6;
  --accent-hover: #2563EB;
  --bg: #F8FAFC;
  --surface: #ffffff;
  --border: #E2E8F0;
  --border-2: #CBD5E1;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;
  --danger: #EF4444;
  --danger-bg: #FEF2F2;
  --warn: #F59E0B;
  --green: #10B981;
  --green-bg: #ECFDF5;
  --radius: 8px;
  --radius-lg: 12px;
  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ─── Auth ─── */
#auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 100%); padding: 24px;
}
.auth-card {
  background: white; border-radius: var(--radius-lg); padding: 40px 36px; width: 100%; max-width: 360px;
  box-shadow: 0 24px 64px rgba(0,0,0,.3);
}
.auth-brand { text-align: center; margin-bottom: 32px; }
.auth-logo {
  width: 44px; height: 44px; background: var(--accent); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  font-size: 20px;
}
.auth-brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.4px; color: var(--text); }
.auth-brand p { font-size: 13px; color: var(--text-3); margin-top: 4px; font-weight: 400; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 7px;
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text);
  transition: border-color .15s; background: #FAFBFC;
}
.field input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.btn-login {
  width: 100%; padding: 11px; background: var(--accent); color: white; border: none;
  border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px;
  font-family: var(--font); letter-spacing: -.1px; transition: background .15s;
}
.btn-login:hover { background: var(--accent-hover); }
.auth-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; display: none; }

/* ─── App shell ─── */
#app { display: none; }
.header {
  background: white; color: var(--text); height: 54px; padding: 0 20px;
  display: flex; align-items: center; position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--border); gap: 12px;
}
.header-brand { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: -.4px; color: var(--text); }
.header-brand em { color: var(--accent); font-style: normal; }
.role-badge {
  font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  background: rgba(59,130,246,.1); color: var(--accent); letter-spacing: .1px;
}
.header-name { font-size: 12px; color: var(--text-3); }
.btn-out {
  font-size: 12px; color: var(--text-3); background: none; border: 1.5px solid var(--border);
  padding: 5px 11px; border-radius: 6px; cursor: pointer; font-family: var(--font);
  transition: all .15s; font-weight: 500;
}
.btn-out:hover { border-color: var(--border-2); color: var(--text-2); }

/* ─── Bottom nav ─── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; background: white;
  border-top: 1px solid var(--border); display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(58px + env(safe-area-inset-bottom));
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-3); font-size: 10px; font-weight: 500;
  border: none; background: none; font-family: var(--font); transition: color .15s; position: relative;
  padding-top: 2px;
}
.bnav-item.active { color: var(--accent); }
.bnav-item.active svg { stroke: var(--accent); }
.bnav-item svg { width: 21px; height: 21px; stroke: var(--text-3); fill: none; stroke-width: 1.8; transition: stroke .15s; }
.bnav-item.active::after {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%;
  height: 2.5px; background: var(--accent); border-radius: 0 0 3px 3px;
}

.main { padding-bottom: 70px; }

/* ─── Page header bar ─── */
.page-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.page-bar-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 120px; letter-spacing: -.3px; }
.view-toggle {
  display: flex; background: var(--bg); border-radius: 7px; padding: 3px; gap: 2px;
  border: 1px solid var(--border);
}
.vt-btn {
  padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; font-family: var(--font); color: var(--text-3);
  transition: all .15s;
}
.vt-btn.active { background: white; color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ─── Week nav ─── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px 0; gap: 8px;
}
.wn-btn {
  width: 32px; height: 32px; border: 1.5px solid var(--border); background: white;
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); font-size: 16px; transition: all .15s;
  flex-shrink: 0;
}
.wn-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.04); }
.wn-label { text-align: center; flex: 1; }
.wn-range { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
.wn-week { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.today-link { color: var(--accent); cursor: pointer; font-weight: 600; }
.today-link:hover { text-decoration: underline; }

/* ─── Dept tabs ─── */
.dept-row {
  display: flex; gap: 6px; padding: 10px 20px 0; overflow-x: auto;
  scrollbar-width: none;
}
.dept-row::-webkit-scrollbar { display: none; }
.dtab {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1.5px solid var(--border); background: white;
  color: var(--text-2); cursor: pointer; transition: all .15s; font-family: var(--font);
}
.dtab.active { background: var(--accent); color: white; border-color: var(--accent); }
.dtab:hover:not(.active) { border-color: var(--border-2); }

/* ─── Cost strip ─── */
.cost-strip {
  margin: 10px 20px 0; background: linear-gradient(135deg, #1E293B 0%, #1E3A5F 100%);
  border-radius: var(--radius-lg); padding: 14px 18px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: var(--shadow);
}
.cs-label { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 500; letter-spacing: .3px; margin-bottom: 3px; }
.cs-val { font-size: 20px; font-weight: 700; color: white; letter-spacing: -.5px; }

/* ─── Schedule table ─── */
.sched-wrap { padding: 12px 20px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sched-tbl {
  width: 100%; border-collapse: collapse; min-width: 480px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
}
.sched-tbl thead th {
  background: #F8FAFC; color: var(--text-3); font-size: 10px; font-weight: 600;
  padding: 10px 8px; text-align: center; white-space: nowrap; letter-spacing: .4px;
  border-bottom: 1.5px solid var(--border); text-transform: uppercase;
}
.sched-tbl thead th.th-emp { text-align: left; padding-left: 16px; min-width: 140px; }
.sched-tbl thead th.th-day { min-width: 68px; }
.sched-tbl thead th.th-day .dn { font-size: 17px; font-weight: 700; color: var(--text); display: block; margin-top: 2px; letter-spacing: -.3px; text-transform: none; }
.sched-tbl thead th.th-day.today { background: rgba(59,130,246,.05); }
.sched-tbl thead th.th-day.today .dn { color: var(--accent); }
.sched-tbl thead th.th-day.today { color: var(--accent); }
.sched-tbl thead th.th-day.weekend { background: #FEF2F2; color: #DC2626; }
.sched-tbl thead th.th-day.weekend .dn { color: #DC2626; }
.td-day-cell.weekend { background: #FFFBFB; }
.td-day-cell.weekend:hover { background: #FEE2E2; }
.td-day-cell.weekend.filled { background: #FEF2F2; }
.td-day-cell.weekend .shift-chip { background: #DC2626; }
.td-day-cell.weekend .shift-cost-lbl { color: #DC2626; }
.sched-tbl thead th.th-sum { min-width: 72px; text-align: right; padding-right: 16px; }
.sched-tbl tbody tr { border-top: 1px solid var(--border); }
.sched-tbl tbody tr:hover { background: #FAFBFF; }
.sched-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.sched-tbl tbody td:last-child { border-right: none; }

.td-emp-cell { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
.av {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0;
}
.td-emp-name { font-size: 13px; font-weight: 600; }
.td-emp-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.dept-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

.td-day-cell {
  text-align: center; cursor: pointer; padding: 8px 4px; min-height: 56px;
  vertical-align: middle; transition: background .12s;
}
.td-day-cell:hover { background: rgba(59,130,246,.05); }
.td-day-cell.filled { }
.td-day-cell.is-today { background: rgba(59,130,246,.04); }
.shift-chip {
  display: inline-flex; align-items: center; background: var(--accent); color: white;
  font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
  white-space: nowrap; letter-spacing: -.1px; gap: 3px; box-shadow: 0 1px 3px rgba(59,130,246,.35);
}
.shift-cost-lbl { font-size: 9px; color: var(--accent); font-weight: 600; margin-top: 3px; opacity: .8; }
.cell-add { font-size: 18px; color: var(--border); font-weight: 300; line-height: 1; }
.td-day-cell:hover .cell-add { color: var(--accent); }
.td-day-cell.unavail { background: #FFF5F5; }
.cell-unavail { font-size: 11px; color: #FCA5A5; font-weight: 600; }

/* ─── Auto-fill button ─── */
.autofill-btn {
  display: flex; align-items: center; gap: 8px; margin: 10px 20px 0;
  background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  padding: 12px 16px; cursor: pointer; font-family: var(--font); font-size: 13px;
  color: var(--text-2); font-weight: 500; width: calc(100% - 40px); transition: all .15s;
}
.autofill-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.03); }
.autofill-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.autofill-btn strong { font-weight: 700; color: var(--text); }

/* ─── Avail month style ─── */
.avail-month-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: white; border-bottom: 1px solid var(--border);
}
.avail-month-title { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
.avail-month-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.avail-legend { display: flex; gap: 14px; padding: 8px 20px; align-items: center; font-size: 11px; color: var(--text-3); font-weight: 500; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }

/* ─── Date-based avail grid ─── */
.avail-date-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border); padding: 14px 16px; box-shadow: var(--shadow-sm); }
.avail-date-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avail-date-name { font-size: 13px; font-weight: 600; flex:1; }
.avail-date-stats { font-size: 11px; color: var(--text-3); font-weight: 500; display: flex; gap: 6px; }
.avail-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.avail-cal-head { text-align: center; font-size: 9px; font-weight: 600; color: var(--text-3); padding: 3px 0; letter-spacing: .3px; text-transform: uppercase; }
.adc {
  text-align: center; padding: 5px 2px; border-radius: 6px; cursor: pointer;
  font-size: 11px; font-weight: 500; color: var(--text-2); transition: all .12s; min-height: 30px;
  display: flex; align-items: center; justify-content: center; border: 1.5px solid transparent;
}
.adc:hover { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.2); }
.adc.avail-yes { background: #DCFCE7; color: #166534; border-color: #86EFAC; font-weight: 600; }
.adc.avail-no { background: #FEE2E2; color: #991B1B; border-color: #FCA5A5; font-weight: 600; }
.adc.adc-empty { cursor: default; border-color: transparent !important; background: none !important; }
.adc.adc-past { color: var(--border); cursor: default; border-color: transparent !important; background: none !important; }

/* ─── Add emp button ─── */
.add-emp-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 20px 16px; padding: 12px; background: white; border: 2px dashed var(--border);
  border-radius: var(--radius-lg); cursor: pointer; font-size: 13px; font-weight: 600;
  color: var(--text-3); font-family: var(--font); transition: all .15s;
}
.add-emp-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.03); }

.td-sum-cell { text-align: right; padding: 10px 16px; white-space: nowrap; }
.sum-h { font-size: 13px; font-weight: 700; }
.sum-cost { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }

/* ─── Month table ─── */
.month-wrap { padding: 12px 20px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-tbl {
  width: 100%; border-collapse: collapse; min-width: 520px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
}
.month-tbl thead th {
  background: #F8FAFC; color: var(--text-3); font-size: 9px; font-weight: 600;
  padding: 9px 4px; text-align: center; white-space: nowrap; letter-spacing: .4px;
  border-bottom: 1.5px solid var(--border); text-transform: uppercase;
}
.month-tbl thead th.mth-emp { text-align: left; padding-left: 16px; min-width: 130px; }
.month-tbl thead th.mth-day { min-width: 30px; }
.month-tbl thead th.mth-day .mdn { font-size: 12px; font-weight: 700; color: var(--text); display: block; margin-top: 2px; letter-spacing: -.2px; text-transform: none; }
.month-tbl thead th.mth-day.mtoday { background: rgba(59,130,246,.06); color: var(--accent); }
.month-tbl thead th.mth-day.mtoday .mdn { color: var(--accent); }
.month-tbl tbody tr { border-top: 1px solid var(--border); }
.month-tbl tbody tr:hover { background: #FAFBFF; }
.month-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.month-tbl tbody td:last-child { border-right: none; }
.mtd-emp { display: flex; align-items: center; gap: 9px; padding: 9px 16px; min-height: 48px; }
.mtd-day {
  text-align: center; cursor: pointer; padding: 6px 2px; min-height: 48px;
  vertical-align: middle; transition: background .12s; font-size: 9px;
}
.mtd-day:hover { background: rgba(59,130,246,.06); }
.mtd-day.mfilled { }
.mtd-day.mtoday-cell { background: rgba(59,130,246,.05); }
.mtd-day.mweekend { background: #FFFBFB; }
.month-tbl thead th.mth-day.mweekend-h { background: #FEF2F2; color: #DC2626; }
.month-tbl thead th.mth-day.mweekend-h .mdn { color: #DC2626; }
.mtd-day.mweekend .mchip { background: #DC2626; }
.mchip { display: inline-block; background: var(--accent); color: white; font-size: 8px; font-weight: 600; padding: 2px 5px; border-radius: 4px; white-space: nowrap; box-shadow: 0 1px 3px rgba(59,130,246,.3); }

/* ─── Employees list ─── */
.emp-list { padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; }
.emp-row {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  box-shadow: var(--shadow-sm); transition: border-color .15s;
}
.emp-row:hover { border-color: var(--border-2); }
.emp-row-info { flex: 1; }
.emp-row-name { font-size: 14px; font-weight: 600; }
.emp-row-meta { font-size: 12px; color: var(--text-3); margin-top: 2px; font-weight: 400; }
.emp-row-stat { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.emp-rate { text-align: right; }
.emp-rate-val { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
.emp-rate-lbl { font-size: 10px; color: var(--text-3); font-weight: 400; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 7px; background: var(--bg); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  color: var(--text-3); transition: all .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.05); }

/* ─── Availability ─── */
.avail-list { padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; }
.avail-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border); padding: 14px 16px; }
.avail-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.avail-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.aday {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .1s;
}
.aday-label { font-size: 9px; font-weight: 500; color: var(--text-3); }
.aday-circle {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .12s;
}
.aday.yes .aday-circle { border-color: var(--green); background: var(--green); color: white; }
.aday.no .aday-circle { border-color: var(--danger); background: var(--danger); color: white; }
.aday.yes { background: var(--green-bg); }
.aday.no { background: var(--danger-bg); }

/* ─── Dashboard ─── */
.dash-wrap { padding: 12px 20px; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-box {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 16px 16px 14px; box-shadow: var(--shadow-sm);
}
.stat-box.accent { background: linear-gradient(135deg, var(--accent) 0%, #2563EB 100%); border-color: transparent; }
.stat-box-label { font-size: 11px; color: var(--text-3); font-weight: 500; margin-bottom: 6px; letter-spacing: .2px; }
.stat-box.accent .stat-box-label { color: rgba(255,255,255,.65); }
.stat-box-val { font-size: 24px; font-weight: 700; letter-spacing: -.6px; }
.stat-box.accent .stat-box-val { color: white; }
.stat-box-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; font-weight: 400; }
.stat-box.accent .stat-box-sub { color: rgba(255,255,255,.5); }
.dash-section-title { font-size: 11px; font-weight: 600; color: var(--text-3); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.dash-emp-rows { display: flex; flex-direction: column; gap: 6px; }
.dash-emp-row {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm);
}
.der-info { flex: 1; }
.der-name { font-size: 13px; font-weight: 600; }
.der-meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.der-right { text-align: right; }
.der-rate { font-size: 13px; font-weight: 700; }
.der-cost { font-size: 11px; color: var(--accent); font-weight: 600; }

/* ─── Employee dashboard ─── */
.emp-dash { padding: 12px 20px; }
.cta-card {
  background: linear-gradient(135deg, var(--accent) 0%, #2563EB 100%);
  border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 12px; color: white;
  box-shadow: 0 4px 16px rgba(59,130,246,.35);
}
.cta-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
.cta-sub { font-size: 13px; opacity: .85; font-weight: 400; }
.cta-btn {
  display: inline-block; margin-top: 14px; background: white; color: var(--accent);
  border: none; border-radius: 7px; padding: 8px 18px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: var(--font);
}
.info-card {
  background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border);
  padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
}
.info-card-title { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.my-shifts-list { display: flex; flex-direction: column; gap: 6px; }
.my-shift-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.msr-date { font-size: 13px; font-weight: 600; }
.msr-time { font-size: 13px; color: var(--accent); font-weight: 700; }
.msr-h { font-size: 11px; color: var(--text-3); }

/* ─── Stats grid (emp) ─── */
.emp-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.estat { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border); padding: 12px 10px; text-align: center; box-shadow: var(--shadow-sm); }
.estat-val { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
.estat-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 3px; }

/* ─── Export button ─── */
.export-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px; background: white; border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); cursor: pointer; font-size: 13px; font-weight: 600;
  color: var(--text-2); font-family: var(--font); transition: all .15s; margin-bottom: 10px;
}
.export-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.03); }
.export-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

/* ─── Month selector for export ─── */
.month-sel-row { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.month-sel-row::-webkit-scrollbar { display: none; }
.msel-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1.5px solid var(--border); background: white; color: var(--text-2); cursor: pointer; transition: all .15s; font-family: var(--font); flex-shrink: 0; }
.msel-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
  padding: 20px 22px 36px; transform: translateY(100%);
  transition: transform .24s cubic-bezier(.32,.72,0,1); max-height: 88vh; overflow-y: auto;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-pill { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; letter-spacing: -.3px; }
.modal-sub { font-size: 13px; color: var(--text-2); margin-bottom: 18px; font-weight: 400; }
.mfield { margin-bottom: 14px; }
.mfield label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
.mfield input, .mfield select {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text); background: white;
  transition: border-color .15s;
}
.mfield input:focus, .mfield select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.mbtn-cancel { padding: 12px 16px; background: var(--bg); color: var(--text-2); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.mbtn-delete { flex: 1; padding: 12px; background: var(--danger-bg); color: var(--danger); border: 1.5px solid #FECACA; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.mbtn-save { flex: 2; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .15s; }
.mbtn-save:hover { background: var(--accent-hover); }
.cost-preview { background: rgba(59,130,246,.06); border-radius: 8px; padding: 11px 13px; font-size: 12px; color: var(--text-2); margin-top: 4px; display: none; border: 1px solid rgba(59,130,246,.15); }
.cost-preview strong { color: var(--accent); font-weight: 700; }

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: var(--primary); color: white; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; pointer-events: none;
  white-space: nowrap; transition: all .2s cubic-bezier(.32,.72,0,1); box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Misc ─── */
.empty-state { text-align: center; padding: 56px 24px; color: var(--text-3); }
.empty-state svg { width: 40px; height: 40px; stroke: var(--border); margin-bottom: 14px; }
.empty-state p { font-size: 14px; font-weight: 600; color: var(--text-2); }
.empty-state span { font-size: 12px; }
.spinner { width: 24px; height: 24px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .65s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.sect-label { padding: 16px 20px 6px; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; }
</style>
</head>
<body>

<!-- AUTH -->

  <div class="auth-card">

<!-- APP -->

      Grafik
    </button>
    <button class="bnav-item" id="nav-emps" onclick="showView('emps')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Pracownicy
    </button>
    <button class="bnav-item" id="nav-avail" onclick="showView('avail')">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

<!-- SHIFT MODAL -->
<div class="modal-overlay" id="shift-modal">

        <select id="em-dept"><option value="kuchnia">Kuchnia</option><option value="sala">Sala</option></select>

      <button class="mbtn-cancel" onclick="closeModal('emp-modal')">Anuluj</button>
      <button class="mbtn-save" onclick="saveEmp()">Zapisz zmiany</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://kplaunvegdjgkycirzhk.supabase.co';
const SB_KEY = 'sb_publishable_DTD-TNu5Gjb0ug5Vxmpr6w_JVO_KgCF';

let currentUser=null, currentRole=null;
let employees=[], shifts=[], availability=[];
let currentWeekOffset=0, currentDept='all', currentView='sched', schedView='week';
let currentMonthOffset=0;
let currentShiftEmpId=null, currentShiftDate=null;
// availMonth: which month the availability tab is showing (offset from now)
let availMonthOffset=1; // default: next month

async function sbFetch(path, opts={}) {
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  const r=await fetch(SB_URL+path,{headers:h,...opts});
  if(!r.ok) throw new Error(await r.text());
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

async function doLogin() {
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('login-btn');
  btn.textContent='Logowanie...'; btn.disabled=true;
  document.getElementById('auth-err').style.display='none';
  try {
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const data=await r.json();
    if(data.error||!data.access_token) throw new Error(data.error_description||'Błąd logowania');
    currentUser=data;
    const rows=await sbFetch(`/rest/v1/user_roles?email=eq.${encodeURIComponent(email)}&select=role`).catch(()=>[]);
    currentRole=rows?.[0]?.role||'employee';
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('hdr-role').textContent={owner:'Właściciel',manager:'Manager',kitchen:'Kuchnia',front:'Sala',employee:'Pracownik'}[currentRole]||currentRole;
    document.getElementById('hdr-user').textContent=email.split('@')[0];
    if(!canEdit()){
      document.getElementById('nav-dash').style.display='flex'; // show "Mój panel" for employees too
      document.getElementById('nav-emps').style.display='none';
      // rename dash label for employees
      const dashLabel = document.querySelector('#nav-dash span') || document.querySelector('#nav-dash');
      const dashBtn = document.getElementById('nav-dash');
      if(dashBtn) dashBtn.querySelector('span:last-child') && (dashBtn.querySelector('span:last-child').textContent = 'Mój panel');
    }
    await loadAllData();
    showView('sched');
  } catch(e) {
    const el=document.getElementById('auth-err');
    el.textContent=e.message; el.style.display='block';
  }
  btn.textContent='Zaloguj się'; btn.disabled=false;
}

function doLogout(){
  currentUser=null; currentRole=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}

function canEdit(){return['owner','manager'].includes(currentRole);}

async function loadAllData(){
  employees=await sbFetch('/rest/v1/employees?select=*&active=eq.true&order=department,name').catch(()=>[]);
  await loadShiftsForCurrentPeriod();
  // Load availability — now date-based (availability_dates table) + legacy day_of_week
  availability=await sbFetch('/rest/v1/availability?select=*').catch(()=>[]);
  availDates=await sbFetch('/rest/v1/availability_dates?select=*').catch(()=>[]);
}

// availDates: [{id, employee_id, date, available}]
let availDates=[];

async function loadShiftsForCurrentPeriod(){
  let from,to;
  if(schedView==='week'){
    const w=getWeekRange(currentWeekOffset);
    from=w.from; to=w.to;
  } else {
    const m=getMonthRange(currentMonthOffset);
    from=m.from; to=m.to;
  }
  shifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);
}

function getWeekRange(offset){
  const now=new Date();
  const dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now); mon.setDate(now.getDate()-dow+offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return{from:fd(mon),to:fd(sun),monDate:mon};
}

function getMonthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  return{from:fd(first),to:fd(last),first,last,year:first.getFullYear(),month:first.getMonth()};
}

function fd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function today(){return fd(new Date());}
function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm); if(m<0)m+=1440; return m/60;
}
function avatarColor(n){
  const c=['#334155','#166534','#92400E','#5B21B6','#1E40AF','#065F46','#9A3412','#881337'];
  let h=0; for(let ch of n)h=ch.charCodeAt(0)+((h<<5)-h); return c[Math.abs(h)%c.length];
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function wNum(d){const j4=new Date(d.getFullYear(),0,4);return Math.ceil((((d-j4)/86400000)+j4.getDay()+1)/7);}
function monthName(m){return['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'][m];}

function showView(v){
  currentView=v;
  document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+v);
  if(el) el.classList.add('active');
  renderView();
}

function renderView(){
  const mc=document.getElementById('main-content');
  if(currentView==='sched') renderSched(mc);
  else if(currentView==='emps') renderEmps(mc);
  else if(currentView==='avail') renderAvail(mc);
  else if(currentView==='dash') renderDash(mc).catch(e=>console.error(e));
}

async function renderDashAsync(mc){ await renderDash(mc); }

async function changeWeek(d){
  currentWeekOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function goToToday(){
  currentWeekOffset=0; currentMonthOffset=0;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function changeMonth(d){
  currentMonthOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function switchSchedView(v){
  schedView=v;
  await loadShiftsForCurrentPeriod();
  renderView();
}

function setDept(d){currentDept=d;renderView();}

// ── SCHEDULE ──
function renderSched(mc){
  if(schedView==='week') renderWeek(mc);
  else renderMonth(mc);
}

function renderWeek(mc){
  const{from,to,monDate}=getWeekRange(currentWeekOffset);
  const tod=today();
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    return{date:fd(d),label:['Pon','Wt','Śr','Czw','Pt','Sob','Nd'][i],num:d.getDate()};
  });
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  let tc=0,th=0;
  shifts.forEach(s=>{
    const emp=employees.find(e=>e.id===s.employee_id); if(!emp)return;
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    tc+=h*(emp.rate_net||0); th+=h;
  });

  const sun=new Date(monDate); sun.setDate(monDate.getDate()+6);
  const rng=`${monDate.getDate()}.${pad(monDate.getMonth()+1)} — ${sun.getDate()}.${pad(sun.getMonth()+1)}.${sun.getFullYear()}`;

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn active" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeWeek(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${rng}</div>
      <div class="wn-week">Tydzień ${wNum(monDate)}${currentWeekOffset!==0?` · <span class="today-link" onclick="goToToday()">Dziś</span>`:''}</div>
    </div>
    <button class="wn-btn" onclick="changeWeek(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
    if(th>0){
      html+=`<div class="cost-strip">
        <div><div class="cs-label">Koszt tygodnia</div><div class="cs-val">${tc.toFixed(0)} zł</div></div>
        <div style="text-align:right"><div class="cs-label">Godziny</div><div class="cs-val">${th.toFixed(1)} h</div></div>
      </div>`;
    }
  }

  html+=`<div class="sched-wrap"><table class="sched-tbl"><thead><tr>
    <th class="th-emp">Pracownik</th>`;
  days.forEach((day,i)=>{
    const isT=day.date===tod;
    const isWe=i>=5; // Sat=5, Sun=6 (Mon=0 in our array)
    html+=`<th class="th-day${isT?' today':''}${isWe?' weekend':''}"><span style="text-transform:uppercase;letter-spacing:.3px">${day.label}</span><span class="dn">${day.num}</span></th>`;
  });
  if(canEdit()) html+=`<th class="th-sum">Tyg.</th>`;
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0,eC=0;
    eS.forEach(s=>{const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');eH+=h;eC+=h*(emp.rate_net||0);});
    const dc=emp.department==='kuchnia'?'#B45309':'#1D4ED8';

    html+=`<tr><td><div class="td-emp-cell">
      <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
      <div>
        <div class="td-emp-name">${emp.name}</div>
        <div class="td-emp-dept"><span class="dept-dot" style="background:${dc}"></span>${emp.department}</div>
      </div>
    </div></td>`;

    days.forEach((day,di)=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const isWe=di>=5;
      const h=shift?calcH(shift.start_time||'10:00:00',shift.end_time||'18:00:00'):0;
      const cost=h*(emp.rate_net||0);
      // Check date-based unavailability
      const unavail=availDates.find(a=>a.employee_id===emp.id&&a.date===day.date&&a.available===false);
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      let cellCls='td-day-cell';
      if(shift) cellCls+=' filled';
      if(isT) cellCls+=' is-today';
      if(isWe) cellCls+=' weekend';
      if(unavail&&!shift) cellCls+=' unavail';
      html+=`<td class="${cellCls}" ${ca}>`;
      if(shift){
        html+=`<div class="shift-chip">${(shift.start_time||'10:00').slice(0,5)}–${(shift.end_time||'18:00').slice(0,5)}</div>`;
        if(canEdit()&&(emp.rate_net||0)>1) html+=`<div class="shift-cost-lbl">${cost.toFixed(0)} zł</div>`;
      } else if(unavail){
        html+=`<div class="cell-unavail">✕</div>`;
      } else if(canEdit()){
        html+=`<div class="cell-add">+</div>`;
      }
      html+=`</td>`;
    });

    if(canEdit()){
      html+=`<td class="td-sum-cell">
        ${eH>0?`<div class="sum-h">${eH.toFixed(1)}h</div><div class="sum-cost">${(emp.rate_net||0)>1?eC.toFixed(0)+' zł':eS.length+' zm.'}</div>`:`<span style="color:var(--border)">—</span>`}
      </td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

function changeAvailMonth(d){ availMonthOffset+=d; renderView(); }

async function toggleAvailDate(empId,date){
  const ex=availDates.find(a=>a.employee_id===empId&&a.date===date);
  // cycle: none→yes→no→none
  let nv;
  if(!ex) nv=true;
  else if(ex.available===true) nv=false;
  else { // remove
    try{ await sbFetch(`/rest/v1/availability_dates?id=eq.${ex.id}`,{method:'DELETE'}); }catch(e){}
    availDates=availDates.filter(a=>a.id!==ex.id);
    const cell=document.getElementById(`adc-${empId}-${date}`);
    if(cell){cell.className='adc';cell.style.fontWeight='';}
    return;
  }
  try{
    if(ex){
      await sbFetch(`/rest/v1/availability_dates?id=eq.${ex.id}`,{method:'PATCH',body:JSON.stringify({available:nv})});
      ex.available=nv;
    } else {
      const r=await sbFetch('/rest/v1/availability_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({employee_id:empId,date,available:nv})});
      if(Array.isArray(r))availDates.push(...r);
    }
    const cell=document.getElementById(`adc-${empId}-${date}`);
    if(cell){
      cell.className='adc '+(nv?'avail-yes':'avail-no');
    }
  }catch(e){
    // Table may not exist yet — gracefully degrade
    showToast('Tabela availability_dates niedostępna — sprawdź Supabase');
  }
}

// Auto-fill: for the displayed month, insert shifts for employees on days they're available (skipping unavailable)
async function autoFillFromAvail(){
  const{year,month,daysInMonth}=getAvailMonth();
  const prefix=`${year}-${pad(month+1)}`;
  // Load existing shifts for that month
  const mShifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${prefix}-01&date=lte.${prefix}-${pad(daysInMonth)}`).catch(()=>[]);

  let added=0, skipped=0;
  const toInsert=[];

  for(const emp of employees){
    const empUnavail=availDates.filter(a=>a.employee_id===emp.id&&a.available===false&&a.date.startsWith(prefix));
    const unavailSet=new Set(empUnavail.map(a=>a.date));

    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${prefix}-${pad(d)}`;
      const dow=new Date(year,month,d).getDay();
      // Skip Sundays (dow=0) unless specifically marked available
      const isAvailable=availDates.find(a=>a.employee_id===emp.id&&a.date===dateStr&&a.available===true);
      if(!isAvailable) continue; // only fill days employee explicitly said yes
      if(unavailSet.has(dateStr)){skipped++;continue;}
      if(mShifts.find(s=>s.employee_id===emp.id&&s.date===dateStr)){skipped++;continue;}
      toInsert.push({employee_id:emp.id,date:dateStr,start_time:'10:00:00',end_time:'18:00:00',note:'auto'});
    }
  }

  if(!toInsert.length){showToast('Brak dyspozycji do wstawienia — najpierw zaznacz dostępne dni');return;}

  try{
    const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(toInsert)});
    if(Array.isArray(r)) shifts.push(...r);
    showToast(`Dodano ${toInsert.length} zmian na ${monthName(month)}`);
    schedView='month'; currentMonthOffset=availMonthOffset;
    await loadShiftsForCurrentPeriod();
    showView('sched');
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

// ── EXPORT ──
let exportMonthOffset = 0; // relative to current month

async function exportMonthReport(monthOff) {
  exportMonthOffset = monthOff;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + monthOff;
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const from = fd(first), to = fd(last);
  const mName = monthName(first.getMonth()) + ' ' + first.getFullYear();

  showToast('Pobieranie danych...');
  const mShifts = await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);

  // Build CSV
  let csv = '﻿'; // BOM for Excel
  csv += 'Pracownik;Dział;Email;Data;Dzień;Godzina start;Godzina koniec;Godziny;Stawka netto (zł/h);Koszt netto (zł);Notatka\n';

  const rows = [];
  mShifts.forEach(s => {
    const emp = employees.find(e => e.id === s.employee_id);
    if (!emp) return;
    const h = calcH(s.start_time || '10:00:00', s.end_time || '18:00:00');
    const cost = h * (emp.rate_net || 0);
    const d = new Date(s.date + 'T12:00:00');
    const dayNames = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
    rows.push({
      name: emp.name, dept: emp.department, email: emp.email || '',
      date: s.date, day: dayNames[d.getDay()],
      start: (s.start_time || '10:00:00').slice(0,5),
      end: (s.end_time || '18:00:00').slice(0,5),
      hours: h.toFixed(2), rate: (emp.rate_net || 0).toFixed(2),
      cost: cost.toFixed(2), note: s.note || ''
    });
  });

  rows.sort((a,b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date));
  rows.forEach(r => {
    csv += `${r.name};${r.dept};${r.email};${r.date};${r.day};${r.start};${r.end};${r.hours};${r.rate};${r.cost};${r.note}\n`;
  });

  // Summary per employee
  csv += '\n--- PODSUMOWANIE ---\n';
  csv += 'Pracownik;Dział;Email;Liczba zmian;Łączne godziny;Stawka zł/h;Koszt netto zł\n';
  const summary = {};
  rows.forEach(r => {
    if (!summary[r.name]) summary[r.name] = {dept:r.dept, email:r.email, shifts:0, hours:0, rate:parseFloat(r.rate), cost:0};
    summary[r.name].shifts++;
    summary[r.name].hours += parseFloat(r.hours);
    summary[r.name].cost += parseFloat(r.cost);
  });
  Object.entries(summary).forEach(([name, s]) => {
    csv += `${name};${s.dept};${s.email};${s.shifts};${s.hours.toFixed(2)};${s.rate.toFixed(2)};${s.cost.toFixed(2)}\n`;
  });
  const totalH = rows.reduce((a,r)=>a+parseFloat(r.hours),0);
  const totalC = rows.reduce((a,r)=>a+parseFloat(r.cost),0);
  csv += `RAZEM;;;${rows.length};${totalH.toFixed(2)};;${totalC.toFixed(2)}\n`;

  // Download
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `osteria-grafik-${mName.replace(' ','-')}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`Pobrano raport: ${mName}`);
}

        <div class="stat-box-sub">${kH.toFixed(1)}h · ${employees.filter(e=>e.department==='kuchnia').length} os.</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Sala</div>
        <div class="stat-box-val">${sC.toFixed(0)} <span style="font-size:12px;font-weight:400">zł</span></div>
        <div class="stat-box-sub">${sH.toFixed(1)}h · ${employees.filter(e=>e.department==='sala').length} os.</div>
      </div>
    </div>

    <div class="dash-section-title" style="margin-bottom:6px">Eksport raportu miesięcznego</div>
    <div class="month-sel-row">
      ${exportMonths.map(m=>`<button class="msel-btn" onclick="exportMonthReport(${m.off})">${m.label}</button>`).join('')}
    </div>
    <button class="export-btn" onclick="exportMonthReport(exportMonthOffset)">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Pobierz CSV (Excel) — pełen raport z godzinami
    </button>

    <div class="dash-section-title">Stawki i koszty — bieżący okres</div>
    <div class="dash-emp-rows">`;

  [...employees].sort((a,b)=>(b.rate_net||0)-(a.rate_net||0)).forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let wH=0; eS.forEach(s=>wH+=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00'));
    const wC=wH*(emp.rate_net||0);
    html+=`<div class="dash-emp-row">
      <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
      <div class="der-info">
        <div class="der-name">${emp.name}</div>
        <div class="der-meta">${emp.department} · ${wH.toFixed(1)}h · ${eS.length} zm.</div>
      </div>
      <div class="der-right">
        <div class="der-rate">${(emp.rate_net||0).toFixed(2)} zł/h</div>
        ${wC>0?`<div class="der-cost">${wC.toFixed(0)} zł</div>`:`<div style="font-size:11px;color:var(--text-3)">brak zmian</div>`}
      </div>
    </div>`;
  });
  html+=`</div></div>`;
  mc.innerHTML=html;
}

async function renderEmpDash(mc){
  const myEmail=currentUser?.user?.email;
  const emp=employees.find(e=>e.email===myEmail);
  const myShifts=shifts.filter(s=>s.employee_id===emp?.id).sort((a,b)=>a.date.localeCompare(b.date));
  const now=new Date();
  const nextMonth=new Date(now.getFullYear(),now.getMonth()+1,1);
  const nextMonthName=monthName(nextMonth.getMonth());

  // Load this month's shifts for stats
  const {from: mFrom, to: mTo} = getMonthRange(0);
  const thisMonthShifts = await sbFetch(`/rest/v1/shifts?select=*&employee_id=eq.${emp?.id}&date=gte.${mFrom}&date=lte.${mTo}`).catch(()=>[]);
  let mH=0, mC=0;
  thisMonthShifts.forEach(s=>{
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    mH+=h; mC+=h*(emp?.rate_net||0);
  });

  // Last month
  const {from: lmFrom, to: lmTo} = getMonthRange(-1);
  const lastMonthShifts = await sbFetch(`/rest/v1/shifts?select=*&employee_id=eq.${emp?.id}&date=gte.${lmFrom}&date=lte.${lmTo}`).catch(()=>[]);
  let lmH=0, lmC=0;
  lastMonthShifts.forEach(s=>{
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    lmH+=h; lmC+=h*(emp?.rate_net||0);
  });

  const hasRate=(emp?.rate_net||0)>1;

  let html=`<div class="page-bar"><div class="page-bar-title">Mój panel</div></div>
  <div class="emp-dash">

    <div class="emp-stats-grid">
      <div class="estat">
        <div class="estat-val" style="color:var(--accent)">${thisMonthShifts.length}</div>
        <div class="estat-lbl">zmian w tym miesiącu</div>
      </div>
      <div class="estat">
        <div class="estat-val">${mH.toFixed(1)}<span style="font-size:13px;font-weight:400">h</span></div>
        <div class="estat-lbl">godz. ten miesiąc</div>
      </div>
      <div class="estat">
        <div class="estat-val" style="color:var(--green)">${lastMonthShifts.length}</div>
        <div class="estat-lbl">zmian poprz. miesiąc</div>
      </div>
    </div>

    ${hasRate?`<div class="info-card" style="margin-bottom:10px">
      <div class="info-card-title">Zarobki netto</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;color:var(--text-2)">${monthName(now.getMonth())} ${now.getFullYear()}</span>
        <span style="font-size:18px;font-weight:700;color:var(--accent)">${mC.toFixed(0)} zł</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--text-3)">${monthName(new Date(now.getFullYear(),now.getMonth()-1,1).getMonth())} (poprzedni)</span>
        <span style="font-size:14px;font-weight:600;color:var(--text-3)">${lmC.toFixed(0)} zł</span>
      </div>
    </div>`:''}

    <div class="cta-card">
      <div class="cta-title">Zgłoś dyspozycyjność</div>
      <div class="cta-sub">Podaj dostępne dni na ${nextMonthName} — manager ułoży grafik na podstawie Twoich preferencji.</div>
      <button class="cta-btn" onclick="showView('avail')">Uzupełnij dyspozycyjność →</button>
    </div>

    <div class="info-card">
      <div class="info-card-title">Mój grafik — bieżący tydzień</div>`;

  if(myShifts.length===0){
    html+=`<div style="font-size:13px;color:var(--text-3);padding:8px 0">Brak zaplanowanych zmian</div>`;
  } else {
    html+=`<div class="my-shifts-list">`;
    myShifts.forEach(s=>{
      const d=new Date(s.date+'T12:00:00');
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      const dayLabel=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()];
      html+=`<div class="my-shift-row">
        <div>
          <div class="msr-date">${dayLabel} ${d.getDate()}.${pad(d.getMonth()+1)}</div>
          <div class="msr-h">${h.toFixed(1)} godz.</div>
        </div>
        <div class="msr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Upcoming shifts (this month beyond current week)
  const tod = today();
  const upcoming = thisMonthShifts.filter(s=>s.date>tod).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(upcoming.length>0){
    html+=`</div><div class="info-card"><div class="info-card-title">Nadchodzące zmiany</div><div class="my-shifts-list">`;
    upcoming.forEach(s=>{
      const d=new Date(s.date+'T12:00:00');
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      const dayLabel=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()];
      html+=`<div class="my-shift-row">
        <div>
          <div class="msr-date">${dayLabel} ${d.getDate()}.${pad(d.getMonth()+1)}</div>
          <div class="msr-h">${h.toFixed(1)} godz.</div>
        </div>
        <div class="msr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div></div>`;
  mc.innerHTML=html;
}

// ── SHIFT MODAL ──
function openShiftModal(empId,empName,date,shiftId){
  const shift=shiftId?shifts.find(s=>s.id===shiftId):null;
  const emp=employees.find(e=>e.id===empId);
  currentShiftEmpId=empId; currentShiftDate=date;
  document.getElementById('sm-title').textContent=shift?'Edytuj zmianę':'Nowa zmiana';
  const d=new Date(date+'T12:00:00');
  document.getElementById('sm-sub').textContent=`${empName} · ${['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()]} ${d.getDate()}.${pad(d.getMonth()+1)}`;
  document.getElementById('sm-shift-id').value=shiftId||'';
  document.getElementById('sm-start').value=(shift?.start_time||'10:00:00').slice(0,5);
  document.getElementById('sm-end').value=(shift?.end_time||'18:00:00').slice(0,5);
  document.getElementById('sm-note').value=shift?.note||'';
  document.getElementById('sm-delete').style.display=shift?'flex':'none';
  updateCostPreview(emp);
  document.getElementById('sm-start').oninput=()=>updateCostPreview(emp);
  document.getElementById('sm-end').oninput=()=>updateCostPreview(emp);
  openModal('shift-modal');
}

function updateCostPreview(emp){
  if(!emp||(emp.rate_net||0)<=1){document.getElementById('sm-cost-preview').style.display='none';return;}
  const h=calcH(document.getElementById('sm-start').value,document.getElementById('sm-end').value);
  document.getElementById('sm-cost-val').textContent=`${(h*(emp.rate_net||0)).toFixed(2)} zł (${h.toFixed(1)}h × ${emp.rate_net} zł/h)`;
  document.getElementById('sm-cost-preview').style.display='block';
}

async function saveShift(){
  const shiftId=document.getElementById('sm-shift-id').value;
  const p={employee_id:currentShiftEmpId,date:currentShiftDate,start_time:document.getElementById('sm-start').value+':00',end_time:document.getElementById('sm-end').value+':00',note:document.getElementById('sm-note').value};
  try{
    if(shiftId){
      await sbFetch(`/rest/v1/shifts?id=eq.${shiftId}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      const i=shifts.findIndex(s=>s.id===shiftId); if(i>=0)shifts[i]={...shifts[i],...p};
    } else {
      const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      if(Array.isArray(r))shifts.push(...r);
    }
    closeModal('shift-modal'); showToast('Zmiana zapisana'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function deleteShift(){
  const id=document.getElementById('sm-shift-id').value; if(!id)return;
  try{
    await sbFetch(`/rest/v1/shifts?id=eq.${id}`,{method:'DELETE'});
    shifts=shifts.filter(s=>s.id!==id); closeModal('shift-modal'); showToast('Zmiana usunięta'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
document.getElementById('auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
