<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Osteria Antonina — Grafik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #18181B;
  --accent-hover: #000000;
  --accent-soft: #F4F4F5;
  --bg: #FAFAFA;
  --surface: #ffffff;
  --border: #E4E4E7;
  --border-2: #D4D4D8;
  --text: #09090B;
  --text-2: #52525B;
  --text-3: #A1A1AA;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --warn: #D97706;
  --green: #16A34A;
  --green-bg: #F0FDF4;
  --red-soft: #FEF2F2;
  --radius: 6px;
  --radius-lg: 8px;
  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 4px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ─── Auth ─── */
#auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: #FAFAFA; padding: 24px;
}
.auth-card {
  background: white; border-radius: var(--radius-lg); padding: 36px 32px; width: 100%; max-width: 340px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.auth-brand { text-align: center; margin-bottom: 28px; }
.auth-logo {
  width: 40px; height: 40px; background: var(--text); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
  font-size: 18px;
}
.auth-brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.auth-brand p { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; letter-spacing: .1px; }
.field input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text);
  transition: border-color .12s; background: white;
}
.field input:focus { border-color: var(--text); box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
.btn-login {
  width: 100%; padding: 10px; background: var(--text); color: white; border: none;
  border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px;
  font-family: var(--font); letter-spacing: -.1px; transition: background .12s;
}
.btn-login:hover { background: #27272A; }
.auth-err { color: var(--danger); font-size: 12px; margin-top: 8px; text-align: center; display: none; }

/* ─── App shell ─── */
#app { display: none; }
.header {
  background: white; color: var(--text); height: 48px; padding: 0 16px;
  display: flex; align-items: center; position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--border); gap: 10px;
}
.header-brand { font-size: 14px; font-weight: 700; flex: 1; letter-spacing: -.3px; color: var(--text); }
.header-brand em { color: var(--text-3); font-style: normal; font-weight: 400; }
.role-badge {
  font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 4px;
  background: var(--accent-soft); color: var(--text-2); letter-spacing: .1px; border: 1px solid var(--border);
}
.header-name { font-size: 12px; color: var(--text-3); }
.btn-out {
  font-size: 11px; color: var(--text-3); background: none; border: 1px solid var(--border);
  padding: 4px 10px; border-radius: var(--radius); cursor: pointer; font-family: var(--font);
  transition: all .12s; font-weight: 500;
}
.btn-out:hover { color: var(--text-2); border-color: var(--border-2); }

/* ─── Bottom nav ─── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; background: white;
  border-top: 1px solid var(--border); display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(56px + env(safe-area-inset-bottom));
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-3); font-size: 10px; font-weight: 500;
  border: none; background: none; font-family: var(--font); transition: color .12s; position: relative;
  padding-top: 2px;
}
.bnav-item.active { color: var(--text); }
.bnav-item.active svg { stroke: var(--text); }
.bnav-item svg { width: 20px; height: 20px; stroke: var(--text-3); fill: none; stroke-width: 1.7; transition: stroke .12s; }
.bnav-item.active::after {
  content: ''; position: absolute; top: 0; left: 24%; right: 24%;
  height: 2px; background: var(--text); border-radius: 0 0 2px 2px;
}

.main { padding-bottom: 68px; }

/* ─── Page header bar ─── */
.page-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.page-bar-title { font-size: 15px; font-weight: 700; flex: 1; min-width: 120px; letter-spacing: -.3px; }
.view-toggle {
  display: flex; background: var(--bg); border-radius: var(--radius); padding: 2px; gap: 1px;
  border: 1px solid var(--border);
}
.vt-btn {
  padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; font-family: var(--font); color: var(--text-3);
  transition: all .12s;
}
.vt-btn.active { background: white; color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ─── Week nav ─── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 0; gap: 8px;
}
.wn-btn {
  width: 30px; height: 30px; border: 1px solid var(--border); background: white;
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); font-size: 15px; transition: all .12s;
  flex-shrink: 0;
}
.wn-btn:hover { border-color: var(--border-2); color: var(--text); }
.wn-label { text-align: center; flex: 1; }
.wn-range { font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.wn-week { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.today-link { color: var(--text-2); cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--border-2); }

/* ─── Dept tabs ─── */
.dept-row {
  display: flex; gap: 4px; padding: 10px 16px 0; overflow-x: auto;
  scrollbar-width: none;
}
.dept-row::-webkit-scrollbar { display: none; }
.dtab {
  padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1px solid var(--border); background: white;
  color: var(--text-2); cursor: pointer; transition: all .12s; font-family: var(--font);
}
.dtab.active { background: var(--text); color: white; border-color: var(--text); }
.dtab:hover:not(.active) { border-color: var(--border-2); color: var(--text); }

/* ─── Cost strip ─── */
.cost-strip {
  margin: 10px 16px 0; background: var(--accent-soft);
  border-radius: var(--radius-lg); padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border);
}
.cs-label { font-size: 10px; color: var(--text-3); font-weight: 500; letter-spacing: .2px; margin-bottom: 2px; }
.cs-val { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.5px; }

/* ─── Schedule table ─── */
.sched-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sched-tbl {
  width: 100%; border-collapse: collapse; min-width: 480px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border);
}
.sched-tbl thead th {
  background: var(--bg); color: var(--text-3); font-size: 10px; font-weight: 600;
  padding: 9px 6px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border); text-transform: uppercase;
}
.sched-tbl thead th.th-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.sched-tbl thead th.th-day { min-width: 64px; }
.sched-tbl thead th.th-day .dn { font-size: 16px; font-weight: 700; color: var(--text); display: block; margin-top: 1px; letter-spacing: -.3px; text-transform: none; }
.sched-tbl thead th.th-day.today { background: var(--text); color: white; }
.sched-tbl thead th.th-day.today .dn { color: white; }
.sched-tbl thead th.th-day.weekend { background: var(--red-soft); color: var(--danger); }
.sched-tbl thead th.th-day.weekend .dn { color: var(--danger); }
.td-day-cell.weekend { background: #FFFCFC; }
.td-day-cell.weekend:hover { background: var(--red-soft); }
.td-day-cell.weekend .shift-chip { background: var(--danger); box-shadow: none; }
.td-day-cell.weekend .shift-cost-lbl { color: var(--danger); }
.sched-tbl thead th.th-sum { min-width: 70px; text-align: right; padding-right: 14px; }
.sched-tbl tbody tr { border-top: 1px solid var(--border); }
.sched-tbl tbody tr:hover { background: var(--bg); }
.sched-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.sched-tbl tbody td:last-child { border-right: none; }

.td-emp-cell { display: flex; align-items: center; gap: 9px; padding: 9px 14px; min-height: 52px; }
.av {
  width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
}
.td-emp-name { font-size: 13px; font-weight: 600; }
.td-emp-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.dept-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

.td-day-cell {
  text-align: center; cursor: pointer; padding: 7px 3px; min-height: 52px;
  vertical-align: middle; transition: background .1s;
}
.td-day-cell:hover { background: var(--bg); }
.td-day-cell.is-today { background: rgba(0,0,0,.025); }
.shift-chip {
  display: inline-flex; align-items: center; background: var(--text); color: white;
  font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
  white-space: nowrap; letter-spacing: -.1px; gap: 2px;
}
.shift-cost-lbl { font-size: 9px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
.cell-add { font-size: 16px; color: var(--border-2); font-weight: 300; line-height: 1; }
.td-day-cell:hover .cell-add { color: var(--text-3); }
.td-day-cell.unavail { background: var(--red-soft); }
.cell-unavail { font-size: 11px; color: #FCA5A5; font-weight: 600; }

/* ─── Auto-fill button ─── */
.autofill-btn {
  display: flex; align-items: center; gap: 8px; margin: 10px 16px 0;
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; cursor: pointer; font-family: var(--font); font-size: 12px;
  color: var(--text-2); font-weight: 500; width: calc(100% - 32px); transition: all .12s;
}
.autofill-btn:hover { border-color: var(--border-2); color: var(--text); background: var(--bg); }
.autofill-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.autofill-btn strong { font-weight: 700; color: var(--text); }

/* ─── Avail header ─── */
.avail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--border);
}
.avail-header-title { font-size: 16px; font-weight: 700; letter-spacing: -.4px; }
.avail-header-month { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.avail-nav { display: flex; gap: 4px; }
.avail-nav button {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
  background: white; color: var(--text-2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .1s;
}
.avail-nav button:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Employee avail form ─── */
.avail-intro {
  padding: 16px 20px 8px; font-size: 13px; color: var(--text-2); line-height: 1.6;
  border-bottom: 1px solid var(--border);
}
.avail-intro strong { color: var(--text); font-weight: 600; }
.avail-status-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  background: #F0FDF4; border-bottom: 1px solid #BBF7D0;
  font-size: 12px; color: #166534; font-weight: 500;
}
.avail-status-bar.empty { background: #F8FAFC; border-color: var(--border); color: var(--text-3); }
.avail-days-list { padding: 0 20px 100px; }
.avail-week-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-3); padding: 14px 0 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}
.avail-day-row {
  display: flex; align-items: center; padding: 11px 0;
  border-bottom: 1px solid var(--border); gap: 12px; cursor: pointer;
}
.avail-day-row:last-child { border-bottom: none; }
.avail-day-row.past { opacity: .35; cursor: default; }
.avail-day-row.blocked { opacity: .5; cursor: not-allowed; }
.avail-day-num {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0;
  background: var(--bg); color: var(--text);
}
.avail-day-row.unavail .avail-day-num { background: #FEE2E2; color: #991B1B; }
.avail-day-row.blocked .avail-day-num { background: #F1F5F9; color: #94A3B8; }
.avail-day-info { flex: 1; }
.avail-day-name { font-size: 13px; font-weight: 600; color: var(--text); }
.avail-day-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.avail-day-row.unavail .avail-day-name { color: #991B1B; }
.avail-toggle {
  width: 44px; height: 24px; border-radius: 12px; background: #E2E8F0;
  position: relative; transition: background .15s; flex-shrink: 0;
}
.avail-toggle::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  background: white; top: 3px; left: 3px; transition: transform .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.avail-day-row.unavail .avail-toggle { background: #EF4444; }
.avail-day-row.unavail .avail-toggle::after { transform: translateX(20px); }
.avail-blocked-badge {
  font-size: 10px; font-weight: 600; color: #94A3B8; padding: 3px 8px;
  border: 1px solid #E2E8F0; border-radius: 4px; white-space: nowrap;
}
.avail-save-bar {
  position: fixed; bottom: 60px; left: 0; right: 0; padding: 12px 20px;
  background: white; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; z-index: 50;
}
.avail-save-btn {
  flex: 1; padding: 13px; background: var(--accent); color: white;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  font-family: var(--font); cursor: pointer; transition: background .12s;
}
.avail-save-btn:hover { background: var(--accent-hover); }
.avail-save-btn:disabled { background: var(--border); color: var(--text-3); cursor: default; }
.avail-clear-btn {
  padding: 13px 16px; background: none; color: var(--text-3); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer;
}

/* ─── Manager overview ─── */
.avail-manager-wrap { padding: 0 16px 20px; }
.avail-overview-title { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); padding: 14px 0 8px; }
.avail-emp-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.avail-emp-row:last-child { border-bottom: none; }
.avail-emp-name { font-size: 13px; font-weight: 600; flex: 1; }
.avail-emp-dept { font-size: 11px; color: var(--text-3); }
.avail-emp-badges { display: flex; gap: 4px; align-items: center; }
.abadge {
  font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px;
  white-space: nowrap;
}
.abadge-yes { background: var(--green-bg); color: var(--green); }
.abadge-no { background: var(--red-soft); color: var(--danger); }
.abadge-none { background: var(--bg); color: var(--text-3); border: 1px solid var(--border); }

/* ─── Blocked panel manager ─── */
.blocked-section { padding: 0 16px 14px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.blocked-section-title { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); padding: 14px 0 8px; }
.blocked-days-row { display: flex; flex-wrap: wrap; gap: 4px; }
.bday {
  width: 34px; height: 32px; border-radius: var(--radius); border: 1px solid var(--border);
  background: white; font-size: 12px; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: all .1s; display: flex; align-items: center; justify-content: center;
}
.bday:hover { border-color: var(--border-2); color: var(--text); }
.bday.bday-on { background: var(--text); color: white; border-color: var(--text); font-weight: 600; }

/* ─── Avail legend ─── */
.avail-legend { display: flex; gap: 14px; padding: 8px 20px 10px; align-items: center; font-size: 11px; color: var(--text-3); font-weight: 500; border-bottom: 1px solid var(--border); }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }

/* legacy adc — kept for manager calendar view */
.avail-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.avail-cal-head { text-align: center; font-size: 9px; font-weight: 600; color: var(--text-3); padding: 3px 0; }
.adc {
  text-align: center; padding: 5px 2px; border-radius: 4px; cursor: pointer;
  font-size: 11px; font-weight: 500; color: var(--text-2); transition: all .1s; min-height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.adc.avail-yes { background: #F0FDF4; color: #166534; font-weight: 700; }
.adc.avail-no { background: #FEF2F2; color: #991B1B; font-weight: 700; }
.adc.adc-empty { cursor: default; }
.adc.adc-past { color: var(--border); cursor: default; }
.adc.adc-blocked { background: #F1F5F9; color: #CBD5E1; cursor: not-allowed; }
.avail-date-card { padding: 12px 0; border-bottom: 1px solid var(--border); }
.avail-date-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.avail-date-name { font-size: 13px; font-weight: 600; flex:1; }
.avail-date-stats { font-size: 11px; color: var(--text-3); font-weight: 500; display: flex; gap: 6px; }

/* ─── Add emp button ─── */
.add-emp-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 16px 14px; padding: 10px; background: white; border: 1px dashed var(--border-2);
  border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-3); font-family: var(--font); transition: all .12s;
}
.add-emp-btn:hover { border-color: var(--border-2); color: var(--text-2); }

.td-sum-cell { text-align: right; padding: 9px 14px; white-space: nowrap; }
.sum-h { font-size: 13px; font-weight: 700; }
.sum-cost { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }

/* ─── Month table ─── */
.month-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-tbl {
  width: 100%; border-collapse: collapse; min-width: 520px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border);
}
.month-tbl thead th {
  background: var(--bg); color: var(--text-3); font-size: 9px; font-weight: 600;
  padding: 8px 3px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border); text-transform: uppercase;
}
.month-tbl thead th.mth-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.month-tbl thead th.mth-day { min-width: 28px; }
.month-tbl thead th.mth-day .mdn { font-size: 12px; font-weight: 700; color: var(--text); display: block; margin-top: 1px; letter-spacing: -.2px; text-transform: none; }
.month-tbl thead th.mth-day.mtoday { background: var(--text); color: white; }
.month-tbl thead th.mth-day.mtoday .mdn { color: white; }
.month-tbl tbody tr { border-top: 1px solid var(--border); }
.month-tbl tbody tr:hover { background: var(--bg); }
.month-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.month-tbl tbody td:last-child { border-right: none; }
.mtd-emp { display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px; }
.mtd-day {
  text-align: center; cursor: pointer; padding: 5px 2px; min-height: 44px;
  vertical-align: middle; transition: background .1s; font-size: 9px;
}
.mtd-day:hover { background: var(--bg); }

async function sbFetch(path, opts={}) {
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  const {headers:extraH, ...restOpts}=opts;
  const r=await fetch(SB_URL+path,{headers:{...h,...(extraH||{})}, ...restOpts});
  if(!r.ok) throw new Error(await r.text());
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

async function doLogin() {
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const btn=document.getElementById('login-btn');
  btn.textContent='Logowanie...'; btn.disabled=true;
  document.getElementById('auth-err').style.display='none';
  try {
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const data=await r.json();
    if(data.error||!data.access_token) throw new Error(data.error_description||'Błąd logowania');
    currentUser=data;
    const rows=await sbFetch(`/rest/v1/user_roles?email=eq.${encodeURIComponent(email)}&select=role`).catch(()=>[]);
    currentRole=rows?.[0]?.role||'employee';
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('hdr-role').textContent={owner:'Właściciel',manager:'Manager',kitchen:'Kuchnia',front:'Sala',employee:'Pracownik'}[currentRole]||currentRole;
    document.getElementById('hdr-user').textContent=email.split('@')[0];
    if(!canEdit()){
      document.getElementById('nav-dash').style.display='flex'; // show "Mój panel" for employees too
      document.getElementById('nav-emps').style.display='none';
      // rename dash label for employees
      const dashLabel = document.querySelector('#nav-dash span') || document.querySelector('#nav-dash');
      const dashBtn = document.getElementById('nav-dash');
      if(dashBtn) dashBtn.querySelector('span:last-child') && (dashBtn.querySelector('span:last-child').textContent = 'Mój panel');
    }
    await loadAllData();
    showView('sched');
  } catch(e) {
    const el=document.getElementById('auth-err');
    el.textContent=e.message; el.style.display='block';
  }
  btn.textContent='Zaloguj się'; btn.disabled=false;
}

function doLogout(){
  currentUser=null; currentRole=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
}

function canEdit(){return['owner','manager'].includes(currentRole);}

async function loadAllData(){
  employees=await sbFetch('/rest/v1/employees?select=*&active=eq.true&order=department,name').catch(()=>[]);
  await loadShiftsForCurrentPeriod();
  // Load availability — now date-based (availability_dates table) + legacy day_of_week
  availability=await sbFetch('/rest/v1/availability?select=*').catch(()=>[]);
  availDates=await sbFetch('/rest/v1/availability_dates?select=*').catch(()=>[]);
  blockedDates=await sbFetch('/rest/v1/blocked_dates?select=*').catch(()=>[]);
  // Load work sessions (today + last 7 days)
  await loadWorkSessions();
}

async function loadWorkSessions(){
  const from=new Date(); from.setDate(from.getDate()-7);
  const fromStr=fd(from)+'T00:00:00';
  workSessions=await sbFetch(`/rest/v1/work_sessions?select=*,employees(name,department)&clock_in=gte.${fromStr}&order=clock_in.desc`).catch(()=>[]);
  // Find active session for current user
  const me=getCurrentEmployee();
  if(me){
    activeSession=workSessions.find(s=>s.employee_id===me.id && !s.clock_out)||null;
  } else {
    activeSession=null;
  }
}

// availDates: [{id, employee_id, date, available}]
let availDates=[];
// blockedDates: [{id, date, reason}]
let blockedDates=[];

async function loadShiftsForCurrentPeriod(){
  let from,to;
  if(schedView==='week'){
    const w=getWeekRange(currentWeekOffset);
    from=w.from; to=w.to;
  } else {
    const m=getMonthRange(currentMonthOffset);
    from=m.from; to=m.to;
  }
  shifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);
}

function getWeekRange(offset){
  const now=new Date();
  const dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now); mon.setDate(now.getDate()-dow+offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return{from:fd(mon),to:fd(sun),monDate:mon};
}

function getMonthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  return{from:fd(first),to:fd(last),first,last,year:first.getFullYear(),month:first.getMonth()};
}

function fd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function today(){return fd(new Date());}
function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm); if(m<0)m+=1440; return m/60;
}
function avatarColor(n){
  const c=['#334155','#166534','#92400E','#5B21B6','#1E40AF','#065F46','#9A3412','#881337'];
  let h=0; for(let ch of n)h=ch.charCodeAt(0)+((h<<5)-h); return c[Math.abs(h)%c.length];
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function wNum(d){const j4=new Date(d.getFullYear(),0,4);return Math.ceil((((d-j4)/86400000)+j4.getDay()+1)/7);}
function monthName(m){return['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'][m];}

function showView(v){
  currentView=v;
  document.querySelectorAll('.bnav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+v);
  if(el) el.classList.add('active');
  renderView();
}

function renderView(){
  const mc=document.getElementById('main-content');
  if(currentView==='sched') renderSched(mc);
  else if(currentView==='emps') renderEmps(mc);
  else if(currentView==='avail') renderAvail(mc);
  else if(currentView==='dash') renderDash(mc).catch(e=>console.error(e));
  else if(currentView==='clock') renderClock(mc);
}

async function renderDashAsync(mc){ await renderDash(mc); }

async function changeWeek(d){
  currentWeekOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function goToToday(){
  currentWeekOffset=0; currentMonthOffset=0;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function changeMonth(d){
  currentMonthOffset+=d;
  await loadShiftsForCurrentPeriod();
  renderView();
}

async function switchSchedView(v){
  schedView=v;
  await loadShiftsForCurrentPeriod();
  renderView();
}

function setDept(d){currentDept=d;renderView();}

// ── SCHEDULE ──
function renderSched(mc){
  if(schedView==='week') renderWeek(mc);
  else renderMonth(mc);
}

function renderWeek(mc){
  const{from,to,monDate}=getWeekRange(currentWeekOffset);
  const tod=today();
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    return{date:fd(d),label:['Pon','Wt','Śr','Czw','Pt','Sob','Nd'][i],num:d.getDate()};
  });
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  let tc=0,th=0;
  shifts.forEach(s=>{
    const emp=employees.find(e=>e.id===s.employee_id); if(!emp)return;
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    tc+=h*(emp.rate_net||0); th+=h;
  });

  const sun=new Date(monDate); sun.setDate(monDate.getDate()+6);
  const rng=`${monDate.getDate()}.${pad(monDate.getMonth()+1)} — ${sun.getDate()}.${pad(sun.getMonth()+1)}.${sun.getFullYear()}`;

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn active" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeWeek(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${rng}</div>
      <div class="wn-week">Tydzień ${wNum(monDate)}${currentWeekOffset!==0?` · <span class="today-link" onclick="goToToday()">Dziś</span>`:''}</div>
    </div>
    <button class="wn-btn" onclick="changeWeek(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
    if(th>0){
      html+=`<div class="cost-strip">
        <div><div class="cs-label">Koszt tygodnia</div><div class="cs-val">${tc.toFixed(0)} zł</div></div>
        <div style="text-align:right"><div class="cs-label">Godziny</div><div class="cs-val">${th.toFixed(1)} h</div></div>
      </div>`;
    }
  }

  html+=`<div class="sched-wrap"><table class="sched-tbl"><thead><tr>
    <th class="th-emp">Pracownik</th>`;
  days.forEach((day,i)=>{
    const isT=day.date===tod;
    const isWe=i>=5; // Sat=5, Sun=6 (Mon=0 in our array)
    html+=`<th class="th-day${isT?' today':''}${isWe?' weekend':''}"><span style="text-transform:uppercase;letter-spacing:.3px">${day.label}</span><span class="dn">${day.num}</span></th>`;
  });
  if(canEdit()) html+=`<th class="th-sum">Tyg.</th>`;
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0,eC=0;
    eS.forEach(s=>{const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');eH+=h;eC+=h*(emp.rate_net||0);});
    const dc=emp.department==='kuchnia'?'#B45309':'#1D4ED8';

    html+=`<tr><td><div class="td-emp-cell">
      <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
      <div>
        <div class="td-emp-name">${emp.name}</div>
        <div class="td-emp-dept"><span class="dept-dot" style="background:${dc}"></span>${emp.department}</div>
      </div>
    </div></td>`;

    days.forEach((day,di)=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const isWe=di>=5;
      const h=shift?calcH(shift.start_time||'10:00:00',shift.end_time||'18:00:00'):0;
      const cost=h*(emp.rate_net||0);
      // Check date-based unavailability
      const unavail=availDates.find(a=>a.employee_id===emp.id&&a.date===day.date&&a.available===false);
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      let cellCls='td-day-cell';
      if(shift) cellCls+=' filled';
      if(isT) cellCls+=' is-today';
      if(isWe) cellCls+=' weekend';
      if(unavail&&!shift) cellCls+=' unavail';
      html+=`<td class="${cellCls}" ${ca}>`;
      if(shift){
        html+=`<div class="shift-chip">${(shift.start_time||'10:00').slice(0,5)}–${(shift.end_time||'18:00').slice(0,5)}</div>`;
        if(canEdit()&&(emp.rate_net||0)>1) html+=`<div class="shift-cost-lbl">${cost.toFixed(0)} zł</div>`;
      } else if(unavail){
        html+=`<div class="cell-unavail">✕</div>`;
      } else if(canEdit()){
        html+=`<div class="cell-add">+</div>`;
      }
      html+=`</td>`;
    });

    if(canEdit()){
      html+=`<td class="td-sum-cell">
        ${eH>0?`<div class="sum-h">${eH.toFixed(1)}h</div><div class="sum-cost">${(emp.rate_net||0)>1?eC.toFixed(0)+' zł':eS.length+' zm.'}</div>`:`<span style="color:var(--border)">—</span>`}
      </td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

function renderMonth(mc){
  const{from,to,first,last,year,month}=getMonthRange(currentMonthOffset);
  const tod=today();
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  const daysInMonth=last.getDate();
  // Build array of all days
  const days=Array.from({length:daysInMonth},(_,i)=>{
    const d=new Date(year,month,i+1);
    const dow=d.getDay(); // 0=Sun
    const dateStr=`${year}-${pad(month+1)}-${pad(i+1)}`;
    return{d:i+1,date:dateStr,dow,weekend:dow===0||dow===6};
  });

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn active" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeMonth(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${monthName(month)} ${year}</div>
      ${currentMonthOffset!==0?`<div class="wn-week"><span class="today-link" onclick="goToToday()">Dziś</span></div>`:''}
    </div>
    <button class="wn-btn" onclick="changeMonth(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
  }

  const dowLabels=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'];

  html+=`<div class="month-wrap"><table class="month-tbl"><thead><tr>
    <th class="mth-emp">Pracownik</th>`;
  days.forEach(day=>{
    const isT=day.date===tod;
    const isWe=day.dow===0||day.dow===6;
    html+=`<th class="mth-day${isT?' mtoday':''}${isWe?' mweekend-h':''}">
      <span>${dowLabels[day.dow].slice(0,2)}</span>
      <span class="mdn">${day.d}</span>
    </th>`;
  });
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0; eS.forEach(s=>eH+=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00'));
    html+=`<tr><td><div class="mtd-emp">
      <div class="av" style="background:${avatarColor(emp.name)};width:24px;height:24px;font-size:9px;border-radius:5px">${initials(emp.name)}</div>
      <div>
        <div style="font-size:12px;font-weight:500">${emp.name.split(' ')[0]}</div>
        ${eH>0?`<div style="font-size:10px;color:var(--accent)">${eH.toFixed(0)}h</div>`:''}
      </div>
    </div></td>`;
    days.forEach(day=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      html+=`<td class="mtd-day${shift?' mfilled':''}${isT?' mtoday-cell':''}${day.weekend?' mweekend':''}" ${ca}>`;
      if(shift){
        html+=`<div class="mchip">${(shift.start_time||'10:00').slice(0,5)}</div>`;
      } else if(canEdit()){
        html+=`<span style="color:var(--border);font-size:12px">+</span>`;
      }
      html+=`</td>`;
    });
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

// ── EMPLOYEES ──
function renderEmps(mc){
  if(!canEdit()){mc.innerHTML='<div class="empty-state"><p>Brak dostępu</p></div>';return;}
  let html=`<div class="page-bar"><div class="page-bar-title">Pracownicy <span style="color:var(--text-3);font-weight:400">${employees.length}</span></div></div>`;
  ['kuchnia','sala'].forEach(dept=>{
    const list=employees.filter(e=>e.department===dept);
    if(!list.length) return;
    const dc=dept==='kuchnia'?'#B45309':'#1D4ED8';
    html+=`<div class="sect-label">${dept.charAt(0).toUpperCase()+dept.slice(1)}</div><div class="emp-list" style="padding-top:0">`;
    list.forEach(emp=>{
      const eS=shifts.filter(s=>s.employee_id===emp.id);
      let wH=0; eS.forEach(s=>wH+=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00'));
      const wC=wH*(emp.rate_net||0);
      html+=`<div class="emp-row">
        <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
        <div class="emp-row-info">
          <div class="emp-row-name">${emp.name}</div>
          <div class="emp-row-meta"><span class="dept-dot" style="background:${dc};display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:4px;vertical-align:middle"></span>${emp.email||'—'}</div>
          ${wH>0?`<div class="emp-row-stat">${wH.toFixed(1)}h · ${wC.toFixed(0)} zł ten tydzień</div>`:''}
        </div>
        <div class="emp-rate">
          <div class="emp-rate-val">${(emp.rate_net||0).toFixed(2)}</div>
          <div class="emp-rate-lbl">zł / h</div>
        </div>
        <div class="icon-btn" onclick="openEmpModal('${emp.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  mc.innerHTML=html;
}

function openEmpModal(id){
  const emp=employees.find(e=>e.id===id); if(!emp)return;
  document.getElementById('em-id').value=id;
  document.getElementById('em-name').value=emp.name;
  document.getElementById('em-dept').value=emp.department;
  document.getElementById('em-rate').value=emp.rate_net||0;
  document.getElementById('em-email').value=emp.email||'';
  document.getElementById('em-sub').textContent=emp.department+' · '+(emp.email||'');
  openModal('emp-modal');
}

async function saveEmp(){
  const id=document.getElementById('em-id').value;
  const p={name:document.getElementById('em-name').value,department:document.getElementById('em-dept').value,rate_net:parseFloat(document.getElementById('em-rate').value)||0,email:document.getElementById('em-email').value};
  try{
    await sbFetch(`/rest/v1/employees?id=eq.${id}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
    const i=employees.findIndex(e=>e.id===id); if(i>=0)employees[i]={...employees[i],...p};
    closeModal('emp-modal'); showToast('Dane zaktualizowane'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

// ── AVAILABILITY (date-based per month) ──
// pendingUnavail = set of date strings the employee marked but hasn't saved yet
let pendingUnavail = new Set();
let pendingUnavailDirty = false;

function getAvailMonth(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+availMonthOffset;
  const first=new Date(y,m,1); const last=new Date(y,m+1,0);
  return{year:first.getFullYear(),month:first.getMonth(),first,last,daysInMonth:last.getDate()};
}

function renderAvail(mc){
  const myEmail=currentUser?.user?.email;
  const meEmp=employees.find(e=>e.email===myEmail);
  const{year,month,first,daysInMonth}=getAvailMonth();
  const tod=today();
  const prefix=`${year}-${pad(month+1)}`;
  const dowPL=['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];
  const monthBlocked=blockedDates.filter(b=>b.date.startsWith(prefix));

  // ── Header ──
  let html=`<div class="avail-header">
    <div>
      <div class="avail-header-title">${monthName(month)} ${year}</div>
      <div class="avail-header-month">Dyspozycyjność</div>
    </div>
    <div class="avail-nav">
      <button onclick="changeAvailMonth(-1)">‹</button>
      <button onclick="changeAvailMonth(1)">›</button>
    </div>
  </div>`;

  if(canEdit()){
    // ── MANAGER VIEW ──
    const viewEmps=employees;
    const submitted=viewEmps.filter(emp=>availDates.some(a=>a.employee_id===emp.id&&a.date.startsWith(prefix))).length;

    // Blocked panel
    html+=`<div class="blocked-section">
      <div class="blocked-section-title">Zablokowane dni</div>
      <div class="blocked-days-row">`;
    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${prefix}-${pad(d)}`;
      const isB=monthBlocked.some(b=>b.date===dateStr);
      const dow=new Date(year,month,d).getDay();
      const isWe=dow===0||dow===6;
      html+=`<button class="bday${isB?' bday-on':''}${isWe?' bday-we':''}" onclick="toggleBlockedDate('${dateStr}')" title="${dateStr}">${d}</button>`;
    }
    html+=`</div></div>`;

    // Autofill
    if(availMonthOffset>=1){
      html+=`<div style="padding:0 20px 10px"><button class="autofill-btn" onclick="autoFillFromAvail()">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span>Zaproponuj grafik na <strong>${monthName(month)}</strong> na podstawie dyspozycji</span>
      </button></div>`;
    }

    // Overview table
    html+=`<div class="avail-manager-wrap">
      <div class="avail-overview-title">${submitted}/${viewEmps.length} pracowników — zgłoszenia</div>`;

    viewEmps.forEach(emp=>{
      const empDates=availDates.filter(a=>a.employee_id===emp.id&&a.date.startsWith(prefix));
      const noCount=empDates.filter(a=>a.available===false).length;
      const hasSubmitted=empDates.length>0;
      const dc=emp.department==='kuchnia'?'#B45309':'#1D4ED8';
      html+=`<div class="avail-emp-row">
        <div class="av" style="background:${avatarColor(emp.name)};width:30px;height:30px;font-size:11px;flex-shrink:0">${initials(emp.name)}</div>
        <div style="flex:1;min-width:0">
          <div class="avail-emp-name">${emp.name}</div>
          <div class="avail-emp-dept"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${dc};margin-right:4px;vertical-align:middle"></span>${emp.department}</div>
        </div>
        <div class="avail-emp-badges">`;
      if(!hasSubmitted){
        html+=`<span class="abadge abadge-none">Brak zgłoszenia</span>`;
      } else {
        if(noCount) html+=`<span class="abadge abadge-no">${noCount} niedost.</span>`;
        html+=`<span class="abadge abadge-yes">${daysInMonth-noCount-monthBlocked.length} dni dostępny</span>`;
      }
      html+=`</div></div>`;

      // Calendar mini view — small grid per employee
      if(hasSubmitted){
        html+=`<div style="padding:0 0 10px 42px"><div class="avail-cal" style="max-width:220px">`;
        dowPL.forEach(l=>html+=`<div class="avail-cal-head">${l}</div>`);
        const startDow=first.getDay();
        for(let i=0;i<startDow;i++) html+=`<div class="adc adc-empty"></div>`;
        for(let d=1;d<=daysInMonth;d++){
          const dateStr=`${prefix}-${pad(d)}`;
          const rec=empDates.find(a=>a.date===dateStr);
          const isBlocked=monthBlocked.some(b=>b.date===dateStr);
          let cls='adc';
          if(isBlocked) cls+=' adc-blocked';
          else if(rec?.available===false) cls+=' avail-no';
          else if(dateStr<tod) cls+=' adc-past';
          html+=`<div class="${cls}">${d}</div>`;
        }
        html+=`</div></div>`;
      }
    });
    html+=`</div>`;

  } else {
    // ── EMPLOYEE VIEW ──
    if(!meEmp){
      html+=`<div class="empty-state"><p>Nie znaleziono Twojego konta w bazie pracowników.</p></div>`;
      mc.innerHTML=html; return;
    }
    const empId=meEmp.id;
    // Load saved unavail for this month
    const savedUnavail=new Set(
      availDates.filter(a=>a.employee_id===empId&&a.date.startsWith(prefix)&&a.available===false).map(a=>a.date)
    );
    // On first render of a month, seed pending from saved
    if(!pendingUnavailDirty){
      pendingUnavail=new Set(savedUnavail);
    }
    const unavailSet=pendingUnavail;
    const noCount=unavailSet.size;

    // Status bar
    if(noCount>0){
      html+=`<div class="avail-status-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Zaznaczono ${noCount} ${noCount===1?'dzień':'dni'} niedostępności
      </div>`;
    } else {
      html+=`<div class="avail-status-bar empty">Nie zaznaczono żadnych dni niedostępności — jesteś dostępny cały miesiąc</div>`;
    }

    html+=`<div style="padding:10px 20px 6px;font-size:12px;color:var(--text-3)">Zaznacz dni, kiedy <strong style="color:var(--text)">NIE możesz</strong> pracować. Reszta jest uznana za dostępną.</div>`;
    html+=`<div class="avail-days-list">`;

    // Build weeks
    let weekDays=[];
    const startDow=first.getDay();
    // pad start
    for(let i=0;i<startDow;i++) weekDays.push(null);
    for(let d=1;d<=daysInMonth;d++) weekDays.push(d);
    // pad end to multiple of 7
    while(weekDays.length%7!==0) weekDays.push(null);

    const fullDowPL=['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
    for(let w=0;w<weekDays.length;w+=7){
      const week=weekDays.slice(w,w+7);
      const hasReal=week.some(d=>d!==null);
      if(!hasReal) continue;
      // Week label: show range
      const firstDay=week.find(d=>d!==null);
      const lastDay=[...week].reverse().find(d=>d!==null);
      html+=`<div class="avail-week-label">${monthName(month).slice(0,3).toUpperCase()} ${firstDay}–${lastDay}</div>`;
      week.forEach((d,wi)=>{
        if(!d) return;
        const dateStr=`${prefix}-${pad(d)}`;
        const isBlocked=monthBlocked.some(b=>b.date===dateStr);
        const isPast=dateStr<tod;
        const isUnavail=unavailSet.has(dateStr);
        const dowName=fullDowPL[wi];
        let rowCls='avail-day-row';
        if(isPast) rowCls+=' past';
        else if(isBlocked) rowCls+=' blocked';
        else if(isUnavail) rowCls+=' unavail';
        const clickable=!isPast&&!isBlocked;
        html+=`<div class="${rowCls}"${clickable?` onclick="togglePendingUnavail('${dateStr}')"`:''}>
          <div class="avail-day-num">${d}</div>
          <div class="avail-day-info">
            <div class="avail-day-name">${dowName}</div>
            <div class="avail-day-sub">${isBlocked?'Dzień zablokowany':isUnavail?'Niedostępny':isPast?'Miniony':'Dostępny'}</div>
          </div>`;
        if(isBlocked){
          html+=`<span class="avail-blocked-badge">🔒 blokada</span>`;
        } else if(!isPast){
          html+=`<div class="avail-toggle"></div>`;
        }
        html+=`</div>`;
      });
    }
    html+=`</div>`;

    // Save bar
    html+=`<div class="avail-save-bar">
      <button class="avail-clear-btn" onclick="clearPendingUnavail()">Wyczyść</button>
      <button class="avail-save-btn" onclick="saveAvailability('${empId}','${prefix}')">Zapisz dyspozycję</button>
    </div>`;
  }

  mc.innerHTML=html;
}

function changeAvailMonth(d){
  availMonthOffset+=d;
  pendingUnavailDirty=false; // reset pending on month change
  renderView();
}

function togglePendingUnavail(date){
  if(pendingUnavail.has(date)) pendingUnavail.delete(date);
  else pendingUnavail.add(date);
  pendingUnavailDirty=true;
  // Update row visually without full re-render
  const rows=document.querySelectorAll('.avail-day-row');
  rows.forEach(row=>{
    const onclick=row.getAttribute('onclick')||'';
    if(!onclick.includes(date)) return;
    const isNow=pendingUnavail.has(date);
    row.classList.toggle('unavail',isNow);
    const sub=row.querySelector('.avail-day-sub');
    if(sub) sub.textContent=isNow?'Niedostępny':'Dostępny';
  });
  // Update status bar count
  const sb=document.querySelector('.avail-status-bar');
  if(sb){
    const n=pendingUnavail.size;
    if(n>0){
      sb.className='avail-status-bar';
      sb.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Zaznaczono ${n} ${n===1?'dzień':'dni'} niedostępności`;
    } else {
      sb.className='avail-status-bar empty';
      sb.innerHTML='Nie zaznaczono żadnych dni niedostępności — jesteś dostępny cały miesiąc';
    }
  }
}

function clearPendingUnavail(){
  pendingUnavail.clear();
  pendingUnavailDirty=true;
  renderView();
}

async function saveAvailability(empId,prefix){
  const btn=document.querySelector('.avail-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Zapisywanie...';}
  try{
    // 1. Delete all existing availability_dates for this employee & month
    await sbFetch(`/rest/v1/availability_dates?employee_id=eq.${empId}&date=gte.${prefix}-01&date=lte.${prefix}-31`,{method:'DELETE'});
    // 2. Insert unavail records for each pending date
    if(pendingUnavail.size>0){
      const rows=[...pendingUnavail].map(date=>({employee_id:empId,date,available:false}));
      const inserted=await sbFetch('/rest/v1/availability_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(rows)});
      // Update local cache
      availDates=availDates.filter(a=>!(a.employee_id===empId&&a.date.startsWith(prefix)));
      if(Array.isArray(inserted)) availDates.push(...inserted);
    } else {
      availDates=availDates.filter(a=>!(a.employee_id===empId&&a.date.startsWith(prefix)));
    }
    pendingUnavailDirty=false;
    showToast('✓ Dyspozycja zapisana');
    renderView();
  }catch(e){
    showToast('Błąd zapisu: '+e.message.slice(0,60));
    if(btn){btn.disabled=false;btn.textContent='Zapisz dyspozycję';}
  }
}

async function toggleBlockedDate(date){
  const ex=blockedDates.find(b=>b.date===date);
  try{
    if(ex){
      await sbFetch(`/rest/v1/blocked_dates?id=eq.${ex.id}`,{method:'DELETE'});
      blockedDates=blockedDates.filter(b=>b.id!==ex.id);
      showToast('Odblokowano '+date.slice(5));
    } else {
      const r=await sbFetch('/rest/v1/blocked_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({date,reason:''})});
      if(Array.isArray(r))blockedDates.push(...r);
      showToast('Zablokowano '+date.slice(5));
    }
    renderView();
  } catch(e){
    showToast('Błąd przy blokowaniu dnia');
  }
}

// Auto-fill: for the displayed month, insert shifts for employees on days they're available (skipping unavailable)
async function autoFillFromAvail(){
  const{year,month,daysInMonth}=getAvailMonth();
  const prefix=`${year}-${pad(month+1)}`;
  // Load existing shifts for that month
  const mShifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${prefix}-01&date=lte.${prefix}-${pad(daysInMonth)}`).catch(()=>[]);

  let added=0, skipped=0;
  const toInsert=[];

  for(const emp of employees){
    const empUnavail=availDates.filter(a=>a.employee_id===emp.id&&a.available===false&&a.date.startsWith(prefix));
    const unavailSet=new Set(empUnavail.map(a=>a.date));

    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${prefix}-${pad(d)}`;
      const dow=new Date(year,month,d).getDay();
      // Skip Sundays (dow=0) unless specifically marked available
      const isAvailable=availDates.find(a=>a.employee_id===emp.id&&a.date===dateStr&&a.available===true);
      if(!isAvailable) continue; // only fill days employee explicitly said yes
      if(unavailSet.has(dateStr)){skipped++;continue;}
      if(mShifts.find(s=>s.employee_id===emp.id&&s.date===dateStr)){skipped++;continue;}
      toInsert.push({employee_id:emp.id,date:dateStr,start_time:'10:00:00',end_time:'18:00:00',note:'auto'});
    }
  }

  if(!toInsert.length){showToast('Brak dyspozycji do wstawienia — najpierw zaznacz dostępne dni');return;}

  try{
    const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(toInsert)});
    if(Array.isArray(r)) shifts.push(...r);
    showToast(`Dodano ${toInsert.length} zmian na ${monthName(month)}`);
    schedView='month'; currentMonthOffset=availMonthOffset;
    await loadShiftsForCurrentPeriod();
    showView('sched');
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function toggleAvail(empId,day){
  const ex=availability.find(a=>a.employee_id===empId&&a.day_of_week===day);
  const nv=ex?.available===true?false:true;
  try{
    if(ex){
      await sbFetch(`/rest/v1/availability?id=eq.${ex.id}`,{method:'PATCH',body:JSON.stringify({available:nv})});
      ex.available=nv;
    } else {
      const r=await sbFetch('/rest/v1/availability?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({employee_id:empId,day_of_week:day,available:nv})});
      if(Array.isArray(r))availability.push(...r);
    }
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

// ── EXPORT ──
let exportMonthOffset = 0; // relative to current month

async function exportMonthReport(monthOff) {
  exportMonthOffset = monthOff;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + monthOff;
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const from = fd(first), to = fd(last);
  const mName = monthName(first.getMonth()) + ' ' + first.getFullYear();

  showToast('Pobieranie danych...');
  const mShifts = await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);

  // Build CSV
  let csv = '﻿'; // BOM for Excel
  csv += 'Pracownik;Dział;Email;Data;Dzień;Godzina start;Godzina koniec;Godziny;Stawka netto (zł/h);Koszt netto (zł);Notatka\n';

  const rows = [];
  mShifts.forEach(s => {
    const emp = employees.find(e => e.id === s.employee_id);
    if (!emp) return;
    const h = calcH(s.start_time || '10:00:00', s.end_time || '18:00:00');
    const cost = h * (emp.rate_net || 0);
    const d = new Date(s.date + 'T12:00:00');
    const dayNames = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
    rows.push({
      name: emp.name, dept: emp.department, email: emp.email || '',
      date: s.date, day: dayNames[d.getDay()],
      start: (s.start_time || '10:00:00').slice(0,5),
      end: (s.end_time || '18:00:00').slice(0,5),
      hours: h.toFixed(2), rate: (emp.rate_net || 0).toFixed(2),
      cost: cost.toFixed(2), note: s.note || ''
    });
  });

  rows.sort((a,b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date));
  rows.forEach(r => {
    csv += `${r.name};${r.dept};${r.email};${r.date};${r.day};${r.start};${r.end};${r.hours};${r.rate};${r.cost};${r.note}\n`;
  });

  // Summary per employee
  csv += '\n--- PODSUMOWANIE ---\n';
  csv += 'Pracownik;Dział;Email;Liczba zmian;Łączne godziny;Stawka zł/h;Koszt netto zł\n';
  const summary = {};
  rows.forEach(r => {
    if (!summary[r.name]) summary[r.name] = {dept:r.dept, email:r.email, shifts:0, hours:0, rate:parseFloat(r.rate), cost:0};
    summary[r.name].shifts++;
    summary[r.name].hours += parseFloat(r.hours);
    summary[r.name].cost += parseFloat(r.cost);
  });
  Object.entries(summary).forEach(([name, s]) => {
    csv += `${name};${s.dept};${s.email};${s.shifts};${s.hours.toFixed(2)};${s.rate.toFixed(2)};${s.cost.toFixed(2)}\n`;
  });
  const totalH = rows.reduce((a,r)=>a+parseFloat(r.hours),0);
  const totalC = rows.reduce((a,r)=>a+parseFloat(r.cost),0);
  csv += `RAZEM;;;${rows.length};${totalH.toFixed(2)};;${totalC.toFixed(2)}\n`;

  // Download
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `osteria-grafik-${mName.replace(' ','-')}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`Pobrano raport: ${mName}`);
}

        <div class="estat-lbl">godz. ten miesiąc</div>
      </div>
      <div class="estat">
        <div class="estat-val" style="color:var(--green)">${lastMonthShifts.length}</div>
        <div class="estat-lbl">zmian poprz. miesiąc</div>
      </div>
    </div>

    ${hasRate?`<div class="info-card" style="margin-bottom:10px">
      <div class="info-card-title">Zarobki netto</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px;color:var(--text-2)">${monthName(now.getMonth())} ${now.getFullYear()}</span>
        <span style="font-size:18px;font-weight:700;color:var(--accent)">${mC.toFixed(0)} zł</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:var(--text-3)">${monthName(new Date(now.getFullYear(),now.getMonth()-1,1).getMonth())} (poprzedni)</span>
        <span style="font-size:14px;font-weight:600;color:var(--text-3)">${lmC.toFixed(0)} zł</span>
      </div>
    </div>`:''}

    <div class="cta-card">
      <div class="cta-title">Zgłoś dyspozycyjność</div>
      <div class="cta-sub">Podaj dostępne dni na ${nextMonthName} — manager ułoży grafik na podstawie Twoich preferencji.</div>
      <button class="cta-btn" onclick="showView('avail')">Uzupełnij dyspozycyjność →</button>
    </div>

    <div class="info-card">
      <div class="info-card-title">Mój grafik — bieżący tydzień</div>`;

  if(myShifts.length===0){
    html+=`<div style="font-size:13px;color:var(--text-3);padding:8px 0">Brak zaplanowanych zmian</div>`;
  } else {
    html+=`<div class="my-shifts-list">`;
    myShifts.forEach(s=>{
      const d=new Date(s.date+'T12:00:00');
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      const dayLabel=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()];
      html+=`<div class="my-shift-row">
        <div>
          <div class="msr-date">${dayLabel} ${d.getDate()}.${pad(d.getMonth()+1)}</div>
          <div class="msr-h">${h.toFixed(1)} godz.</div>
        </div>
        <div class="msr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Upcoming shifts (this month beyond current week)
  const tod = today();
  const upcoming = thisMonthShifts.filter(s=>s.date>tod).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  if(upcoming.length>0){
    html+=`</div><div class="info-card"><div class="info-card-title">Nadchodzące zmiany</div><div class="my-shifts-list">`;
    upcoming.forEach(s=>{
      const d=new Date(s.date+'T12:00:00');
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      const dayLabel=['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()];
      html+=`<div class="my-shift-row">
        <div>
          <div class="msr-date">${dayLabel} ${d.getDate()}.${pad(d.getMonth()+1)}</div>
          <div class="msr-h">${h.toFixed(1)} godz.</div>
        </div>
        <div class="msr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div></div>`;
  mc.innerHTML=html;
}

// ── SHIFT MODAL ──
function openShiftModal(empId,empName,date,shiftId){
  const shift=shiftId?shifts.find(s=>s.id===shiftId):null;
  const emp=employees.find(e=>e.id===empId);
  currentShiftEmpId=empId; currentShiftDate=date;
  document.getElementById('sm-title').textContent=shift?'Edytuj zmianę':'Nowa zmiana';
  const d=new Date(date+'T12:00:00');
  document.getElementById('sm-sub').textContent=`${empName} · ${['Nd','Pon','Wt','Śr','Czw','Pt','Sob'][d.getDay()]} ${d.getDate()}.${pad(d.getMonth()+1)}`;
  document.getElementById('sm-shift-id').value=shiftId||'';
  document.getElementById('sm-start').value=(shift?.start_time||'10:00:00').slice(0,5);
  document.getElementById('sm-end').value=(shift?.end_time||'18:00:00').slice(0,5);
  document.getElementById('sm-note').value=shift?.note||'';
  document.getElementById('sm-delete').style.display=shift?'flex':'none';
  updateCostPreview(emp);
  document.getElementById('sm-start').oninput=()=>updateCostPreview(emp);
  document.getElementById('sm-end').oninput=()=>updateCostPreview(emp);
  openModal('shift-modal');
}

function updateCostPreview(emp){
  if(!emp||(emp.rate_net||0)<=1){document.getElementById('sm-cost-preview').style.display='none';return;}
  const h=calcH(document.getElementById('sm-start').value,document.getElementById('sm-end').value);
  document.getElementById('sm-cost-val').textContent=`${(h*(emp.rate_net||0)).toFixed(2)} zł (${h.toFixed(1)}h × ${emp.rate_net} zł/h)`;
  document.getElementById('sm-cost-preview').style.display='block';
}

async function saveShift(){
  const shiftId=document.getElementById('sm-shift-id').value;
  const p={employee_id:currentShiftEmpId,date:currentShiftDate,start_time:document.getElementById('sm-start').value+':00',end_time:document.getElementById('sm-end').value+':00',note:document.getElementById('sm-note').value};
  try{
    if(shiftId){
      await sbFetch(`/rest/v1/shifts?id=eq.${shiftId}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      const i=shifts.findIndex(s=>s.id===shiftId); if(i>=0)shifts[i]={...shifts[i],...p};
    } else {
      const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      if(Array.isArray(r))shifts.push(...r);
    }
    closeModal('shift-modal'); showToast('Zmiana zapisana'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

async function deleteShift(){
  const id=document.getElementById('sm-shift-id').value; if(!id)return;
  try{
    await sbFetch(`/rest/v1/shifts?id=eq.${id}`,{method:'DELETE'});
    shifts=shifts.filter(s=>s.id!==id); closeModal('shift-modal'); showToast('Zmiana usunięta'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});
document.getElementById('auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// Haversine — odległość w metrach między dwoma punktami GPS
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Pobranie pozycji GPS jako Promise
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('Brak GPS w tej przeglądarce'));
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  });
}

// Sprawdzenie geofence — zwraca {ok, lat, lon, dist, error}
async function checkGeofence(){
  try{
    const p=await getPosition();
    const {latitude:lat,longitude:lon}=p.coords;
    const dist=haversine(lat,lon,GEO_LAT,GEO_LON);
    return{ok:dist<=GEO_RADIUS,lat,lon,dist:Math.round(dist)};
  }catch(e){
    return{ok:false,lat:null,lon:null,dist:null,error:e.message||'Błąd GPS'};
  }
}

// Formatowanie czasu elapsed
function fmtElapsed(ms){
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  return`${pad(h)}:${pad(m%60)}:${pad(s%60)}`;
}

function fmtTime(ts){
  if(!ts) return '—';
  const d=new Date(ts);
  return`${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDate(ts){
  if(!ts) return '';
  const d=new Date(ts);
  return`${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
}

function fmtDuration(min){
  if(min==null) return '—';
  const h=Math.floor(min/60),m=min%60;
  return h>0?`${h}h ${m>0?m+'m':''}`:`${m}m`;
}

// Aktualny pracownik (zalogowany)
function getCurrentEmployee(){
  if(!currentUser) return null;
  const email=currentUser.email||currentUser.user?.email||'';
  // Dopasowanie po emailu z Supabase Auth
  let emp=employees.find(e=>e.email&&e.email.toLowerCase()===email.toLowerCase());
  if(!emp){
    // Fallback: dopasowanie po username (część emaila przed @)
    const username=email.split('@')[0].toLowerCase();
    emp=employees.find(e=>e.email&&e.email.split('@')[0].toLowerCase()===username);
  }
  if(!emp){
    // Fallback: szukaj po nazwie wyświetlanej w headerze
    const displayName=document.getElementById('hdr-user')?.textContent?.toLowerCase()||'';
    emp=employees.find(e=>e.name&&e.name.toLowerCase().includes(displayName));
  }
  return emp||null;
}

// Zatrzymanie timera
function stopClockTimer(){
  if(clockTimerInterval){clearInterval(clockTimerInterval);clockTimerInterval=null;}
}

// Render głównego widoku ewidencji
function renderClock(mc){
  stopClockTimer();
  const emp=getCurrentEmployee();
  if(!emp && !canEdit()){
    // Pracownik bez powiązanego profilu — pokaż info + debug
    const userEmail=currentUser?.email||'';
    mc.innerHTML=`<div class="clock-wrap"><div class="clock-hero" style="gap:12px;">
      <div style="font-size:32px">⚠️</div>
      <div style="font-size:14px;font-weight:600;color:var(--text)">Profil nie znaleziony</div>
      <div style="color:var(--text-3);font-size:12px;line-height:1.6;text-align:center;">
        Zalogowano jako: <strong>${userEmail}</strong><br>
        Upewnij się, że w tabeli pracowników<br>wpisano dokładnie ten adres email.
      </div>
    </div></div>`;
    return;
  }

  const isManager=canEdit();
  mc.innerHTML=buildClockHTML(emp, isManager);
  updateClockUI();
  startClockTimer();
  updateGeoIndicator();
}

function buildClockHTML(emp, isManager){
  const now=new Date();
  const dateStr=now.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});

  // Sesje historyczne (ukończone, ostatnie 7 dni)
  const myId=emp?.id;
  const mySessions=workSessions.filter(s=>s.employee_id===myId && s.clock_out);
  const recentSessions=mySessions.slice(0,5);

  // Live panel dla managera
  const liveRows=buildLivePanelRows();

  let html=`<div class="clock-wrap">`;

  // Karta z zegarem (tylko gdy jest pracownik)
  if(emp){
    html+=`
    <div class="clock-hero">
      <div class="clock-time-big" id="clock-time-now">${pad(now.getHours())}:${pad(now.getMinutes())}</div>
      <div class="clock-date">${dateStr}</div>
      <div class="clock-status-pill idle" id="clock-status-pill">Poza pracą</div>
      <div class="clock-elapsed" id="clock-elapsed" style="display:none"></div>
      <div class="clock-btn-row" id="clock-btn-row">
        <button class="clock-btn clock-btn-in" id="btn-clock-in" onclick="doClockin()">▶ Rozpocznij zmianę</button>
      </div>
      <div class="clock-geo-status" id="clock-geo-status">
        <span class="clock-geo-loading">● Sprawdzanie lokalizacji…</span>
      </div>
    </div>`;

    // Historia sesji
    if(recentSessions.length>0){
      html+=`<div class="clock-history-card">
        <div class="clock-history-title">Ostatnie zmiany</div>`;
      for(const s of recentSessions){
        const dur=s.total_minutes;
        const brk=s.break_minutes;
        html+=`<div class="clock-session-row">
          <div class="csr-date">${fmtDate(s.clock_in)}</div>
          <div class="csr-times">
            <div>${fmtTime(s.clock_in)} – ${fmtTime(s.clock_out)}</div>
            ${brk>0?`<div class="csr-break">przerwa ${fmtDuration(brk)}</div>`:''}
          </div>
          <div class="csr-dur">
            <div class="csr-dur-h">${fmtDuration(dur)}</div>
            <div class="csr-dur-min">przepracowane</div>
          </div>
        </div>`;
      }
      html+=`</div>`;
    }
  }

  // Panel managera — kto jest teraz w pracy
  if(isManager){
    const activeSessions=workSessions.filter(s=>!s.clock_out);
    html+=`<div class="clock-live-card">
      <div class="clock-live-title">
        <span>Teraz w pracy</span>
        <span style="font-size:12px;font-weight:600;color:var(--green)">${activeSessions.length} os.</span>
      </div>`;
    if(liveRows.length===0){
      html+=`<div style="padding:16px;text-align:center;font-size:12px;color:var(--text-3)">Nikt nie jest teraz zalogowany</div>`;
    } else {
      html+=liveRows.join('');
    }
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

function buildLivePanelRows(){
  const activeSessions=workSessions.filter(s=>!s.clock_out);
  const now=Date.now();
  return activeSessions.map(s=>{
    const emp=employees.find(e=>e.id===s.employee_id);
    const name=emp?.name||s.employees?.name||'—';
    const dept=emp?.department||s.employees?.department||'';
    const onBreak=s.break_start&&!s.break_end;
    const elapsed=Math.max(0,now-new Date(s.clock_in).getTime());
    const elStr=fmtElapsed(elapsed);
    const badgeClass=onBreak?'clr-badge-break':'clr-badge-in';
    const badgeText=onBreak?'Przerwa':'W pracy';
    return`<div class="clock-live-row">
      <div>
        <div class="clr-name">${name}</div>
        <div class="clr-dept">${dept}</div>
      </div>
      <div class="clr-badge ${badgeClass}">${badgeText}</div>
      <div class="clr-time">${elStr}</div>
    </div>`;
  });
}

// Uruchomienie timera odświeżającego clock UI
function startClockTimer(){
  clockTimerInterval=setInterval(()=>{
    const tn=document.getElementById('clock-time-now');
    if(tn){const n=new Date();tn.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
    updateElapsed();
  },1000);
}

function updateElapsed(){
  if(!activeSession) return;
  const el=document.getElementById('clock-elapsed');
  if(!el) return;
  const onBreak=activeSession.break_start&&!activeSession.break_end;
  const start=onBreak?new Date(activeSession.break_start):new Date(activeSession.clock_in);
  const elapsed=Date.now()-start.getTime();
  el.textContent=(onBreak?'Przerwa: ':'Czas pracy: ')+fmtElapsed(elapsed);
}

function updateClockUI(){
  const pill=document.getElementById('clock-status-pill');
  const elDiv=document.getElementById('clock-elapsed');
  const btnRow=document.getElementById('clock-btn-row');
  if(!pill||!btnRow) return;

  if(!activeSession){
    pill.className='clock-status-pill idle'; pill.textContent='Poza pracą';
    if(elDiv){elDiv.style.display='none';}
    btnRow.innerHTML=`<button class="clock-btn clock-btn-in" id="btn-clock-in" onclick="doClockin()">▶ Rozpocznij zmianę</button>`;
  } else if(activeSession.break_start && !activeSession.break_end){
    pill.className='clock-status-pill break'; pill.textContent='Przerwa';
    if(elDiv){elDiv.style.display='block'; updateElapsed();}
    btnRow.innerHTML=`
      <button class="clock-btn clock-btn-in" onclick="doEndBreak()" style="flex:1">▶ Zakończ przerwę</button>
      <button class="clock-btn clock-btn-out" onclick="doClockout()" style="flex:1">■ Zakończ zmianę</button>`;
  } else {
    pill.className='clock-status-pill working'; pill.textContent='W pracy';
    if(elDiv){elDiv.style.display='block'; updateElapsed();}
    btnRow.innerHTML=`
      <button class="clock-btn clock-btn-break" onclick="doStartBreak()">⏸ Przerwa</button>
      <button class="clock-btn clock-btn-out" onclick="doClockout()" style="flex:1">■ Zakończ zmianę</button>`;
  }
}

// Aktualizacja wskaźnika GPS
async function updateGeoIndicator(){
  const geo=document.getElementById('clock-geo-status');
  if(!geo) return;
  const result=await checkGeofence();
  if(!geo.isConnected) return; // widok mógł się zmienić
  if(result.error){
    geo.innerHTML=`<span class="clock-geo-err">● ${result.error}</span>`;
  } else if(result.ok){
    geo.innerHTML=`<span class="clock-geo-ok">● Jesteś w restauracji (${result.dist}m)</span>`;
  } else {
    geo.innerHTML=`<span class="clock-geo-err">● Poza restauracją (${result.dist}m, wymagane <${GEO_RADIUS}m)</span>`;
  }
}

// CLOCK IN
async function doClockin(){
  const emp=getCurrentEmployee();
  if(!emp){showToast('Brak profilu pracownika');return;}
  const btn=document.getElementById('btn-clock-in');
  if(btn){btn.disabled=true;btn.textContent='Sprawdzanie GPS…';}

  const geo=await checkGeofence();
  if(!geo.ok){
    if(btn){btn.disabled=false;btn.textContent='▶ Rozpocznij zmianę';}
    const msg=geo.error?`Błąd GPS: ${geo.error}`:`Jesteś za daleko od restauracji (${geo.dist}m). Wymagane: <${GEO_RADIUS}m.`;
    showToast(msg);
    return;
  }

  try{
    if(btn){btn.textContent='Zapisywanie…';}
    const sess=await sbFetch('/rest/v1/work_sessions',{
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({
        employee_id:emp.id,
        clock_in:new Date().toISOString(),
        geo_lat_in:geo.lat,
        geo_lon_in:geo.lon
      })
    });
    activeSession=Array.isArray(sess)?sess[0]:sess;
    workSessions.unshift(activeSession);
    showToast('Zmiana rozpoczęta ✓');
    updateClockUI();
  }catch(e){
    showToast('Błąd: '+e.message.slice(0,60));
    if(btn){btn.disabled=false;btn.textContent='▶ Rozpocznij zmianę';}
  }
}

// CLOCK OUT
async function doClockout(){
  if(!activeSession){return;}
  const geo=await checkGeofence();
  // GPS przy wylogowaniu jest opcjonalne — zapisujemy współrzędne jeśli dostępne
  try{
    const body={clock_out:new Date().toISOString()};
    if(geo.lat) {body.geo_lat_out=geo.lat; body.geo_lon_out=geo.lon;}
    const updated=await sbFetch(`/rest/v1/work_sessions?id=eq.${activeSession.id}`,{
      method:'PATCH',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify(body)
    });
    const upd=Array.isArray(updated)?updated[0]:updated;
    workSessions=workSessions.map(s=>s.id===activeSession.id?{...s,...upd}:s);
    activeSession=null;
    showToast('Zmiana zakończona ✓');
    // Przeładuj sesje żeby mieć computed columns
    await loadWorkSessions();
    renderView();
  }catch(e){
    showToast('Błąd: '+e.message.slice(0,60));
  }
}

// START BREAK
async function doStartBreak(){
  if(!activeSession||activeSession.break_start) return;
  try{
    const updated=await sbFetch(`/rest/v1/work_sessions?id=eq.${activeSession.id}`,{
      method:'PATCH',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({break_start:new Date().toISOString()})
    });
    const upd=Array.isArray(updated)?updated[0]:updated;
    activeSession={...activeSession,...upd};
    workSessions=workSessions.map(s=>s.id===activeSession.id?activeSession:s);
    showToast('Przerwa rozpoczęta');
    updateClockUI();
  }catch(e){
    showToast('Błąd: '+e.message.slice(0,60));
  }
}

// END BREAK
async function doEndBreak(){
  if(!activeSession||!activeSession.break_start||activeSession.break_end) return;
  try{
    const updated=await sbFetch(`/rest/v1/work_sessions?id=eq.${activeSession.id}`,{
      method:'PATCH',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({break_end:new Date().toISOString()})
    });
    const upd=Array.isArray(updated)?updated[0]:updated;
    activeSession={...activeSession,...upd};
    workSessions=workSessions.map(s=>s.id===activeSession.id?activeSession:s);
    showToast('Przerwa zakończona');
    updateClockUI();
  }catch(e){
    showToast('Błąd: '+e.message.slice(0,60));
  }
}
