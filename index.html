<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Osteria Antonina</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7B1D2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osteria">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #7B1D2E;
  --brand-dark: #5C1420;
  --brand-light: #9B2D42;
  --brand-soft: #F9F0F2;
  --brand-mid: #EDD5DA;
  --accent: #7B1D2E;
  --accent-hover: #5C1420;
  --accent-soft: #F9F0F2;
  --bg: #FAFAFA;
  --surface: #ffffff;
  --border: #E4E4E7;
  --border-2: #D4D4D8;
  --text: #1A0A0D;
  --text-2: #5C3540;
  --text-3: #A1727E;
  --danger: #DC2626;
  --danger-bg: #FEF2F2;
  --warn: #D97706;
  --green: #16A34A;
  --green-bg: #F0FDF4;
  --red-soft: #FEF2F2;
  --radius: 6px;
  --radius-lg: 8px;
  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 4px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* ─── Auth — jasny premium ─── */
#auth-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  background: #F4F0EE; padding: 0; position: relative; overflow: hidden;
}
.auth-bg-gradient {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 100% 55% at 50% -5%, rgba(123,29,46,.07) 0%, transparent 65%),
    radial-gradient(ellipse 60% 35% at 85% 15%, rgba(123,29,46,.04) 0%, transparent 60%);
}
.auth-top {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 24px 40px; width: 100%; position: relative; z-index: 2;
}
/* Logo — subtelny monogram na jasnym tle */
.auth-logo-wrap {
  width: 80px; height: 80px; border-radius: 50%;
  border: 1.5px solid rgba(123,29,46,.18);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 28px;
  background: white;
  box-shadow: 0 2px 20px rgba(123,29,46,.1), 0 1px 4px rgba(0,0,0,.06);
  position: relative;
}
.auth-logo-wrap::before {
  content: ''; position: absolute; inset: 7px; border-radius: 50%;
  border: 1px solid rgba(123,29,46,.08);
}
.auth-logo-monogram {
  font-size: 26px; font-weight: 700; color: #7B1D2E; letter-spacing: -1px; line-height: 1;
}
.auth-logo-wrap img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
}
.auth-divider {
  display: flex; align-items: center; gap: 10px; width: 120px; margin: 0 auto 20px;
}
.auth-divider-line { flex: 1; height: 1px; background: rgba(123,29,46,.12); }
.auth-divider-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(123,29,46,.2); }
.auth-app-name {
  font-size: 10px; font-weight: 600; letter-spacing: 2.5px; color: #B89898;
  text-align: center; text-transform: uppercase; margin-bottom: 10px;
}
.auth-restaurant-name {
  font-size: 28px; font-weight: 700; letter-spacing: -1px; color: #1A0A0D; text-align: center;
  line-height: 1.05; margin-bottom: 4px;
}
.auth-tagline { font-size: 12px; color: #B89898; text-align: center; letter-spacing: .2px; margin-top: 8px; }

.auth-sheet {
  background: white; width: 100%; border-radius: 24px 24px 0 0;
  padding: 28px 24px calc(env(safe-area-inset-bottom) + 28px);
  box-shadow: 0 -1px 0 rgba(123,29,46,.08), 0 -12px 40px rgba(0,0,0,.06);
  position: relative; z-index: 2;
}
.auth-sheet-handle {
  width: 32px; height: 3px; background: #E0D4D4; border-radius: 2px;
  margin: 0 auto 26px;
}
.auth-sheet-title { font-size: 19px; font-weight: 700; letter-spacing: -.4px; margin-bottom: 4px; color: #1A0A0D; }
.auth-sheet-sub { font-size: 13px; color: #B89898; margin-bottom: 22px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 500; color: #9B8585; margin-bottom: 6px; letter-spacing: .2px; }
.field input {
  width: 100%; padding: 13px 16px; border: 1.5px solid #EAE0E0; border-radius: 12px;
  font-size: 15px; font-family: var(--font); outline: none; color: #1A0A0D;
  transition: all .18s; background: #F9F6F6;
}
.field input:focus { border-color: #7B1D2E; background: white; box-shadow: 0 0 0 3px rgba(123,29,46,.07); }
.btn-login {
  width: 100%; padding: 15px; background: #7B1D2E; color: white; border: none;
  border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px;
  font-family: var(--font); letter-spacing: -.1px; transition: all .18s;
  box-shadow: 0 4px 16px rgba(123,29,46,.28);
}
.btn-login:active { transform: scale(.98); box-shadow: 0 2px 6px rgba(123,29,46,.2); }
.auth-err { color: var(--danger); font-size: 12px; margin-top: 10px; text-align: center; display: none; padding: 10px; background: var(--danger-bg); border-radius: 10px; }

/* ─── App shell ─── */
#app { display: none; }
.header {
  background: white; color: var(--text); height: 56px; padding: 0 16px;
  display: flex; align-items: center; position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid var(--border); gap: 10px;
  transition: background .2s, border-color .2s;
}
/* Na home — jasny header */
body.view-home .header {
  background: #F7F5F5;
  border-bottom-color: #EAE0E0;
}
body.view-home #main-content { background: #F7F5F5; }

.header-brand { font-size: 15px; font-weight: 800; flex: 1; letter-spacing: -.5px; color: var(--text); display: flex; align-items: center; gap: 6px; transition: color .2s; }
.header-brand em { color: var(--text-3); font-style: normal; font-weight: 400; transition: color .2s; }
.header-brand-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
.header-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--brand);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white; letter-spacing: -.3px; cursor: pointer;
  flex-shrink: 0; border: 2px solid var(--brand-mid); transition: border-color .2s;
}
.role-badge {
  font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  background: var(--accent-soft); color: var(--text-2); letter-spacing: .1px; border: 1px solid var(--border);
  transition: background .2s, color .2s, border-color .2s;
}
.header-name { font-size: 12px; color: var(--text-3); display: none; }
.btn-out {
  font-size: 11px; color: var(--text-3); background: none; border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 20px; cursor: pointer; font-family: var(--font);
  transition: all .12s; font-weight: 500;
}
.btn-out:hover { color: var(--text-2); border-color: var(--border-2); }

/* ─── Bottom nav — app style ─── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; background: white;
  border-top: 1px solid var(--border); display: flex; z-index: 100;
  padding-bottom: max(env(safe-area-inset-bottom), 12px);
  padding-top: 10px;
  height: calc(62px + max(env(safe-area-inset-bottom), 12px));
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  gap: 3px; cursor: pointer; color: var(--text-3); font-size: 10px; font-weight: 500;
  border: none; background: none; font-family: var(--font); transition: color .25s cubic-bezier(.4,0,.2,1); position: relative;
  padding: 0 4px;
}
.bnav-item.active { color: var(--brand); }
.bnav-item.active .bnav-icon-wrap { background: var(--brand-soft); }
.bnav-item.active svg { stroke: var(--brand); }
.bnav-icon-wrap {
  width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 14px; transition: background .25s cubic-bezier(.4,0,.2,1);
}
.bnav-item svg { width: 22px; height: 22px; stroke: var(--text-3); fill: none; stroke-width: 1.8; transition: stroke .25s cubic-bezier(.4,0,.2,1); }

.main { padding-bottom: calc(62px + max(env(safe-area-inset-bottom), 12px) + 8px); }
.main.no-bnav { padding-bottom: 0; }
.main.view-transition { animation: viewFadeIn .28s cubic-bezier(.4,0,.2,1); }
@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ════════════════════════════════════════
   HOME SCREEN
════════════════════════════════════════ */
.hw-wrap {
  min-height: 100vh;
  background: #F7F5F5;
  display: flex; flex-direction: column;
  padding-bottom: max(env(safe-area-inset-bottom), 100px);
  -webkit-tap-highlight-color: transparent;
}

/* Powitanie z animacją */
.hw-header {
  padding: 36px 22px 20px;
}
.hw-greeting-line {
  overflow: hidden; height: 32px;
}
.hw-greeting-text {
  font-size: 24px; font-weight: 400; color: #9B8585;
  letter-spacing: -.3px; line-height: 32px;
  transform: translateY(32px);
  animation: slideUp .45s cubic-bezier(.4,0,.2,1) .05s forwards;
}
.hw-name-line {
  overflow: hidden; height: 46px; margin-top: 0;
}
.hw-name-text {
  font-size: 40px; font-weight: 600; color: #1A0A0D;
  letter-spacing: -1.5px; line-height: 46px;
  transform: translateY(46px);
  animation: slideUp .45s cubic-bezier(.4,0,.2,1) .15s forwards;
}
@keyframes slideUp {
  to { transform: translateY(0); }
}

/* Blok Zacznij pracę */
.hw-clock-block {
  margin: 0 14px 8px;
  position: relative; overflow: hidden;
  border-radius: 18px;
  background: #7B1D2E;
  padding: 24px 22px 68px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s cubic-bezier(.4,0,.2,1), opacity .12s;
  will-change: transform;
  opacity: 0;
  animation: fadeInUp .4s cubic-bezier(.4,0,.2,1) .38s forwards;
}
.hw-clock-block:active { transform: scale(.975); opacity: .9; }
.hw-clock-block.working { background: #0E2E14; }
.hw-clock-block.working:active { background: #0A2410; }

.hw-clock-eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,.4);
  margin-bottom: 10px;
}
.hw-clock-title {
  font-size: 40px; font-weight: 900; color: #fff;
  letter-spacing: -2px; line-height: .95;
}
.hw-clock-sub {
  position: absolute; bottom: 22px; left: 22px; right: 60px;
  font-size: 12px; color: rgba(255,255,255,.38); font-weight: 400; line-height: 1.4;
}
.hw-clock-sub strong { color: rgba(255,255,255,.65); font-weight: 600; }
.hw-clock-caret {
  position: absolute; right: 20px; bottom: 20px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: rgba(255,255,255,.7);
}
.hw-clock-pulse {
  position: absolute; top: 22px; right: 22px;
  width: 10px; height: 10px;
}
.hw-clock-pulse::before, .hw-clock-pulse::after {
  content:''; position:absolute; inset:0; border-radius:50%;
}
.hw-clock-pulse::before { background:#4ADE80; }
.hw-clock-pulse::after {
  background:rgba(74,222,128,.35);
  animation: pulse-ring 2s ease-out infinite;
}
@keyframes pulse-ring {
  0% { transform:scale(1); opacity:.8; }
  100% { transform:scale(4.5); opacity:0; }
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── Bloki — płaskie bańki ── */
.hw-blocks {
  padding: 0 16px;
  display: flex; flex-direction: column;
  gap: 10px;
}

/* Każda "bańka" — płaski pill */
.hb-row {
  position: relative; overflow: hidden;
  border-radius: 100px;
  height: 68px;
  cursor: pointer;
  display: flex; align-items: center;
  justify-content: center;
  padding: 0 32px;
  background: #fff;
  border: 1.5px solid #EAE0E0;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s cubic-bezier(.34,1.56,.64,1), background .12s;
  will-change: transform;
  opacity: 0;
  animation: pillIn .4s cubic-bezier(.34,1.4,.64,1) forwards;
}
.hw-blocks .hb-row:nth-child(1) { animation-delay: .42s; }
.hw-blocks .hb-row:nth-child(2) { animation-delay: .50s; }
.hw-blocks .hb-row:nth-child(3) { animation-delay: .58s; }
.hw-blocks .hb-row:nth-child(4) { animation-delay: .66s; }
.hw-blocks .hb-row:nth-child(5) { animation-delay: .74s; }
.hw-blocks .hb-row:nth-child(6) { animation-delay: .82s; }
.hw-blocks .hb-row:nth-child(7) { animation-delay: .90s; }
.hw-blocks .hb-row:nth-child(8) { animation-delay: .98s; }
@keyframes pillIn {
  from { opacity:0; transform: scale(.85); }
  to   { opacity:1; transform: scale(1); }
}

.hb-row:active {
  transform: scale(.96);
  background: #F5EDEE;
  border-color: #D9C4C6;
}

.hb-row-left { z-index: 1; text-align: center; }
.hb-row-label {
  font-size: 10px; font-weight: 500; color: #B89898;
  letter-spacing: .3px; margin-bottom: 1px;
}
.hb-row-title {
  font-size: 19px; font-weight: 600; color: #1A0A0D;
  letter-spacing: -.4px; line-height: 1.1;
}
.hb-row-arrow { display: none; }

/* Badge */
.hb-badge {
  position: absolute; top: 50%; right: 24px; margin-top: -10px; z-index: 3;
  background: #7B1D2E; color: white; font-size: 10px; font-weight: 700;
  min-width: 20px; height: 20px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; padding: 0 5px;
}

/* Ripple */
.hb-ripple-wrap {
  position: absolute; inset: 0; border-radius: inherit;
  overflow: hidden; pointer-events: none; z-index: 10;
}
.hb-ripple {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%) scale(0);
  width: 300%; padding-bottom: 300%;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  animation: ripple-anim .45s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes ripple-anim {
  to { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}

/* ── Chat FAB — zawsze widoczny ── */
.chat-fab {
  position: fixed; right: 18px; z-index: 200;
  bottom: calc(max(env(safe-area-inset-bottom), 12px) + 70px);
  width: 54px; height: 54px; border-radius: 50%;
  background: #7B1D2E;
  box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; outline: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s cubic-bezier(.4,0,.2,1), box-shadow .15s;
  will-change: transform;
}
.chat-fab:active { transform: scale(.9); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.chat-fab svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.8; }
.chat-fab-badge {
  position: absolute; top: -2px; right: -2px;
  min-width: 18px; height: 18px; border-radius: 9px;
  background: #EF4444; color: white; font-size: 10px; font-weight: 700;
  display: none; align-items: center; justify-content: center; padding: 0 4px;
  border: 2px solid #0F0A0B;
}
.chat-fab-badge.visible { display: flex; }
/* Na jasnym tle (inne widoki) FAB też działa, bo position:fixed */
body:not(.view-home) .chat-fab {
  bottom: calc(max(env(safe-area-inset-bottom), 12px) + 70px);
}

/* Back button w sekcjach */
.section-back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; font-family: var(--font); font-size: 14px; font-weight: 600;
  color: var(--brand); cursor: pointer; padding: 0; letter-spacing: -.2px;
}
.section-back-btn svg { width: 18px; height: 18px; stroke: var(--brand); fill: none; stroke-width: 2; }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
.home-tile { position: relative; }
.home-tile-badge {
  position: absolute; top: 12px; right: 12px;
  background: var(--brand); color: white; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
}

/* ─── Page header bar ─── */
.page-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.page-bar-title { font-size: 15px; font-weight: 700; flex: 1; min-width: 120px; letter-spacing: -.3px; }
.view-toggle {
  display: flex; background: var(--bg); border-radius: var(--radius); padding: 2px; gap: 1px;
  border: 1px solid var(--border);
}
.vt-btn {
  padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; font-family: var(--font); color: var(--text-3);
  transition: all .12s;
}
.vt-btn.active { background: white; color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

/* ─── Week nav ─── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 0; gap: 8px;
}
.wn-btn {
  width: 30px; height: 30px; border: 1px solid var(--border); background: white;
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); font-size: 15px; transition: all .12s;
  flex-shrink: 0;
}
.wn-btn:hover { border-color: var(--border-2); color: var(--text); }
.wn-label { text-align: center; flex: 1; }
.wn-range { font-size: 14px; font-weight: 700; letter-spacing: -.3px; }
.wn-week { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.today-link { color: var(--text-2); cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--border-2); }

/* ─── Dept tabs ─── */
.dept-row {
  display: flex; gap: 4px; padding: 10px 16px 0; overflow-x: auto;
  scrollbar-width: none;
}
.dept-row::-webkit-scrollbar { display: none; }
.dtab {
  padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1px solid var(--border); background: white;
  color: var(--text-2); cursor: pointer; transition: all .12s; font-family: var(--font);
}
.dtab.active { background: var(--text); color: white; border-color: var(--text); }
.dtab:hover:not(.active) { border-color: var(--border-2); color: var(--text); }

/* ─── Cost strip ─── */
.cost-strip {
  margin: 10px 16px 0; background: var(--accent-soft);
  border-radius: var(--radius-lg); padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border);
}
.cs-label { font-size: 10px; color: var(--text-3); font-weight: 500; letter-spacing: .2px; margin-bottom: 2px; }
.cs-val { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.5px; }

/* ─── Schedule table ─── */
.sched-wrap { padding: 10px 16px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sched-tbl {
  width: 100%; border-collapse: collapse; min-width: 480px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border);
}
.sched-tbl thead th {
  background: var(--bg); color: var(--text-3); font-size: 10px; font-weight: 600;
  padding: 9px 6px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border); text-transform: uppercase;
}
.sched-tbl thead th.th-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.sched-tbl thead th.th-day { min-width: 64px; }
.sched-tbl thead th.th-day .dn { font-size: 16px; font-weight: 700; color: var(--text); display: block; margin-top: 1px; letter-spacing: -.3px; text-transform: none; }
.sched-tbl thead th.th-day.today { background: var(--text); color: white; }
.sched-tbl thead th.th-day.today .dn { color: white; }
.sched-tbl thead th.th-day.weekend { background: var(--red-soft); color: var(--danger); }
.sched-tbl thead th.th-day.weekend .dn { color: var(--danger); }
.td-day-cell.weekend { background: #FFFCFC; }
.td-day-cell.weekend:hover { background: var(--red-soft); }
.td-day-cell.weekend .shift-chip { background: var(--danger); box-shadow: none; }
.td-day-cell.weekend .shift-cost-lbl { color: var(--danger); }
.sched-tbl thead th.th-sum { min-width: 70px; text-align: right; padding-right: 14px; }
.sched-tbl tbody tr { border-top: 1px solid var(--border); }
.sched-tbl tbody tr:hover { background: var(--bg); }
.sched-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.sched-tbl tbody td:last-child { border-right: none; }

.td-emp-cell { display: flex; align-items: center; gap: 9px; padding: 9px 14px; min-height: 52px; }
.av {
  width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
}
.td-emp-name { font-size: 13px; font-weight: 600; }
.td-emp-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.dept-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

.td-day-cell {
  text-align: center; cursor: pointer; padding: 7px 3px; min-height: 52px;
  vertical-align: middle; transition: background .1s;
}
.td-day-cell:hover { background: var(--bg); }
.td-day-cell.is-today { background: rgba(0,0,0,.025); }
.shift-chip {
  display: inline-flex; align-items: center; background: var(--text); color: white;
  font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
  white-space: nowrap; letter-spacing: -.1px; gap: 2px;
}
.shift-cost-lbl { font-size: 9px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
.cell-add { font-size: 16px; color: var(--border-2); font-weight: 300; line-height: 1; }
.td-day-cell:hover .cell-add { color: var(--text-3); }
.td-day-cell.unavail { background: var(--red-soft); }
.cell-unavail { font-size: 11px; color: #FCA5A5; font-weight: 600; }

/* ─── Auto-fill button ─── */
.autofill-btn {
  display: flex; align-items: center; gap: 8px; margin: 10px 16px 0;
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; cursor: pointer; font-family: var(--font); font-size: 12px;
  color: var(--text-2); font-weight: 500; width: calc(100% - 32px); transition: all .12s;
}
.autofill-btn:hover { border-color: var(--border-2); color: var(--text); background: var(--bg); }
.autofill-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.autofill-btn strong { font-weight: 700; color: var(--text); }

/* ─── Avail header ─── */
.avail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; border-bottom: 1px solid var(--border);
}
.avail-header-title { font-size: 16px; font-weight: 700; letter-spacing: -.4px; }
.avail-header-month { font-size: 13px; color: var(--text-3); margin-top: 1px; }
.avail-nav { display: flex; gap: 4px; }
.avail-nav button {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
  background: white; color: var(--text-2); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .1s;
}
.avail-nav button:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Employee avail form ─── */
.avail-intro {
  padding: 16px 20px 8px; font-size: 13px; color: var(--text-2); line-height: 1.6;
  border-bottom: 1px solid var(--border);
}
.avail-intro strong { color: var(--text); font-weight: 600; }
.avail-status-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;
  background: #F0FDF4; border-bottom: 1px solid #BBF7D0;
  font-size: 12px; color: #166534; font-weight: 500;
}
.avail-status-bar.empty { background: #F8FAFC; border-color: var(--border); color: var(--text-3); }
.avail-days-list { padding: 0 20px 100px; }
.avail-week-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-3); padding: 14px 0 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}
.avail-day-row {
  display: flex; align-items: center; padding: 11px 0;
  border-bottom: 1px solid var(--border); gap: 12px; cursor: pointer;
}
.avail-day-row:last-child { border-bottom: none; }
.avail-day-row.past { opacity: .35; cursor: default; }
.avail-day-row.blocked { opacity: .5; cursor: not-allowed; }
.avail-day-num {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0;
  background: var(--bg); color: var(--text);
}
.avail-day-row.unavail .avail-day-num { background: #FEE2E2; color: #991B1B; }
.avail-day-row.blocked .avail-day-num { background: #F1F5F9; color: #94A3B8; }
.avail-day-info { flex: 1; }
.avail-day-name { font-size: 13px; font-weight: 600; color: var(--text); }
.avail-day-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.avail-day-row.unavail .avail-day-name { color: #991B1B; }
.avail-toggle {
  width: 44px; height: 24px; border-radius: 12px; background: #E2E8F0;
  position: relative; transition: background .15s; flex-shrink: 0;
}
.avail-toggle::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  background: white; top: 3px; left: 3px; transition: transform .15s;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.avail-day-row.unavail .avail-toggle { background: #EF4444; }
.avail-day-row.unavail .avail-toggle::after { transform: translateX(20px); }
.avail-blocked-badge {
  font-size: 10px; font-weight: 600; color: #94A3B8; padding: 3px 8px;
  border: 1px solid #E2E8F0; border-radius: 4px; white-space: nowrap;
}
.avail-save-bar {
  position: fixed; bottom: 60px; left: 0; right: 0; padding: 12px 20px;
  background: white; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; z-index: 50;
}
.avail-save-btn {
  flex: 1; padding: 13px; background: var(--accent); color: white;
  border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
  font-family: var(--font); cursor: pointer; transition: background .12s;
}
.avail-save-btn:hover { background: var(--accent-hover); }
.avail-save-btn:disabled { background: var(--border); color: var(--text-3); cursor: default; }
.avail-clear-btn {
  padding: 13px 16px; background: none; color: var(--text-3); border: 1px solid var(--border);
  border-radius: 8px; font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer;
}

/* ─── Manager overview ─── */
.avail-manager-wrap { padding: 0 16px 20px; }
.avail-overview-title { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); padding: 14px 0 8px; }
.avail-emp-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.avail-emp-row:last-child { border-bottom: none; }
.avail-emp-name { font-size: 13px; font-weight: 600; flex: 1; }
.avail-emp-dept { font-size: 11px; color: var(--text-3); }
.avail-emp-badges { display: flex; gap: 4px; align-items: center; }
.abadge {
  font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px;
  white-space: nowrap;
}
.abadge-yes { background: var(--green-bg); color: var(--green); }
.abadge-no { background: var(--red-soft); color: var(--danger); }
.abadge-none { background: var(--bg); color: var(--text-3); border: 1px solid var(--border); }

/* ─── Blocked panel manager ─── */
.blocked-section { padding: 0 16px 14px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.blocked-section-title { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); padding: 14px 0 8px; }
.blocked-days-row { display: flex; flex-wrap: wrap; gap: 4px; }
.bday {
  width: 34px; height: 32px; border-radius: var(--radius); border: 1px solid var(--border);
  background: white; font-size: 12px; font-weight: 500; color: var(--text-2);
  cursor: pointer; transition: all .1s; display: flex; align-items: center; justify-content: center;
}
.bday:hover { border-color: var(--border-2); color: var(--text); }
.bday.bday-on { background: var(--text); color: white; border-color: var(--text); font-weight: 600; }

/* ─── Avail legend ─── */
.avail-legend { display: flex; gap: 14px; padding: 8px 20px 10px; align-items: center; font-size: 11px; color: var(--text-3); font-weight: 500; border-bottom: 1px solid var(--border); }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }

/* legacy adc — kept for manager calendar view */
.avail-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.avail-cal-head { text-align: center; font-size: 9px; font-weight: 600; color: var(--text-3); padding: 3px 0; }
.adc {
  text-align: center; padding: 5px 2px; border-radius: 4px; cursor: pointer;
  font-size: 11px; font-weight: 500; color: var(--text-2); transition: all .1s; min-height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.adc.avail-yes { background: #F0FDF4; color: #166534; font-weight: 700; }
.adc.avail-no { background: #FEF2F2; color: #991B1B; font-weight: 700; }
.adc.adc-empty { cursor: default; }
.adc.adc-past { color: var(--border); cursor: default; }
.adc.adc-blocked { background: #F1F5F9; color: #CBD5E1; cursor: not-allowed; }
.avail-date-card { padding: 12px 0; border-bottom: 1px solid var(--border); }
.avail-date-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.avail-date-name { font-size: 13px; font-weight: 600; flex:1; }
.avail-date-stats { font-size: 11px; color: var(--text-3); font-weight: 500; display: flex; gap: 6px; }

/* ─── Add emp button ─── */
.add-emp-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 0 16px 14px; padding: 10px; background: white; border: 1px dashed var(--border-2);
  border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-3); font-family: var(--font); transition: all .12s;
}
.add-emp-btn:hover { border-color: var(--border-2); color: var(--text-2); }

.td-sum-cell { text-align: right; padding: 9px 14px; white-space: nowrap; }
.sum-h { font-size: 13px; font-weight: 700; }
.sum-cost { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }

/* ─── Month table ─── */
.month-wrap { padding: 10px 16px 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.month-tbl {
  width: 100%; border-collapse: collapse; min-width: 520px;
  background: white; border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--border);
}
.month-tbl thead th {
  background: var(--bg); color: var(--text-3); font-size: 9px; font-weight: 600;
  padding: 8px 3px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid var(--border); text-transform: uppercase;
}
.month-tbl thead th.mth-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.month-tbl thead th.mth-day { min-width: 28px; }
.month-tbl thead th.mth-day .mdn { font-size: 12px; font-weight: 700; color: var(--text); display: block; margin-top: 1px; letter-spacing: -.2px; text-transform: none; }
.month-tbl thead th.mth-day.mtoday { background: var(--text); color: white; }
.month-tbl thead th.mth-day.mtoday .mdn { color: white; }
.month-tbl tbody tr { border-top: 1px solid var(--border); }
.month-tbl tbody tr:hover { background: var(--bg); }
.month-tbl tbody td { border-right: 1px solid var(--border); padding: 0; }
.month-tbl tbody td:last-child { border-right: none; }
.mtd-emp { display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 44px; }
.mtd-day {
  text-align: center; cursor: pointer; padding: 5px 2px; min-height: 44px;
  vertical-align: middle; transition: background .1s; font-size: 9px;
}
.mtd-day:hover { background: var(--bg); }
.mtd-day.mtoday-cell { background: rgba(0,0,0,.03); }
.mtd-day.mweekend { background: #FFFCFC; }
.month-tbl thead th.mth-day.mweekend-h { background: var(--red-soft); color: var(--danger); }
.month-tbl thead th.mth-day.mweekend-h .mdn { color: var(--danger); }
.mtd-day.mweekend .mchip { background: var(--danger); }
.mchip { display: inline-block; background: var(--text); color: white; font-size: 8px; font-weight: 600; padding: 2px 4px; border-radius: 3px; white-space: nowrap; }

/* ─── Employees list ─── */
.emp-list { padding: 8px 16px; display: flex; flex-direction: column; }
.emp-row {
  background: white; border-bottom: 1px solid var(--border);
  padding: 12px 0; display: flex; align-items: center; gap: 10px;
  transition: background .1s;
}
.emp-row:last-child { border-bottom: none; }
.emp-row:hover { background: var(--bg); }
.emp-row-info { flex: 1; }
.emp-row-name { font-size: 13px; font-weight: 600; }
.emp-row-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.emp-row-stat { font-size: 11px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
.emp-rate { text-align: right; }
.emp-rate-val { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
.emp-rate-lbl { font-size: 10px; color: var(--text-3); }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--radius); background: none; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  color: var(--text-3); transition: all .12s;
}
.icon-btn:hover { border-color: var(--border-2); color: var(--text-2); }

/* ─── Availability ─── */
.bday-we { color: var(--accent); }
.bday-we.bday-on { background: #1E293B; color: white; }
.avail-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border); padding: 14px 16px; }
.avail-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }
.avail-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.aday {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .1s;
}
.aday-label { font-size: 9px; font-weight: 500; color: var(--text-3); }
.aday-circle {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .12s;
}
.aday.yes .aday-circle { border-color: var(--green); background: var(--green); color: white; }
.aday.no .aday-circle { border-color: var(--danger); background: var(--danger); color: white; }
.aday.yes { background: var(--green-bg); }
.aday.no { background: var(--danger-bg); }

/* ─── Dashboard ─── */
.dash-wrap { padding: 12px 16px; }
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-box {
  background: white; border-radius: var(--radius-lg); border: 1px solid var(--border);
  padding: 14px 14px 12px;
}
.stat-box.accent { background: var(--text); border-color: var(--text); }
.stat-box-label { font-size: 10px; color: var(--text-3); font-weight: 500; margin-bottom: 5px; letter-spacing: .2px; text-transform: uppercase; }
.stat-box.accent .stat-box-label { color: rgba(255,255,255,.5); }
.stat-box-val { font-size: 22px; font-weight: 700; letter-spacing: -.6px; }
.stat-box.accent .stat-box-val { color: white; }
.stat-box-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.stat-box.accent .stat-box-sub { color: rgba(255,255,255,.4); }
.dash-section-title { font-size: 10px; font-weight: 600; color: var(--text-3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.dash-emp-rows { display: flex; flex-direction: column; }
.dash-emp-row {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 0; display: flex; align-items: center; gap: 10px;
}
.dash-emp-row:last-child { border-bottom: none; }
.der-info { flex: 1; }
.der-name { font-size: 13px; font-weight: 600; }
.der-meta { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.der-right { text-align: right; }
.der-rate { font-size: 13px; font-weight: 700; }
.der-cost { font-size: 11px; color: var(--text-2); font-weight: 500; }

/* ─── Employee dashboard ─── */
.emp-dash { padding: 12px 16px; }
.cta-card {
  background: var(--text);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 10px; color: white;
}
.cta-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; letter-spacing: -.3px; }
.cta-sub { font-size: 12px; opacity: .6; }
.cta-btn {
  display: inline-block; margin-top: 12px; background: white; color: var(--text);
  border: none; border-radius: var(--radius); padding: 7px 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: var(--font);
}
.info-card {
  background: white; border-radius: var(--radius-lg); border: 1px solid var(--border);
  padding: 12px 14px; margin-bottom: 8px;
}
.info-card-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.my-shifts-list { display: flex; flex-direction: column; }
.my-shift-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.my-shift-row:last-child { border-bottom: none; }
.msr-date { font-size: 13px; font-weight: 600; }
.msr-time { font-size: 13px; color: var(--text); font-weight: 700; }
.msr-h { font-size: 11px; color: var(--text-3); }

/* ─── Stats grid (emp) ─── */
.emp-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.estat { background: white; border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 10px 8px; text-align: center; }
.estat-val { font-size: 19px; font-weight: 700; letter-spacing: -.5px; }
.estat-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 2px; }

/* ─── Export button ─── */
.export-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px; background: white; border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--text-2); font-family: var(--font); transition: all .12s; margin-bottom: 8px;
}
.export-btn:hover { border-color: var(--border-2); color: var(--text); }
.export-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

/* ─── Month selector for export ─── */
.month-sel-row { display: flex; gap: 4px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.month-sel-row::-webkit-scrollbar { display: none; }
.msel-btn { padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: white; color: var(--text-2); cursor: pointer; transition: all .12s; font-family: var(--font); flex-shrink: 0; }
.msel-btn.active { background: var(--text); color: white; border-color: var(--text); }

/* ─── Modal ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
  backdrop-filter: blur(1px);
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px;
  padding: 18px 20px 36px; transform: translateY(100%);
  transition: transform .22s cubic-bezier(.32,.72,0,1); max-height: 88vh; overflow-y: auto;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-pill { width: 32px; height: 3px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; letter-spacing: -.3px; }
.modal-sub { font-size: 12px; color: var(--text-3); margin-bottom: 16px; }
.mfield { margin-bottom: 12px; }
.mfield label { display: block; font-size: 11px; font-weight: 500; color: var(--text-2); margin-bottom: 4px; letter-spacing: .1px; }
.mfield input, .mfield select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-family: var(--font); outline: none; color: var(--text); background: white;
  transition: border-color .12s;
}
.mfield input:focus, .mfield select:focus { border-color: var(--text); box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
.mrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 6px; margin-top: 18px; }
.mbtn-cancel { padding: 11px 14px; background: var(--bg); color: var(--text-2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.mbtn-delete { flex: 1; padding: 11px; background: var(--red-soft); color: var(--danger); border: 1px solid #FECACA; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
.mbtn-save { flex: 2; padding: 11px; background: var(--text); color: white; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .12s; }
.mbtn-save:hover { background: #27272A; }
.cost-preview { background: var(--bg); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: var(--text-2); margin-top: 4px; display: none; border: 1px solid var(--border); }
.cost-preview strong { color: var(--text); font-weight: 700; }

/* ─── Toast — minimalny ─── */
.toast {
  position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%) translateY(6px);
  background: rgba(0,0,0,.72); color: white; padding: 7px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; z-index: 300; opacity: 0; pointer-events: none;
  white-space: nowrap; transition: all .18s cubic-bezier(.32,.72,0,1); box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Misc ─── */
.empty-state { text-align: center; padding: 52px 24px; color: var(--text-3); }
.empty-state svg { width: 36px; height: 36px; stroke: var(--border); margin-bottom: 12px; }
.empty-state p { font-size: 13px; font-weight: 600; color: var(--text-2); }
.empty-state span { font-size: 12px; }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .65s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.sect-label { padding: 14px 16px 5px; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }

/* ─── Ewidencja (Clock) — clean, colorful, full-screen ─── */
.clock-wrap { padding: 0 0 90px; display: flex; flex-direction: column; gap: 0; min-height: calc(100vh - 90px); background: var(--bg); }

/* Hero — jasny panel ze statusem i przyciskiem */
.clock-hero {
  background: white; color: var(--text);
  padding: 32px 24px 36px; text-align: center; display: flex; flex-direction: column; align-items: center;
  position: relative; overflow: hidden; border-bottom: 1px solid var(--border);
}
.clock-hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 80% at 50% -20%, rgba(123,29,46,.04) 0%, transparent 70%);
  pointer-events: none;
}
.clock-time-big {
  font-size: 56px; font-weight: 800; letter-spacing: -3px; color: var(--text);
  font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px;
}
.clock-date { font-size: 13px; color: var(--text-3); margin-bottom: 28px; letter-spacing: .2px; }

/* Wielki okrągły przycisk clock-in jak w Connecteam */
.clock-big-btn-wrap { position: relative; margin-bottom: 20px; }
.clock-ring {
  width: 160px; height: 160px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.clock-ring::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%;
  border: 2px solid rgba(0,0,0,.04);
}
.clock-btn-round {
  width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; font-family: var(--font); font-weight: 700; font-size: 13px; letter-spacing: -.2px;
  transition: all .2s; position: relative; z-index: 1;
}
.clock-btn-round:active { transform: scale(.95); }
.clock-btn-round svg { width: 28px; height: 28px; }

.clock-btn-round.state-idle {
  background: #16A34A; color: white;
  box-shadow: 0 8px 32px rgba(22,163,74,.35), 0 2px 8px rgba(0,0,0,.12);
}
.clock-btn-round.state-idle:hover { box-shadow: 0 12px 40px rgba(22,163,74,.5); }
.clock-btn-round.state-idle svg { stroke: white; fill: white; stroke-width: 0; }

.clock-btn-round.state-working {
  background: #16A34A; color: white;
  box-shadow: 0 8px 32px rgba(22,163,74,.4), 0 2px 8px rgba(0,0,0,.3);
  animation: working-glow 2s ease-in-out infinite;
}
.clock-btn-round.state-working svg { stroke: white; fill: none; stroke-width: 2; }
@keyframes working-glow {
  0%,100% { box-shadow: 0 8px 32px rgba(22,163,74,.4), 0 2px 8px rgba(0,0,0,.3); }
  50% { box-shadow: 0 8px 48px rgba(22,163,74,.6), 0 2px 8px rgba(0,0,0,.3); }
}

.clock-btn-round.state-break {
  background: #D97706; color: white;
  box-shadow: 0 8px 32px rgba(217,119,6,.4), 0 2px 8px rgba(0,0,0,.3);
}
.clock-btn-round.state-break svg { stroke: white; fill: none; stroke-width: 2; }
.clock-btn-round:disabled { opacity: .5; cursor: not-allowed; }

.clock-elapsed {
  font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--text);
  font-variant-numeric: tabular-nums; display: none; margin-bottom: 4px;
}
.clock-status-label { font-size: 12px; color: var(--text-3); letter-spacing: .2px; margin-bottom: 20px; }

/* Przyciski pomocnicze (przerwa / zakończ) w hero */
.clock-secondary-row { display: flex; gap: 10px; width: 100%; }
.clock-sec-btn {
  flex: 1; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font); border: 1.5px solid rgba(255,255,255,.15);
  color: white; background: rgba(255,255,255,.08); transition: all .15s; letter-spacing: -.1px;
}
.clock-sec-btn:hover { background: rgba(255,255,255,.14); }
.clock-sec-btn.danger { border-color: rgba(220,38,38,.4); color: #FCA5A5; background: rgba(220,38,38,.12); }
.clock-sec-btn.danger:hover { background: rgba(220,38,38,.2); }

.clock-geo-status { font-size: 11px; margin-top: 16px; display: flex; align-items: center; gap: 5px; }
.clock-geo-ok { color: #16A34A; }
.clock-geo-err { color: var(--danger); }
.clock-geo-loading { color: var(--text-3); }
.clock-geo-loading { color: rgba(255,255,255,.35); }

/* Reszta widoku — jasna sekcja */
.clock-body { background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }

@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

.clock-history-card {
  background: white; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
}
.clock-history-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }
.clock-session-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.clock-session-row:last-child { border-bottom: none; }
.csr-date { font-size: 12px; font-weight: 600; color: var(--text-2); min-width: 70px; }
.csr-times { flex: 1; font-size: 13px; font-weight: 600; color: var(--text); }
.csr-break { font-size: 11px; color: var(--warn); font-weight: 500; margin-top: 1px; }
.csr-dur { text-align: right; }
.csr-dur-h { font-size: 15px; font-weight: 700; letter-spacing: -.3px; color: var(--text); }
.csr-dur-min { font-size: 10px; color: var(--text-3); }

/* Manager live panel */
.clock-live-card { background: white; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.clock-live-title { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; padding: 12px 14px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.clock-live-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.clock-live-row:last-child { border-bottom: none; }
.clr-name { flex: 1; font-size: 13px; font-weight: 600; }
.clr-dept { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.clr-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.clr-badge-in { background: var(--green-bg); color: var(--green); }
.clr-badge-break { background: #FFF7ED; color: var(--warn); }
.clr-badge-out { background: var(--bg); color: var(--text-3); border: 1px solid var(--border); }
.clr-time { font-size: 12px; color: var(--text-3); min-width: 60px; text-align: right; }
.clr-edit-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--text-3); cursor: pointer; font-family: var(--font); white-space: nowrap; }
.clr-edit-btn:active { background: var(--bg); }

/* Modal edycji sesji */
.sess-edit-modal { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sem-title { font-size: 16px; font-weight: 700; color: var(--text); }
.sem-name { font-size: 13px; color: var(--text-3); margin-top: -8px; }
.sem-field { display: flex; flex-direction: column; gap: 4px; }
.sem-label { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; }
.sem-input { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: var(--font); color: var(--text); background: white; -webkit-appearance: none; }
.sem-input:focus { outline: none; border-color: var(--brand); }
.sem-row { display: flex; gap: 10px; }
.sem-row .sem-field { flex: 1; }
.sem-actions { display: flex; gap: 10px; padding-top: 4px; }
.sem-btn-save { flex: 1; background: var(--brand); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; }
.sem-btn-del { background: var(--danger-bg); color: var(--danger); border: 1px solid #FECACA; border-radius: 8px; padding: 12px 16px; font-size: 14px; font-weight: 600; font-family: var(--font); cursor: pointer; }

/* ─── Chat zespołowy ─── */
.chat-screen { display: flex; flex-direction: column; height: 100%; }
.chat-msgs {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 10px;
  -webkit-overflow-scrolling: touch;
}
.chat-bubble-wrap-UNUSED { display: flex; }
.chat-av {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: white;
}
/* ─── Chat bubbles — WhatsApp style ─── */
.chat-bubble-wrap { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 2px; padding: 0 12px; }
.chat-bubble-wrap.mine { flex-direction: row-reverse; }
.chat-bubble-wrap.grouped { margin-bottom: 1px; }
.chat-av-col { width: 32px; flex-shrink: 0; display: flex; align-items: flex-end; }
.chat-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
.chat-av-placeholder { width: 32px; }
.chat-msg-col { display: flex; flex-direction: column; max-width: 75%; }
.chat-bubble-wrap.mine .chat-msg-col { align-items: flex-end; }
.chat-sender { font-weight: 600; font-size: 11px; color: var(--brand); margin-bottom: 3px; padding-left: 4px; }
.chat-bubble {
  padding: 8px 12px 6px; word-break: break-word; position: relative;
  font-size: 15px; line-height: 1.45;
}
/* Wiadomości innych — szare po lewej */
.chat-bubble.other {
  background: white; border: 1px solid var(--border); color: var(--text);
  border-radius: 18px 18px 18px 4px;
}
/* Wiadomości własne — bordowe po prawej */
.chat-bubble-wrap.mine .chat-bubble {
  background: var(--brand); color: white;
  border-radius: 18px 18px 4px 18px;
}
/* Grupowanie — zaokrąglenia dla środkowych w grupie */
.chat-bubble.other.in-group { border-radius: 4px 18px 18px 4px; }
.chat-bubble-wrap.mine .chat-bubble.in-group { border-radius: 18px 4px 4px 18px; }
.chat-bubble.other.group-last { border-radius: 4px 18px 18px 18px; }
.chat-bubble-wrap.mine .chat-bubble.group-last { border-radius: 18px 4px 18px 18px; }
.chat-meta { font-size: 10px; color: var(--text-3); margin-top: 3px; padding: 0 4px; }
.chat-bubble-wrap.mine .chat-meta { text-align: right; color: rgba(255,255,255,.6); }
/* Znacznik czasu w bańce */
.chat-time-inline { font-size: 10px; opacity: .6; margin-left: 6px; float: right; margin-top: 3px; }
.chat-input-bar {
  display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px);
  background: white; border-top: 1px solid var(--border); align-items: flex-end;
}
.chat-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 22px;
  font-size: 14px; font-family: var(--font); outline: none; resize: none;
  max-height: 120px; line-height: 1.4; transition: border-color .15s;
  background: var(--bg); color: var(--text);
}
.chat-input:focus { border-color: var(--text); background: white; }
.chat-send-btn {
  width: 42px; height: 42px; border-radius: 50%; background: var(--brand);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .15s; color: white;
  box-shadow: 0 2px 10px rgba(123,29,46,.35);
}
.chat-send-btn:active { transform: scale(.93); }
.chat-send-btn svg { width: 17px; height: 17px; stroke: white; fill: none; stroke-width: 2; }
.chat-day-label {
  text-align: center; font-size: 11px; color: var(--text-3); font-weight: 500;
  padding: 4px 10px; background: var(--border); border-radius: 10px;
  align-self: center; margin: 4px 0;
}
.chat-empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }

/* ─── Dashboard pracownika ─── */
.emp-dash { padding: 0 0 100px; }
.emp-dash-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 16px 12px;
}
.emp-dash-greeting { font-size: 12px; color: var(--text-3); font-weight: 500; letter-spacing: .2px; }
.emp-dash-name { font-size: 22px; font-weight: 700; letter-spacing: -.5px; color: var(--text); line-height: 1.1; margin-top: 2px; }
.emp-dash-dept-badge {
  background: var(--accent-soft); color: var(--text-2); font-size: 11px; font-weight: 600;
  padding: 5px 11px; border-radius: 20px; white-space: nowrap; text-transform: capitalize;
}
.emp-next-shift {
  margin: 4px 16px 16px; padding: 20px; border-radius: 16px;
  background: var(--text); color: white; position: relative; overflow: hidden;
}
.emp-next-shift::before {
  content: ''; position: absolute; right: -20px; top: -20px;
  width: 100px; height: 100px; border-radius: 50%;
  background: rgba(255,255,255,.06);
}
.emp-next-empty { background: var(--accent-soft); }
.emp-next-empty .ens-eyebrow { color: var(--text-3); }
.ens-eyebrow { font-size: 11px; font-weight: 600; opacity: .6; letter-spacing: .3px; text-transform: uppercase; margin-bottom: 8px; }
.ens-time { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.ens-dur { font-size: 12px; opacity: .6; margin-top: 8px; }
.emp-next-empty .ens-time, .emp-next-empty .ens-dur { color: var(--text-2); }
.emp-section-title {
  font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .5px;
  text-transform: uppercase; padding: 0 16px; margin-bottom: 10px;
}
.emp-week-strip {
  display: flex; gap: 6px; padding: 0 16px; margin-bottom: 20px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.emp-week-strip::-webkit-scrollbar { display: none; }
.emp-week-day {
  flex: 1; min-width: 40px; display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px; border-radius: 12px; background: white; border: 1.5px solid var(--border);
  gap: 4px; transition: all .15s;
}
.emp-week-today { border-color: var(--text); background: var(--text); color: white; }
.emp-week-we { opacity: .5; }
.ewd-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }
.emp-week-today .ewd-label { color: rgba(255,255,255,.6); }
.ewd-num { font-size: 15px; font-weight: 700; }
.ewd-shift { font-size: 10px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 2px 5px; border-radius: 6px; }
.emp-week-today .ewd-shift { background: rgba(255,255,255,.2); color: white; }
.ewd-off { font-size: 10px; color: transparent; height: 18px; }
.emp-stats-row { display: flex; gap: 10px; padding: 0 16px; margin-bottom: 20px; }
.emp-stat-card {
  flex: 1; background: white; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 14px 10px; text-align: center;
}
.esc-val { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.esc-label { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 3px; }
.emp-past-list { margin: 0 16px; border-radius: 12px; overflow: hidden; border: 1.5px solid var(--border); background: white; }
.emp-past-row {
  display: flex; align-items: center; padding: 13px 14px; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.emp-past-row:last-child { border-bottom: none; }
.epr-date { flex: 1; font-size: 13px; font-weight: 500; color: var(--text-2); }
.epr-time { font-size: 13px; font-weight: 600; color: var(--text); }
.epr-h { font-size: 12px; color: var(--text-3); min-width: 36px; text-align: right; }

/* ─── Badge powiadomień ─── */
.bnav-badge {
  position: absolute; top: 4px; right: 50%; transform: translateX(calc(50% + 10px));
  background: var(--danger); color: white; font-size: 9px; font-weight: 700;
  min-width: 16px; height: 16px; border-radius: 8px; display: flex;
  align-items: center; justify-content: center; padding: 0 4px;
  border: 2px solid white; pointer-events: none;
}

/* ─── Profil pracownika (sheet) ─── */
.profile-sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 400;
  display: flex; align-items: flex-end; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.profile-sheet-overlay.open { opacity: 1; pointer-events: all; }
.profile-sheet {
  background: white; width: 100%; border-radius: 24px 24px 0 0;
  padding: 0 0 calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 85vh; overflow-y: auto;
}
.profile-sheet-overlay.open .profile-sheet { transform: translateY(0); }
.profile-sheet-pill { width: 36px; height: 4px; background: var(--border-2); border-radius: 2px; margin: 12px auto 0; }
.profile-sheet-header {
  display: flex; align-items: center; gap: 14px; padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.profile-sheet-av {
  width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 20px; font-weight: 700; color: white; flex-shrink: 0;
}
.profile-sheet-name { font-size: 18px; font-weight: 700; letter-spacing: -.4px; }
.profile-sheet-role { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.profile-stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 0; }
.profile-stat { background: white; padding: 14px 10px; text-align: center; }
.profile-stat-val { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
.profile-stat-lbl { font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 2px; letter-spacing: .2px; }
.profile-actions { padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.profile-action-btn {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  cursor: pointer; font-family: var(--font); font-size: 14px; font-weight: 500;
  color: var(--text); transition: all .12s; text-align: left;
}
.profile-action-btn:hover { background: white; border-color: var(--border-2); }
.profile-action-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; color: var(--text-3); flex-shrink: 0; }
.profile-action-btn.danger { color: var(--danger); }
.profile-action-btn.danger svg { color: var(--danger); }

/* ─── Animacje wejścia kart ─── */
@keyframes slide-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.anim-in { animation: slide-up .25s ease both; }
.anim-in:nth-child(2) { animation-delay: .05s; }
.anim-in:nth-child(3) { animation-delay: .1s; }
.anim-in:nth-child(4) { animation-delay: .15s; }

/* ─── Pull to refresh — iOS style ─── */
.ptr-indicator {
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; height: 0;
  transition: height .3s cubic-bezier(.4,0,.2,1);
}
.ptr-indicator.visible { height: 48px; }
.ptr-spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border-2); border-top-color: var(--brand);
  animation: spin .7s cubic-bezier(.5,0,.5,1) infinite;
}

async function sbFetch(path, opts={}) {
  const h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(currentUser?.access_token) h['Authorization']='Bearer '+currentUser.access_token;
  const {headers:extraH, ...restOpts}=opts;
  const r=await fetch(SB_URL+path,{headers:{...h,...(extraH||{})}, ...restOpts});
  if(!r.ok){
    const txt=await r.text();
    let msg=txt;
    try{const j=JSON.parse(txt);msg=j.message||j.hint||txt;}catch(_){}
    throw new Error(msg);
  }
  if(r.status===204) return [];
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

async function loadWorkSessions(){
  const from=new Date(); from.setDate(from.getDate()-7);

async function loadShiftsForCurrentPeriod(){
  let from,to;
  if(schedView==='week'){
    const w=getWeekRange(currentWeekOffset);
    from=w.from; to=w.to;
  } else {
    const m=getMonthRange(currentMonthOffset);
    from=m.from; to=m.to;
  }
  shifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);
}

function getWeekRange(offset){
  const now=new Date();
  const dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now); mon.setDate(now.getDate()-dow+offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return{from:fd(mon),to:fd(sun),monDate:mon};
}

function getMonthRange(offset){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+offset;
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  return{from:fd(first),to:fd(last),first,last,year:first.getFullYear(),month:first.getMonth()};
}

function fd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function today(){return fd(new Date());}
function calcH(s,e){
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let m=(eh*60+em)-(sh*60+sm); if(m<0)m+=1440; return m/60;
}

}

    <div class="hb-row" onclick="hbTap(this,'${b.id}')">
      ${b.badge?`<span class="hb-badge">${b.badge}</span>`:''}

        <div class="hb-row-title">${b.label}</div>
      </div>
      <div class="hb-row-arrow"></div>
      <div class="hb-ripple-wrap"></div>
    </div>`;

  const rows=[];
  rows.push({id:'sched',   label:'Grafik',       sub:'harmonogram'});
  if(isOwnerOrMgr||isKitchen)
    rows.push({id:'kitchen', label:'Kuchnia',     sub:'receptury & straty'});
  rows.push({id:'board',   label:'Tablica',       sub:'ogłoszenia'});
  rows.push({id:'events',  label:'Wydarzenia',    sub:'eventy & menu'});
  rows.push({id:'avail',   label:'Dyspozycja',    sub:'dostępność'});
  if(isOwnerOrMgr){
    rows.push({id:'emps',  label:'Pracownicy',    sub:'zarządzanie'});
    rows.push({id:'dash',  label:'Panel',          sub:'raporty'});
  }

  mc.innerHTML=`
  <div class="hw-wrap">
    <div class="hw-header">
      <div class="hw-greeting-line"><div class="hw-greeting-text">${greeting},</div></div>
      <div class="hw-name-line"><div class="hw-name-text">${firstName}.</div></div>
    </div>

    <div class="hw-clock-block${clockCls}" onclick="hbTap(this,'clock')">
      ${active?`<span class="hw-clock-pulse"></span>`:''}

      <div class="hw-clock-sub">${clockHint}</div>
      <div class="hw-clock-caret">→</div>
      <div class="hb-ripple-wrap"></div>
    </div>

    <div class="hw-blocks">
      ${rows.map(rowHTML).join('')}
    </div>
  </div>`;

  updateFabBadge();
}

function hbTap(el, view){
  if(!el) return;
  const wrap=el.querySelector('.hb-ripple-wrap');
  if(wrap){
    const r=document.createElement('span');
    r.className='hb-ripple';
    wrap.innerHTML=''; wrap.appendChild(r);
    setTimeout(()=>r.remove(),500);
  }
  setTimeout(()=>showView(view), 110);
}

function renderEmployeeDashboard(mc){
  const emp=getCurrentEmployee();
  const tod=today();
  const {from,to,monDate}=getWeekRange(0);
  const myShifts=emp?shifts.filter(s=>s.employee_id===emp.id):[];
  const thisWeekShifts=myShifts.filter(s=>s.date>=from&&s.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const totalH=thisWeekShifts.reduce((s,sh)=>s+calcH(sh.start_time||'10:00:00',sh.end_time||'18:00:00'),0);

  // Następna zmiana
  const upcoming=myShifts.filter(s=>s.date>=tod).sort((a,b)=>a.date.localeCompare(b.date));
  const next=upcoming[0];

  // Dni tygodnia
  const days=['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
  let weekHtml='';
  for(let i=0;i<7;i++){
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    const dStr=fd(d);
    const shift=thisWeekShifts.find(s=>s.date===dStr);
    const isT=dStr===tod;
    const isWe=i>=5;
    weekHtml+=`<div class="emp-week-day${isT?' emp-week-today':''}${isWe?' emp-week-we':''}">
      <div class="ewd-label">${days[i]}</div>
      <div class="ewd-num">${d.getDate()}</div>
      ${shift
        ? `<div class="ewd-shift">${(shift.start_time||'10:00').slice(0,5)}</div>`
        : `<div class="ewd-off">${isWe?'—':''}&#8203;</div>`}
    </div>`;
  }

  // Ostatnie zmiany (grafik — nie ewidencja czasu)
  const past=myShifts.filter(s=>s.date<tod).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);

  let html=`<div class="emp-dash">
    <div class="emp-dash-header">
      <div>
        <div class="emp-dash-greeting">${greeting()}</div>
        <div class="emp-dash-name">${emp?.name||currentUser?.email?.split('@')[0]||''}</div>
      </div>
      <div class="emp-dash-dept-badge">${emp?.department||''}</div>
    </div>`;

  // Karta następna zmiana
  if(next){
    const daysUntil=Math.round((new Date(next.date)-new Date(tod))/(86400000));
    const when=daysUntil===0?'Dziś':daysUntil===1?'Jutro':fmtDateLong(next.date);
    const h=calcH(next.start_time||'10:00:00',next.end_time||'18:00:00');
    html+=`<div class="emp-next-shift">
      <div class="ens-eyebrow">Następna zmiana · ${when}</div>
      <div class="ens-time">${(next.start_time||'10:00').slice(0,5)} – ${(next.end_time||'18:00').slice(0,5)}</div>
      <div class="ens-dur">${h.toFixed(1)} h pracy · ${fmtDateLong(next.date)}</div>
    </div>`;
  } else {
    html+=`<div class="emp-next-shift emp-next-empty">
      <div class="ens-eyebrow">Następna zmiana</div>
      <div class="ens-time" style="font-size:18px;opacity:.5">Brak zaplanowanych zmian</div>
    </div>`;
  }

  // Tydzień w pigułce
  html+=`<div class="emp-section-title">Ten tydzień${totalH>0?` · ${totalH.toFixed(1)} h`:''}</div>
  <div class="emp-week-strip">${weekHtml}</div>`;

  // Statystyki mini
  html+=`<div class="emp-stats-row">
    <div class="emp-stat-card">
      <div class="esc-val">${thisWeekShifts.length}</div>
      <div class="esc-label">Zmiany w tygodniu</div>
    </div>
    <div class="emp-stat-card">
      <div class="esc-val">${totalH>0?totalH.toFixed(1)+'h':'—'}</div>
      <div class="esc-label">Godziny w tygodniu</div>
    </div>
    <div class="emp-stat-card">
      <div class="esc-val">${upcoming.length}</div>
      <div class="esc-label">Nadchodzące</div>
    </div>
  </div>`;

  // Ostatnie zmiany
  if(past.length>0){
    html+=`<div class="emp-section-title">Historia</div><div class="emp-past-list">`;
    past.forEach(s=>{
      const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
      html+=`<div class="emp-past-row">
        <div class="epr-date">${fmtDateLong(s.date)}</div>
        <div class="epr-time">${(s.start_time||'10:00').slice(0,5)} – ${(s.end_time||'18:00').slice(0,5)}</div>
        <div class="epr-h">${h.toFixed(1)} h</div>
      </div>`;
    });
    html+=`</div>`;
  }

  html+=`</div>`;
  mc.innerHTML=html;
}

function greeting(){
  const h=new Date().getHours();
  if(h<12) return'Dzień dobry';
  if(h<18) return'Dobry wieczór';
  return'Dobry wieczór';
}

function fmtDateLong(dateStr){
  if(!dateStr) return'';
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
}

function renderWeek(mc){
  const{from,to,monDate}=getWeekRange(currentWeekOffset);
  const tod=today();
  const days=Array.from({length:7},(_,i)=>{
    const d=new Date(monDate); d.setDate(monDate.getDate()+i);
    return{date:fd(d),label:['Pon','Wt','Śr','Czw','Pt','Sob','Nd'][i],num:d.getDate()};
  });
  const viewEmps=canEdit()
    ?(currentDept==='all'?employees:employees.filter(e=>e.department===currentDept))
    :employees.filter(e=>e.email===currentUser?.user?.email);

  let tc=0,th=0;
  shifts.forEach(s=>{
    const emp=employees.find(e=>e.id===s.employee_id); if(!emp)return;
    const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');
    tc+=h*(emp.rate_net||0); th+=h;
  });

  const sun=new Date(monDate); sun.setDate(monDate.getDate()+6);
  const rng=`${monDate.getDate()}.${pad(monDate.getMonth()+1)} — ${sun.getDate()}.${pad(sun.getMonth()+1)}.${sun.getFullYear()}`;

  let html=`<div class="page-bar">
    <div class="page-bar-title">Grafik</div>
    <div class="view-toggle">
      <button class="vt-btn active" onclick="switchSchedView('week')">Tydzień</button>
      <button class="vt-btn" onclick="switchSchedView('month')">Miesiąc</button>
    </div>
  </div>
  <div class="week-nav">
    <button class="wn-btn" onclick="changeWeek(-1)">‹</button>
    <div class="wn-label">
      <div class="wn-range">${rng}</div>
      <div class="wn-week">Tydzień ${wNum(monDate)}${currentWeekOffset!==0?` · <span class="today-link" onclick="goToToday()">Dziś</span>`:''}</div>
    </div>
    <button class="wn-btn" onclick="changeWeek(1)">›</button>
  </div>`;

  if(canEdit()){
    html+=`<div class="dept-row">
      <button class="dtab ${currentDept==='all'?'active':''}" onclick="setDept('all')">Wszyscy</button>
      <button class="dtab ${currentDept==='kuchnia'?'active':''}" onclick="setDept('kuchnia')">Kuchnia</button>
      <button class="dtab ${currentDept==='sala'?'active':''}" onclick="setDept('sala')">Sala</button>
    </div>`;
    if(th>0){
      html+=`<div class="cost-strip">
        <div><div class="cs-label">Koszt tygodnia</div><div class="cs-val">${tc.toFixed(0)} zł</div></div>
        <div style="text-align:right"><div class="cs-label">Godziny</div><div class="cs-val">${th.toFixed(1)} h</div></div>
      </div>`;
    }
  }

  html+=`<div class="sched-wrap"><table class="sched-tbl"><thead><tr>
    <th class="th-emp">Pracownik</th>`;
  days.forEach((day,i)=>{
    const isT=day.date===tod;
    const isWe=i>=5; // Sat=5, Sun=6 (Mon=0 in our array)
    html+=`<th class="th-day${isT?' today':''}${isWe?' weekend':''}"><span style="text-transform:uppercase;letter-spacing:.3px">${day.label}</span><span class="dn">${day.num}</span></th>`;
  });
  if(canEdit()) html+=`<th class="th-sum">Tyg.</th>`;
  html+=`</tr></thead><tbody>`;

  viewEmps.forEach(emp=>{
    const eS=shifts.filter(s=>s.employee_id===emp.id);
    let eH=0,eC=0;
    eS.forEach(s=>{const h=calcH(s.start_time||'10:00:00',s.end_time||'18:00:00');eH+=h;eC+=h*(emp.rate_net||0);});
    const dc=emp.department==='kuchnia'?'#B45309':'#1D4ED8';

    html+=`<tr><td><div class="td-emp-cell">
      <div class="av" style="background:${avatarColor(emp.name)}">${initials(emp.name)}</div>
      <div>
        <div class="td-emp-name">${emp.name}</div>
        <div class="td-emp-dept"><span class="dept-dot" style="background:${dc}"></span>${emp.department}</div>
      </div>
    </div></td>`;

    days.forEach((day,di)=>{
      const shift=eS.find(s=>s.date===day.date);
      const isT=day.date===tod;
      const isWe=di>=5;
      const h=shift?calcH(shift.start_time||'10:00:00',shift.end_time||'18:00:00'):0;
      const cost=h*(emp.rate_net||0);
      // Check date-based unavailability
      const unavail=availDates.find(a=>a.employee_id===emp.id&&a.date===day.date&&a.available===false);
      const ca=canEdit()?`onclick="openShiftModal('${emp.id}','${emp.name}','${day.date}','${shift?.id||''}')"`:''
      let cellCls='td-day-cell';
      if(shift) cellCls+=' filled';
      if(isT) cellCls+=' is-today';
      if(isWe) cellCls+=' weekend';
      if(unavail&&!shift) cellCls+=' unavail';
      html+=`<td class="${cellCls}" ${ca}>`;
      if(shift){
        html+=`<div class="shift-chip">${(shift.start_time||'10:00').slice(0,5)}–${(shift.end_time||'18:00').slice(0,5)}</div>`;
        if(canEdit()&&(emp.rate_net||0)>1) html+=`<div class="shift-cost-lbl">${cost.toFixed(0)} zł</div>`;
      } else if(unavail){
        html+=`<div class="cell-unavail">✕</div>`;
      } else if(canEdit()){
        html+=`<div class="cell-add">+</div>`;
      }
      html+=`</td>`;
    });

    if(canEdit()){
      html+=`<td class="td-sum-cell">
        ${eH>0?`<div class="sum-h">${eH.toFixed(1)}h</div><div class="sum-cost">${(emp.rate_net||0)>1?eC.toFixed(0)+' zł':eS.length+' zm.'}</div>`:`<span style="color:var(--border)">—</span>`}
      </td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div>`;
  mc.innerHTML=html;
}

  viewEmps.forEach(emp=>{
