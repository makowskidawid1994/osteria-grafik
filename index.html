function getAvailMonth(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+availMonthOffset;
  const first=new Date(y,m,1); const last=new Date(y,m+1,0);
  return{year:first.getFullYear(),month:first.getMonth(),first,last,daysInMonth:last.getDate()};
}

        for(let i=0;i<startDow;i++) html+=`<div class="adc adc-empty"></div>`;

          const dateStr=`${prefix}-${pad(d)}`;
          const rec=empDates.find(a=>a.date===dateStr);
          const isBlocked=monthBlocked.some(b=>b.date===dateStr);
          let cls='adc';
          if(isBlocked) cls+=' adc-blocked';
          else if(rec?.available===false) cls+=' avail-no';
          else if(dateStr<tod) cls+=' adc-past';
          html+=`<div class="${cls}">${d}</div>`;
        }
        html+=`</div></div>`;
      }
    });
    html+=`</div>`;

  } else {
    // ── EMPLOYEE VIEW ──
    if(!meEmp){
      html+=`<div class="empty-state"><p>Nie znaleziono Twojego konta w bazie pracowników.</p></div>`;
      mc.innerHTML=html; return;
    }
    const empId=meEmp.id;
    // Load saved unavail for this month
    const savedUnavail=new Set(
      availDates.filter(a=>a.employee_id===empId&&a.date.startsWith(prefix)&&a.available===false).map(a=>a.date)
    );
    // On first render of a month, seed pending from saved
    if(!pendingUnavailDirty){
      pendingUnavail=new Set(savedUnavail);
    }
    const unavailSet=pendingUnavail;
    const noCount=unavailSet.size;

    // Status bar
    if(noCount>0){
      html+=`<div class="avail-status-bar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Zaznaczono ${noCount} ${noCount===1?'dzień':'dni'} niedostępności
      </div>`;
    } else {
      html+=`<div class="avail-status-bar empty">Nie zaznaczono żadnych dni niedostępności — jesteś dostępny cały miesiąc</div>`;
    }

    html+=`<div style="padding:10px 20px 6px;font-size:12px;color:var(--text-3)">Zaznacz dni, kiedy <strong style="color:var(--text)">NIE możesz</strong> pracować. Reszta jest uznana za dostępną.</div>`;
    html+=`<div class="avail-days-list">`;

    // Build weeks
    let weekDays=[];
    const startDow=first.getDay();
    // pad start
    for(let i=0;i<startDow;i++) weekDays.push(null);
    for(let d=1;d<=daysInMonth;d++) weekDays.push(d);
    // pad end to multiple of 7
    while(weekDays.length%7!==0) weekDays.push(null);

    const fullDowPL=['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
    for(let w=0;w<weekDays.length;w+=7){
      const week=weekDays.slice(w,w+7);
      const hasReal=week.some(d=>d!==null);
      if(!hasReal) continue;
      // Week label: show range
      const firstDay=week.find(d=>d!==null);
      const lastDay=[...week].reverse().find(d=>d!==null);
      html+=`<div class="avail-week-label">${monthName(month).slice(0,3).toUpperCase()} ${firstDay}–${lastDay}</div>`;
      week.forEach((d,wi)=>{
        if(!d) return;
        const dateStr=`${prefix}-${pad(d)}`;
        const isBlocked=monthBlocked.some(b=>b.date===dateStr);
        const isPast=dateStr<tod;
        const isUnavail=unavailSet.has(dateStr);
        const dowName=fullDowPL[wi];
        let rowCls='avail-day-row';
        if(isPast) rowCls+=' past';
        else if(isBlocked) rowCls+=' blocked';
        else if(isUnavail) rowCls+=' unavail';
        const clickable=!isPast&&!isBlocked;
        html+=`<div class="${rowCls}"${clickable?` onclick="togglePendingUnavail('${dateStr}')"`:''}>
          <div class="avail-day-num">${d}</div>
          <div class="avail-day-info">
            <div class="avail-day-name">${dowName}</div>
            <div class="avail-day-sub">${isBlocked?'Dzień zablokowany':isUnavail?'Niedostępny':isPast?'Miniony':'Dostępny'}</div>
          </div>`;
        if(isBlocked){
          html+=`<span class="avail-blocked-badge">🔒 blokada</span>`;
        } else if(!isPast){
          html+=`<div class="avail-toggle"></div>`;
        }
        html+=`</div>`;
      });
    }
    html+=`</div>`;

    // Save bar
    html+=`<div class="avail-save-bar">
      <button class="avail-clear-btn" onclick="clearPendingUnavail()">Wyczyść</button>
      <button class="avail-save-btn" onclick="saveAvailability('${empId}','${prefix}')">Zapisz dyspozycję</button>
    </div>`;
  }

  mc.innerHTML=html;
}

function changeAvailMonth(d){
  availMonthOffset+=d;
  pendingUnavailDirty=false; // reset pending on month change
  renderView();
}

function togglePendingUnavail(date){
  if(pendingUnavail.has(date)) pendingUnavail.delete(date);
  else pendingUnavail.add(date);
  pendingUnavailDirty=true;
  // Update row visually without full re-render
  const rows=document.querySelectorAll('.avail-day-row');
  rows.forEach(row=>{
    const onclick=row.getAttribute('onclick')||'';
    if(!onclick.includes(date)) return;
    const isNow=pendingUnavail.has(date);
    row.classList.toggle('unavail',isNow);
    const sub=row.querySelector('.avail-day-sub');
    if(sub) sub.textContent=isNow?'Niedostępny':'Dostępny';
  });
  // Update status bar count
  const sb=document.querySelector('.avail-status-bar');
  if(sb){
    const n=pendingUnavail.size;
    if(n>0){
      sb.className='avail-status-bar';
      sb.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Zaznaczono ${n} ${n===1?'dzień':'dni'} niedostępności`;
    } else {
      sb.className='avail-status-bar empty';
      sb.innerHTML='Nie zaznaczono żadnych dni niedostępności — jesteś dostępny cały miesiąc';
    }
  }
}

function clearPendingUnavail(){
  pendingUnavail.clear();
  pendingUnavailDirty=true;
  renderView();
}

async function saveAvailability(empId,prefix){
  const btn=document.querySelector('.avail-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Zapisywanie...';}
  try{
    // 1. Delete all existing availability_dates for this employee & month
    await sbFetch(`/rest/v1/availability_dates?employee_id=eq.${empId}&date=gte.${prefix}-01&date=lte.${prefix}-31`,{method:'DELETE'});
    // 2. Insert unavail records for each pending date
    if(pendingUnavail.size>0){
      const rows=[...pendingUnavail].map(date=>({employee_id:empId,date,available:false}));
      const inserted=await sbFetch('/rest/v1/availability_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(rows)});
      // Update local cache
      availDates=availDates.filter(a=>!(a.employee_id===empId&&a.date.startsWith(prefix)));
      if(Array.isArray(inserted)) availDates.push(...inserted);
    } else {
      availDates=availDates.filter(a=>!(a.employee_id===empId&&a.date.startsWith(prefix)));
    }
    pendingUnavailDirty=false;
    showToast('✓ Dyspozycja zapisana');
    renderView();
  }catch(e){
    showToast('Błąd zapisu: '+e.message.slice(0,60));
    if(btn){btn.disabled=false;btn.textContent='Zapisz dyspozycję';}
  }
}

async function toggleBlockedDate(date){
  const ex=blockedDates.find(b=>b.date===date);
  try{
    if(ex){
      await sbFetch(`/rest/v1/blocked_dates?id=eq.${ex.id}`,{method:'DELETE'});
      blockedDates=blockedDates.filter(b=>b.id!==ex.id);
      showToast('Odblokowano '+date.slice(5));
    } else {
      const r=await sbFetch('/rest/v1/blocked_dates?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({date,reason:''})});
      if(Array.isArray(r))blockedDates.push(...r);
      showToast('Zablokowano '+date.slice(5));
    }
    renderView();
  } catch(e){
    showToast('Błąd przy blokowaniu dnia');
  }
}

// Auto-fill: for the displayed month, insert shifts for employees on days they're available (skipping unavailable)
async function autoFillFromAvail(){
  const{year,month,daysInMonth}=getAvailMonth();
  const prefix=`${year}-${pad(month+1)}`;
  // Load existing shifts for that month
  const mShifts=await sbFetch(`/rest/v1/shifts?select=*&date=gte.${prefix}-01&date=lte.${prefix}-${pad(daysInMonth)}`).catch(()=>[]);

  let added=0, skipped=0;
  const toInsert=[];

  for(const emp of employees){
    const empUnavail=availDates.filter(a=>a.employee_id===emp.id&&a.available===false&&a.date.startsWith(prefix));
    const unavailSet=new Set(empUnavail.map(a=>a.date));

    for(let d=1;d<=daysInMonth;d++){
      const dateStr=`${prefix}-${pad(d)}`;
      const dow=new Date(year,month,d).getDay();
      // Skip Sundays (dow=0) unless specifically marked available
      const isAvailable=availDates.find(a=>a.employee_id===emp.id&&a.date===dateStr&&a.available===true);
      if(!isAvailable) continue; // only fill days employee explicitly said yes
      if(unavailSet.has(dateStr)){skipped++;continue;}
      if(mShifts.find(s=>s.employee_id===emp.id&&s.date===dateStr)){skipped++;continue;}
      toInsert.push({employee_id:emp.id,date:dateStr,start_time:'10:00:00',end_time:'18:00:00',note:'auto'});
    }
  }

  if(!toInsert.length){showToast('Brak dyspozycji do wstawienia — najpierw zaznacz dostępne dni');return;}

  try{
    // Wstawiamy wszystkie naraz z on-conflict ignore
    const r=await sbFetch('/rest/v1/shifts?select=*',{
      method:'POST',
      headers:{'Prefer':'return=representation,resolution=ignore-duplicates'},
      body:JSON.stringify(toInsert)
    });
    if(Array.isArray(r)&&r.length) shifts.push(...r);
    showToast(`Dodano ${toInsert.length} zmian na ${monthName(month)}`);
    schedView='month'; currentMonthOffset=availMonthOffset;
    await loadShiftsForCurrentPeriod();
    showView('sched');
  }catch(e){
    // Fallback: wstawiaj pojedynczo żeby pominąć konflikty
    let added=0;
    for(const row of toInsert){
      try{
        const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(row)});
        if(Array.isArray(r)&&r.length) shifts.push(...r);
        added++;
      }catch(_){}
    }
    if(added>0){
      showToast(`Dodano ${added} zmian na ${monthName(month)}`);
      schedView='month'; currentMonthOffset=availMonthOffset;
      await loadShiftsForCurrentPeriod();
      showView('sched');
    } else {
      showToast('Błąd: '+e.message.slice(0,80));
    }
  }
}

async function toggleAvail(empId,day){
  const ex=availability.find(a=>a.employee_id===empId&&a.day_of_week===day);
  const nv=ex?.available===true?false:true;
  try{
    if(ex){
      await sbFetch(`/rest/v1/availability?id=eq.${ex.id}`,{method:'PATCH',body:JSON.stringify({available:nv})});
      ex.available=nv;
    } else {
      const r=await sbFetch('/rest/v1/availability?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({employee_id:empId,day_of_week:day,available:nv})});
      if(Array.isArray(r))availability.push(...r);
    }
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

// ── EXPORT ──
let exportMonthOffset = 0; // relative to current month

async function exportMonthReport(monthOff) {
  exportMonthOffset = monthOff;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + monthOff;
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const from = fd(first), to = fd(last);
  const mName = monthName(first.getMonth()) + ' ' + first.getFullYear();

  showToast('Pobieranie danych...');
  const mShifts = await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`).catch(()=>[]);

  // Build CSV
  let csv = '﻿'; // BOM for Excel
  csv += 'Pracownik;Dział;Email;Data;Dzień;Godzina start;Godzina koniec;Godziny;Stawka netto (zł/h);Koszt netto (zł);Notatka\n';

  const rows = [];
  mShifts.forEach(s => {
    const emp = employees.find(e => e.id === s.employee_id);
    if (!emp) return;
    const h = calcH(s.start_time || '10:00:00', s.end_time || '18:00:00');
    const cost = h * (emp.rate_net || 0);
    const d = new Date(s.date + 'T12:00:00');
    const dayNames = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
    rows.push({
      name: emp.name, dept: emp.department, email: emp.email || '',
      date: s.date, day: dayNames[d.getDay()],
      start: (s.start_time || '10:00:00').slice(0,5),
      end: (s.end_time || '18:00:00').slice(0,5),
      hours: h.toFixed(2), rate: (emp.rate_net || 0).toFixed(2),
      cost: cost.toFixed(2), note: s.note || ''
    });
  });

  rows.sort((a,b) => a.name.localeCompare(b.name) || a.date.localeCompare(b.date));
  rows.forEach(r => {
    csv += `${r.name};${r.dept};${r.email};${r.date};${r.day};${r.start};${r.end};${r.hours};${r.rate};${r.cost};${r.note}\n`;
  });

  // Summary per employee
  csv += '\n--- PODSUMOWANIE ---\n';
  csv += 'Pracownik;Dział;Email;Liczba zmian;Łączne godziny;Stawka zł/h;Koszt netto zł\n';
  const summary = {};
  rows.forEach(r => {
    if (!summary[r.name]) summary[r.name] = {dept:r.dept, email:r.email, shifts:0, hours:0, rate:parseFloat(r.rate), cost:0};
    summary[r.name].shifts++;
    summary[r.name].hours += parseFloat(r.hours);
    summary[r.name].cost += parseFloat(r.cost);
  });
  Object.entries(summary).forEach(([name, s]) => {
    csv += `${name};${s.dept};${s.email};${s.shifts};${s.hours.toFixed(2)};${s.rate.toFixed(2)};${s.cost.toFixed(2)}\n`;
  });
  const totalH = rows.reduce((a,r)=>a+parseFloat(r.hours),0);
  const totalC = rows.reduce((a,r)=>a+parseFloat(r.cost),0);
  csv += `RAZEM;;;${rows.length};${totalH.toFixed(2)};;${totalC.toFixed(2)}\n`;

  // Download
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `osteria-grafik-${mName.replace(' ','-')}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`Pobrano raport: ${mName}`);
}

  if(!emp||(emp.rate_net||0)<=1){document.getElementById('sm-cost-preview').style.display='none';return;}
  const h=calcH(document.getElementById('sm-start').value,document.getElementById('sm-end').value);

  document.getElementById('sm-cost-preview').style.display='block';
}

async function saveShift(){
  const shiftId=document.getElementById('sm-shift-id').value;
  const p={employee_id:currentShiftEmpId,date:currentShiftDate,start_time:document.getElementById('sm-start').value+':00',end_time:document.getElementById('sm-end').value+':00',note:document.getElementById('sm-note').value};
  try{
    if(shiftId){
      await sbFetch(`/rest/v1/shifts?id=eq.${shiftId}`,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      const i=shifts.findIndex(s=>s.id===shiftId); if(i>=0)shifts[i]={...shifts[i],...p};
    } else {
      const r=await sbFetch('/rest/v1/shifts?select=*',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      if(Array.isArray(r))shifts.push(...r);
    }
    closeModal('shift-modal'); showToast('Zmiana zapisana'); renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,60));}
}

// Haversine — odległość w metrach między dwoma punktami GPS
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// Pobranie pozycji GPS jako Promise
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('Brak GPS w tej przeglądarce'));
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  });
}

// Sprawdzenie geofence — zwraca {ok, lat, lon, dist, error}
async function checkGeofence(){
  try{
    const p=await getPosition();
    const {latitude:lat,longitude:lon}=p.coords;
    const dist=haversine(lat,lon,GEO_LAT,GEO_LON);
    return{ok:dist<=GEO_RADIUS,lat,lon,dist:Math.round(dist)};
  }catch(e){
    return{ok:false,lat:null,lon:null,dist:null,error:e.message||'Błąd GPS'};
  }
}

// Formatowanie czasu elapsed
function fmtElapsed(ms){
  const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);
  return`${pad(h)}:${pad(m%60)}:${pad(s%60)}`;
}

function fmtTime(ts){
  if(!ts) return '—';
  const d=new Date(ts);
  return`${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function fmtDate(ts){
  if(!ts) return '';
  const d=new Date(ts);
  return`${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
}

function fmtDuration(min){
  if(min==null) return '—';
  const h=Math.floor(min/60),m=min%60;
  return h>0?`${h}h ${m>0?m+'m':''}`:`${m}m`;
}

// Aktualny pracownik (zalogowany)
function getCurrentEmployee(){
  if(!currentUser) return null;
  const email=currentUser.email||currentUser.user?.email||'';
  // Dopasowanie po emailu z Supabase Auth
  let emp=employees.find(e=>e.email&&e.email.toLowerCase()===email.toLowerCase());
  if(!emp){
    // Fallback: dopasowanie po username (część emaila przed @)
    const username=email.split('@')[0].toLowerCase();
    emp=employees.find(e=>e.email&&e.email.split('@')[0].toLowerCase()===username);
  }
  if(!emp){
    // Fallback: szukaj po nazwie wyświetlanej w headerze
    const displayName=document.getElementById('hdr-user')?.textContent?.toLowerCase()||'';
    emp=employees.find(e=>e.name&&e.name.toLowerCase().includes(displayName));
  }
  return emp||null;
}

        <span style="font-size:12px;font-weight:600;color:var(--green)">${activeSessions.length} os.</span>
      </div>`;
    if(liveRows.length===0){
      html+=`<div style="padding:20px;text-align:center;font-size:13px;color:var(--text-3)">Nikt nie jest teraz w pracy</div>`;
    } else {
      html+=liveRows.join('');
    }
    html+=`</div>`;

    // Export ewidencji czasu pracy
    html+=`<div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="export-btn" onclick="exportWorkSessions(0)" style="flex:1">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Ewidencja — ten miesiąc
      </button>
      <button class="export-btn" onclick="exportWorkSessions(-1)" style="flex:1">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Ewidencja — poprzedni miesiąc
      </button>
    </div>`;

    // Historia wszystkich sesji — edytowalna (tylko manager/właściciel)
    const allRecent=workSessions.filter(s=>s.clock_out).slice(0,30);
    html+=`<div class="clock-history-card">
      <div class="clock-history-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Historia zmian — wszyscy</span>
        <span style="font-size:10px;color:var(--text-3);font-weight:400;text-transform:none">Dotknij wiersza by edytować</span>
      </div>`;
    if(allRecent.length===0){
      html+=`<div style="padding:20px;text-align:center;font-size:13px;color:var(--text-3)">Brak zarejestrowanych sesji</div>`;
    } else {
      for(const s of allRecent){
        const empName=employees.find(e=>e.id===s.employee_id)?.name||s.employees?.name||'—';
        const dur=s.total_minutes;
        const brk=s.break_minutes;
        html+=`<div class="clock-session-row" onclick="openSessionEdit('${s.id}')" style="cursor:pointer;">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;color:var(--brand);margin-bottom:2px">${empName}</div>
            <div class="csr-date" style="min-width:0">${fmtDate(s.clock_in)}</div>
            <div style="font-size:13px;font-weight:600;color:var(--text);margin-top:2px">${fmtTime(s.clock_in)} – ${fmtTime(s.clock_out)}</div>
            ${brk>0?`<div class="csr-break">przerwa ${fmtDuration(brk)}</div>`:''}
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="csr-dur-h">${dur?fmtDuration(dur):'—'}</div>
            <div class="csr-dur-min">przepracowane</div>
            <div class="clr-edit-btn" style="margin-top:6px">Edytuj</div>
          </div>
        </div>`;
      }
    }
    html+=`</div>`;
  }

  // Historia sesji pracownika (własna)
  if(emp && recentSessions.length>0){
    html+=`<div class="clock-history-card">
      <div class="clock-history-title">Moje ostatnie zmiany</div>`;
    for(const s of recentSessions){
      const dur=s.total_minutes;
      const brk=s.break_minutes;
      html+=`<div class="clock-session-row">
        <div class="csr-date">${fmtDate(s.clock_in)}</div>
        <div class="csr-times">
          <div>${fmtTime(s.clock_in)} – ${fmtTime(s.clock_out)}</div>
          ${brk>0?`<div class="csr-break">przerwa ${fmtDuration(brk)}</div>`:''}
        </div>
        <div class="csr-dur">
          <div class="csr-dur-h">${fmtDuration(dur)}</div>
          <div class="csr-dur-min">przepracowane</div>
        </div>
      </div>`;
    }
    html+=`</div>`;
  } else if(emp && recentSessions.length===0 && !isManager){
    html+=`<div style="padding:24px;text-align:center;font-size:13px;color:var(--text-3)">Brak zarejestrowanych zmian</div>`;
  }

  html+=`</div></div>`;
  return html;
}

async function exportWorkSessions(monthOff){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+monthOff;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const pad2=n=>String(n).padStart(2,'0');
  const from=`${first.getFullYear()}-${pad2(first.getMonth()+1)}-01`;
  const to=`${last.getFullYear()}-${pad2(last.getMonth()+1)}-${pad2(last.getDate())}`;
  const mLabel=first.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});

  showToast('Pobieranie danych…');
  let sessions=[];
  try{
    sessions=await sbFetch(`/rest/v1/work_sessions?select=*,employees(name,department,rate_net)&clock_in=gte.${from}T00:00:00&clock_in=lte.${to}T23:59:59&order=clock_in.asc`);
    if(!Array.isArray(sessions)) sessions=[];
  }catch(e){showToast('Błąd pobierania: '+e.message.slice(0,60));return;}

  const days=['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
  const fmtDT=iso=>{if(!iso)return'';const d=new Date(iso);return`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;};
  const fmtD=iso=>{if(!iso)return'';const d=new Date(iso);return`${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`;};

  // Zbierz podsumowanie per pracownik
  const summary={};
  const detailRows=[];

  for(const s of sessions){
    const name=s.employees?.name||employees.find(e=>e.id===s.employee_id)?.name||'—';
    const dept=s.employees?.department||employees.find(e=>e.id===s.employee_id)?.department||'—';
    const rate=parseFloat(s.employees?.rate_net||employees.find(e=>e.id===s.employee_id)?.rate_net||0);
    const dateD=new Date(s.clock_in);
    const dateStr=fmtD(s.clock_in);
    const dow=days[dateD.getDay()];
    const brk=s.break_minutes||0;
    const totalMin=s.total_minutes||0;
    const totalH=parseFloat((totalMin/60).toFixed(2));
    detailRows.push([name,dept,dateStr,dow,fmtDT(s.clock_in),fmtDT(s.clock_out),fmtDT(s.break_start),fmtDT(s.break_end),brk,totalH,totalMin]);
    if(!summary[name]) summary[name]={dept,rate,sessions:0,totalMin:0};
    summary[name].sessions++;
    summary[name].totalMin+=totalMin;
  }

  // Buduj arkusz xlsx przez SheetJS
  // Lazy-load SheetJS tylko gdy potrzebny
  if(typeof XLSX==='undefined'){
    showToast('Przygotowywanie…');
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=()=>rej(new Error('Błąd ładowania XLSX'));
      document.head.appendChild(s);
    });
  }
  const wb=XLSX.utils.book_new();

  // Arkusz 1 — Szczegóły
  const headerDetail=['Pracownik','Dział','Data','Dzień tygodnia','Przyjście','Wyjście','Przerwa start','Przerwa koniec','Przerwa (min)','Czas pracy (h)','Czas pracy (min)'];
  const wsDetail=XLSX.utils.aoa_to_sheet([headerDetail,...detailRows]);
  // Szerokości kolumn
  wsDetail['!cols']=[{wch:20},{wch:12},{wch:12},{wch:14},{wch:10},{wch:10},{wch:14},{wch:14},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,wsDetail,'Ewidencja');

  // Arkusz 2 — Podsumowanie
  let grandMin=0,grandCost=0;
  const sumRows=[];
  for(const[name,s] of Object.entries(summary)){
    const h=parseFloat((s.totalMin/60).toFixed(2));
    const cost=parseFloat((s.totalMin/60*s.rate).toFixed(2));
    sumRows.push([name,s.dept,s.sessions,h,s.rate,cost]);
    grandMin+=s.totalMin; grandCost+=s.totalMin/60*s.rate;
  }
  sumRows.push(['ŁĄCZNIE','','',parseFloat((grandMin/60).toFixed(2)),'',parseFloat(grandCost.toFixed(2))]);
  const headerSum=['Pracownik','Dział','Liczba sesji','Łączne godziny','Stawka zł/h','Koszt netto zł'];
  const wsSum=XLSX.utils.aoa_to_sheet([
    ['PODSUMOWANIE MIESIĄCA',mLabel],
    [],
    headerSum,
    ...sumRows
  ]);
  wsSum['!cols']=[{wch:20},{wch:12},{wch:14},{wch:16},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb,wsSum,'Podsumowanie');

  // Pobierz plik
  const fname=`ewidencja-czasu-${mLabel.replace(' ','-')}.xlsx`;
  XLSX.writeFile(wb,fname);
  showToast(`✓ Pobrano ewidencję — ${sessions.length} sesji`);
}

function toLocalDT(isoStr){
  if(!isoStr) return '';
  const d=new Date(isoStr);
  const pad2=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

async function saveSessionEdit(sessId){
  const inVal=document.getElementById('sem-in').value;
  const outVal=document.getElementById('sem-out').value;
  const brkS=document.getElementById('sem-brk-s').value;
  const brkE=document.getElementById('sem-brk-e').value;
  if(!inVal||!outVal){showToast('Podaj obie godziny');return;}
  const body={
    clock_in:new Date(inVal).toISOString(),
    clock_out:new Date(outVal).toISOString(),
    break_start:brkS?new Date(brkS).toISOString():null,
    break_end:brkE?new Date(brkE).toISOString():null
  };
  try{
    const updated=await sbFetch(`/rest/v1/work_sessions?id=eq.${sessId}`,{
      method:'PATCH',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify(body)
    });
    const upd=Array.isArray(updated)?updated[0]:updated;
    workSessions=workSessions.map(s=>s.id===sessId?{...s,...upd}:s);
    document.getElementById('sess-edit-overlay')?.remove();
    showToast('✓ Sesja zaktualizowana');
    renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,80));}
}

async function deleteSession(sessId){
  if(!confirm('Na pewno usunąć tę sesję?')) return;
  try{
    await sbFetch(`/rest/v1/work_sessions?id=eq.${sessId}`,{method:'DELETE'});
    workSessions=workSessions.filter(s=>s.id!==sessId);
    document.getElementById('sess-edit-overlay')?.remove();
    showToast('Sesja usunięta');
    renderView();
  }catch(e){showToast('Błąd: '+e.message.slice(0,80));}
}

function buildLivePanelRows(){
  const activeSessions=workSessions.filter(s=>!s.clock_out);
  const now=Date.now();
  return activeSessions.map(s=>{
    const emp=employees.find(e=>e.id===s.employee_id);
    const name=emp?.name||s.employees?.name||'—';
    const dept=emp?.department||s.employees?.department||'';

    const badgeText=onBreak?'Przerwa':'W pracy';

      :'width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block;margin-right:5px;flex-shrink:0;animation:pulse-live 1.8s ease-in-out infinite;';

      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">

// Uruchomienie timera odświeżającego clock UI
function startClockTimer(){
  clockTimerInterval=setInterval(()=>{
    const tn=document.getElementById('clock-time-now');
    if(tn){const n=new Date();tn.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;}
    updateElapsed();
  },1000);
}

function updateElapsed(){
  if(!activeSession) return;
  const el=document.getElementById('clock-elapsed');
  if(!el) return;
  const onBreak=activeSession.break_start&&!activeSession.break_end;
  const start=onBreak?new Date(activeSession.break_start):new Date(activeSession.clock_in);
  const elapsed=Date.now()-start.getTime();
  el.textContent=(onBreak?'Przerwa: ':'Czas pracy: ')+fmtElapsed(elapsed);
}

function updateClockUI(){
  const mainBtn=document.getElementById('btn-clock-main');
  const elDiv=document.getElementById('clock-elapsed');
  const statusLabel=document.getElementById('clock-status-label');
  const secRow=document.getElementById('clock-secondary-row');
  if(!mainBtn) return;

  mainBtn.disabled=false; // zawsze zdejmuj disabled przy aktualizacji UI
  if(!activeSession){
    mainBtn.className='clock-btn-round state-idle';
    mainBtn.innerHTML=`<svg viewBox="0 0 24 24" stroke="white" fill="white" stroke-width="0"><polygon points="5 3 19 12 5 21 5 3"/></svg>Zacznij`;
    mainBtn.onclick=()=>doClockin();
    if(elDiv){elDiv.style.display='none'; elDiv.textContent='';}
    if(statusLabel){statusLabel.textContent='Naciśnij aby rozpocząć zmianę';}
    if(secRow){secRow.style.display='none'; secRow.innerHTML='';}
  } else if(activeSession.break_start && !activeSession.break_end){
    mainBtn.className='clock-btn-round state-break';
    mainBtn.innerHTML=`<svg viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Wznów`;
    mainBtn.onclick=()=>doEndBreak();
    if(elDiv){elDiv.style.display='block'; updateElapsed();}
    if(statusLabel){statusLabel.textContent='Na przerwie';}
    if(secRow){
      secRow.style.display='flex';
      secRow.innerHTML=`<button class="clock-sec-btn danger" onclick="doClockout()">■ Zakończ zmianę</button>`;
    }
  } else {
    mainBtn.className='clock-btn-round state-working';
    mainBtn.innerHTML=`<svg viewBox="0 0 24 24" stroke="white" fill="none" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Stop`;
    mainBtn.onclick=()=>doClockout();
    if(elDiv){elDiv.style.display='block'; updateElapsed();}
    if(statusLabel){statusLabel.textContent='Zmiana trwa';}
    if(secRow){
      secRow.style.display='flex';
      secRow.innerHTML=`<button class="clock-sec-btn" onclick="doStartBreak()">⏸ Przerwa</button>`;
    }
  }
}

async function updateGeoIndicator(){
  const geo=document.getElementById('clock-geo-status');
  if(!geo) return;
  const result=await checkGeofence();
  if(!geo.isConnected) return;
  if(result.error){
    // Brak dostępu do GPS — ukryj baner
    geo.style.display='none';
  } else if(result.ok){
    geo.style.display='';
    geo.innerHTML=`<span class="clock-geo-ok">● W restauracji</span>`;
  } else {
    geo.style.display='';
    geo.innerHTML=`<span class="clock-geo-err">● Poza restauracją · ${result.dist}m</span>`;
  }
  geo.classList.add('geo-visible');
}

async function doClockin(){
  const emp=getCurrentEmployee();
  if(!emp){showToast('Brak profilu pracownika');return;}

  // Sprawdź GPS najpierw
  const btn=document.getElementById('btn-clock-main');
  if(btn){btn.disabled=true; btn.innerHTML=`<span style="font-size:12px">Sprawdzanie GPS…</span>`;}

  let geoResult={error:'pending'};
  try{ geoResult=await checkGeofence(); }catch(_){}

  if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.origHtml||btn.innerHTML;}
  updateClockUI();

  // Pracownik poza restauracją — ZABLOKUJ
  if(currentRole==='employee' && !geoResult.error && !geoResult.ok){
    showConfirmModal({
      icon:'📍',
      title:'Poza restauracją',
      subtitle:`Jesteś ${geoResult.dist}m od miejsca pracy.\nLogowanie możliwe tylko w restauracji.`,
      confirmText:'OK, rozumiem',
      confirmClass:'',
      onConfirm:()=>{}
    });
    return;
  }

  // GPS niedostępny dla pracownika — też blokuj
  if(currentRole==='employee' && geoResult.error){
    showConfirmModal({
      icon:'📍',
      title:'Brak GPS',
      subtitle:'Nie można sprawdzić lokalizacji. Włącz GPS i spróbuj ponownie.',
      confirmText:'OK',
      confirmClass:'',
      onConfirm:()=>{}
    });
    return;
  }

  // Potwierdzenie rozpoczęcia
  const now=new Date();
  const timeStr=`${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const geoInfo=geoResult.ok?'✅ Lokalizacja potwierdzona':'';
  showConfirmModal({
    icon:'🟢',
    title:'Rozpocząć zmianę?',
    subtitle:`Godzina: ${timeStr}${geoInfo?' · '+geoInfo:''}`,
    confirmText:'Tak, zaczynam pracę',
    confirmClass:'',
    onConfirm: async function(){
      const btn2=document.getElementById('btn-clock-main');
      if(btn2){btn2.disabled=true; btn2.innerHTML=`<span style="font-size:12px">Zapisywanie…</span>`;}
      try{
        const sess=await sbFetch('/rest/v1/work_sessions',{
          method:'POST',
          headers:{'Prefer':'return=representation'},
          body:JSON.stringify({
            employee_id:emp.id,
            clock_in:new Date().toISOString(),
            geo_lat_in:geoResult.lat||null,
            geo_lon_in:geoResult.lon||null
          })
        });
        activeSession=Array.isArray(sess)?sess[0]:sess;
        workSessions.unshift(activeSession);
        showToast('Zmiana rozpoczęta ✓');

// CLOCK OUT
async function doClockout(){
  if(!activeSession){return;}
  const startTime=new Date(activeSession.clock_in);
  const now=new Date();
  const mins=Math.round((now-startTime)/60000);
  const h=Math.floor(mins/60), m=mins%60;
  const durStr=h>0?`${h}h ${m}min`:`${m} min`;

  showConfirmModal({
    icon:'🔴',
    title:'Zakończyć zmianę?',
    subtitle:`Czas pracy: ${durStr}`,
    confirmText:'Tak, kończę pracę',
    confirmClass:'danger',
    onConfirm: async function(){
      try{
        const geo=await checkGeofence();
        const body={clock_out:new Date().toISOString()};
        if(geo.lat){body.geo_lat_out=geo.lat; body.geo_lon_out=geo.lon;}
        const updated=await sbFetch(`/rest/v1/work_sessions?id=eq.${activeSession.id}`,{
          method:'PATCH',
          headers:{'Prefer':'return=representation'},
          body:JSON.stringify(body)
        });
        const upd=Array.isArray(updated)?updated[0]:updated;
        workSessions=workSessions.map(s=>s.id===activeSession.id?{...s,...upd}:s);
        activeSession=null;
        stopShiftNotifTimer();
        showToast('Zmiana zakończona ✓');
        await loadWorkSessions();
        renderView();
      }catch(e){
        showToast('Błąd: '+e.message.slice(0,60));
      }
    }
  });
}

function renderChatMessages(){
  const list=document.getElementById('chat-msgs-list');
  if(!list) return;
  const myEmail=currentUser?.user?.email||currentUser?.email||'';
  if(!chatMessages.length){
    list.innerHTML=`<div class="chat-empty">
      <div style="font-size:36px;margin-bottom:12px">💬</div>
      <div style="font-weight:600;color:var(--text-2);margin-bottom:4px">Chat zespołu</div>
      <div style="font-size:13px">Napisz pierwszą wiadomość do zespołu</div>
    </div>`;
    return;
  }

  let html='';
  let lastDay='';
  const GAP=5*60*1000; // 5 minut = nowa grupa

  chatMessages.forEach((msg,idx)=>{
    const isMe=msg.sender_email===myEmail;
    const empName=msg.employees?.name||msg.sender_email?.split('@')[0]||'?';
    const color=avatarColor(empName);
    const ini=initials(empName);
    const ts=new Date(msg.created_at);
    const day=ts.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
    const time=ts.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
    const tsMs=ts.getTime();

    // Separator dzienny
    if(day!==lastDay){
      html+=`<div class="chat-day-label">${day}</div>`;
      lastDay=day;
    }

    // Sprawdź sąsiadów dla grupowania
    const prev=chatMessages[idx-1];
    const next=chatMessages[idx+1];
    const samePrev=prev&&prev.sender_email===msg.sender_email&&(tsMs-new Date(prev.created_at).getTime())<GAP;
    const sameNext=next&&next.sender_email===msg.sender_email&&(new Date(next.created_at).getTime()-tsMs)<GAP;

    // Klasa kształtu bańki
    let shapeClass='';
    if(samePrev&&sameNext) shapeClass=' in-group';
    else if(samePrev&&!sameNext) shapeClass=' group-last';

    // Czy pokazywać avatar/imię — tylko pierwsza w grupie
    const showMeta=!samePrev;
    // Czy pokazywać godzinę — tylko ostatnia w grupie
    const showTime=!sameNext;

    if(isMe){
      html+=`<div class="chat-bubble-wrap mine${samePrev?' grouped':''}">
        <div class="chat-msg-col">
          <div class="chat-bubble${shapeClass}">${escHtml(msg.content)}${showTime?`<span class="chat-time-inline">${time}</span>`:''}</div>
        </div>
      </div>`;
    } else {
      html+=`<div class="chat-bubble-wrap${samePrev?' grouped':''}">
        <div class="chat-av-col">
          ${showMeta?`<div class="chat-av" style="background:${color}">${ini}</div>`:`<div class="chat-av-placeholder"></div>`}
        </div>
        <div class="chat-msg-col">
          ${showMeta?`<div class="chat-sender">${escHtml(empName)}</div>`:''}
          <div class="chat-bubble other${shapeClass}">${escHtml(msg.content)}${showTime?`<span class="chat-time-inline" style="color:var(--text-3)">${time}</span>`:''}</div>
        </div>
      </div>`;
    }
  });
  list.innerHTML=html;
}

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendChatMsg(){
  const inp=document.getElementById('chat-input');
  if(!inp) return;
  const content=inp.value.trim();
  if(!content) return;
  inp.value=''; inp.style.height='auto';

  const emp=getCurrentEmployee();
  const myEmail=currentUser?.user?.email||currentUser?.email||'';
  // Optymistycznie dodaj wiadomość lokalnie od razu
  const tempMsg={id:'temp-'+Date.now(),content,sender_email:myEmail,
    created_at:new Date().toISOString(),
    employees:{name:emp?.name||myEmail.split('@')[0],department:emp?.department}};
  chatMessages.push(tempMsg);
  renderChatMessages();
  setTimeout(()=>{const list=document.getElementById('chat-msgs-list');if(list)list.scrollTop=list.scrollHeight;},30);

  try{
    const msg=await sbFetch('/rest/v1/team_messages',{
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body:JSON.stringify({
        content,
        sender_email:myEmail,
        employee_id:emp?.id||null
      })
    });
    // Podmień temp na prawdziwy rekord
    const newMsg=Array.isArray(msg)?msg[0]:msg;
    if(newMsg?.id){
      newMsg.sender_email=myEmail;
      newMsg.employees={name:emp?.name||myEmail.split('@')[0],department:emp?.department};
      const idx=chatMessages.findIndex(m=>m.id===tempMsg.id);
      if(idx>=0) chatMessages[idx]=newMsg;
      else chatMessages.push(newMsg);
      renderChatMessages();
    }
  }catch(e){
    console.error('Chat send error:',e);
    // Zostaw wiadomość lokalnie (działa jako local-only chat)
    // Zapisz cache żeby inni na tym urządzeniu widzieli
    try{localStorage.setItem('chatCache',JSON.stringify(chatMessages));}catch(_){}
    if(e.message&&(e.message.includes('relation')||e.message.includes('does not exist')||e.message.includes('42P01'))){
      showToast('Czat działa lokalnie — skontaktuj się z administratorem');
    } else {
      showToast('Błąd: '+e.message.slice(0,60));
    }
  }
}

  if(!currentUser) return;
  try{

/* ═══════════════════════════════════════════════
   PULL TO REFRESH
═══════════════════════════════════════════════ */
(function setupPTR(){
  let startY=0, pulling=false, threshold=60;
  const mc=()=>document.getElementById('main-content');

  document.addEventListener('touchstart',e=>{
    const el=mc();
    if(el&&el.scrollTop===0) startY=e.touches[0].clientY;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    const el=mc(); if(!el) return;
    if(el.scrollTop>0){startY=0;return;}
    const dy=e.touches[0].clientY-startY;
    if(dy>8&&startY>0){
      pulling=true;
      let ind=document.getElementById('ptr-ind');
      if(!ind){
        ind=document.createElement('div');
        ind.id='ptr-ind'; ind.className='ptr-indicator';
        ind.innerHTML=`<div class="ptr-spinner"></div>`;
        el.prepend(ind);
      }
      // Elastyczny opór — im dalej, tym wolniej
      const resistance=Math.min(dy*0.5, threshold*1.2);
      ind.style.height=(resistance>threshold?'48px':'0');
      ind.classList.toggle('visible', dy>threshold);
    }
  },{passive:true});

  document.addEventListener('touchend',async e=>{
    if(!pulling) return; pulling=false;
    const ind=document.getElementById('ptr-ind');
    const dy=e.changedTouches[0].clientY-startY;
    if(dy>threshold){
      if(ind) ind.classList.add('visible');
      await loadAllData();
      const curView=currentView;
      if(curView) showView(curView);
      // Bez toastu — samo odświeżenie jest oczywiste
    }
    if(ind){ ind.classList.remove('visible'); setTimeout(()=>ind.remove(),250); }
    startY=0;
  });
})();

// PWA — rejestracja service workera
if ('serviceWorker' in navigator) {

      const reg = await navigator.serviceWorker.register('/sw.js?v=176');
      reg.update();
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW?.addEventListener('statechange', () => {
          if (newSW.state === 'installed') {
            newSW.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {

      });

// POWIADOMIENIA — czas aktywnej zmiany co godzinę
async function requestNotifPermission(){
  if(!('Notification' in window)) return false;
  if(Notification.permission==='granted') return true;
  const p=await Notification.requestPermission();
  return p==='granted';
}

function sendShiftNotification(durationMin){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  // Preferuj SW notification (działa też gdy app w tle)
  if(navigator.serviceWorker?.controller){
    navigator.serviceWorker.controller.postMessage({type:'SHIFT_NOTIFICATION',duration:durationMin});
  } else {
    const h=Math.floor(durationMin/60), m=durationMin%60;
    const timeStr=h>0?`${h}h ${m}min`:`${m} min`;
    try{new Notification(`⏱ Osteria – zmiana trwa ${timeStr}`,{body:'Pamiętaj o przerwie!',icon:'/icon-192.png',tag:'shift-timer'});}catch(_){}
  }
}

// Uruchom timer powiadomień gdy zmiana aktywna
let _notifInterval=null;
function startShiftNotifTimer(){
  stopShiftNotifTimer();
  if(!activeSession) return;
  requestNotifPermission();
  // Co 60 minut wyślij powiadomienie
  _notifInterval=setInterval(()=>{
    if(!activeSession) return stopShiftNotifTimer();
    const startMs=new Date(activeSession.clock_in).getTime();
    const durationMin=Math.floor((Date.now()-startMs)/60000);
    sendShiftNotification(durationMin);
  }, 60*60*1000);
}
function stopShiftNotifTimer(){
  if(_notifInterval){clearInterval(_notifInterval);_notifInterval=null;}
}

let financeMonthOffset = 0; // 0 = bieżący miesiąc

async function renderFinance(mc){
  if(!mc) mc=document.getElementById('main-content');
  if(!mc) return;

  const now = new Date();
  const mo = new Date(now.getFullYear(), now.getMonth() + financeMonthOffset, 1);
  const y = mo.getFullYear();
  const m = mo.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const from = `${y}-${pad(m+1)}-01`;
  const lastDay = new Date(y, m+1, 0).getDate();
  const to = `${y}-${pad(m+1)}-${pad(lastDay)}`;
  const monthLabel = mo.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  const isCurrentMonth = financeMonthOffset === 0;

  // Pobierz dane finansowe
  let revenues = [];
  try {
    revenues = await sbFetch(`/rest/v1/daily_revenue?date=gte.${from}&date=lte.${to}&order=date.asc`);
    if(!Array.isArray(revenues)) revenues=[];
  } catch(_){}

  // Pobierz sesje pracy (do kosztu personelu)
  let wSessions = [];
  try {
    wSessions = await sbFetch(`/rest/v1/work_sessions?select=*,employees(name,department,rate_net)&clock_in=gte.${from}T00:00:00&clock_in=lte.${to}T23:59:59&clock_out=not.is.null`);
    if(!Array.isArray(wSessions)) wSessions=[];
  } catch(_){}

  // Sumy
  const totalCash = revenues.reduce((a,r)=>a+parseFloat(r.revenue_cash||0),0);
  const totalCard = revenues.reduce((a,r)=>a+parseFloat(r.revenue_card||0),0);
  const totalRev  = totalCash + totalCard;
  const totalCovers = revenues.reduce((a,r)=>a+parseInt(r.covers||0),0);
  const avgCover  = totalCovers>0 ? totalRev/totalCovers : 0;

  // Koszt pracy
  let totalLaborCost = 0;
  for(const s of wSessions){
    const rate = parseFloat(s.employees?.rate_net || employees.find(e=>e.id===s.employee_id)?.rate_net || 0);
    const mins = s.total_minutes || 0;
    totalLaborCost += rate * (mins/60);
  }

  const laborPct = totalRev>0 ? (totalLaborCost/totalRev*100) : 0;
  const margin = totalRev - totalLaborCost;

  // Dane dzisiejsze

async function saveRevenue(dateStr){
  const cash = parseFloat(document.getElementById('rev-cash')?.value||0)||0;
  const card = parseFloat(document.getElementById('rev-card')?.value||0)||0;
  const covers = parseInt(document.getElementById('rev-covers')?.value||0)||0;
  const note = document.getElementById('rev-note')?.value?.trim()||null;

  try {
    // UPSERT przez POST z header Prefer: resolution=merge-duplicates
    const r = await fetch(`${SB_URL}/rest/v1/daily_revenue`, {
      method:'POST',
      headers:{
        ...getSBHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'})
      },
      body: JSON.stringify({date:dateStr, revenue_cash:cash, revenue_card:card, covers, note, source:'manual', updated_at:new Date().toISOString()})
    });
    if(r.ok||r.status===201||r.status===200){
      document.getElementById('revenue-modal')?.remove();
      showToast('Zapisano utarg ✓');
      renderFinance(document.getElementById('main-content'));
    } else {
      const t=await r.text();
      showToast('Błąd zapisu: '+t.slice(0,60), 3000, true);
    }
  } catch(e){
    showToast('Błąd: '+e.message.slice(0,50), 3000, true);
  }
}

async function handlePosbistroFile(file){
  if(!file) return;
  const statusEl=document.getElementById('posbistro-import-status');
  if(statusEl) statusEl.innerHTML=`<div style="color:var(--text-2);font-size:13px">Czytam plik…</div>`;

  const text=await file.text();
  const rows=parsePosbistroCSV(text);

  if(!rows.length){
    if(statusEl) statusEl.innerHTML=`<div style="color:var(--danger);font-size:13px">Nie rozpoznano formatu CSV. Sprawdź czy to eksport z POSbistro/POSowner.</div>`;
    return;
  }

  if(statusEl) statusEl.innerHTML=`<div style="color:var(--text-2);font-size:13px">Znaleziono ${rows.length} dni. Zapisuję…</div>`;

  let saved=0, failed=0;
  for(const row of rows){
    try{
      const r=await fetch(`${SB_URL}/rest/v1/daily_revenue`,{
        method:'POST',
        headers:getSBHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
        body:JSON.stringify({
          date:row.date,
          revenue_cash:row.cash,
          revenue_card:row.card,
          covers:row.covers||null,
          source:'posbistro_csv',
          updated_at:new Date().toISOString()
        })
      });
      if(r.ok||r.status===201||r.status===200) saved++;
      else failed++;
    }catch(_){ failed++; }
  }

  if(statusEl) statusEl.innerHTML=`
    <div style="background:${failed===0?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)'};border-radius:10px;padding:12px;text-align:center">
      <div style="font-size:18px;font-weight:800;color:${failed===0?'var(--green)':'var(--warn)'}">${saved} dni zapisanych</div>
      ${failed>0?`<div style="font-size:12px;color:var(--danger);margin-top:2px">${failed} błędów</div>`:''}
      ${saved>0?`<div style="font-size:12px;color:var(--text-3);margin-top:4px">Odśwież widok finansów</div>`:''}
    </div>`;

  if(saved>0){
    setTimeout(()=>{
      document.getElementById('posbistro-import-modal')?.remove();
      renderFinance(document.getElementById('main-content'));
    },1800);
  }
}

function parsePosbistroCSV(text){
  /* Obsługuje kilka formatów eksportu POSbistro/POSowner:
     1. Raport sprzedaży dzienny (kolumny: Data, Gotówka, Karta, Suma, Liczba transakcji itd.)
     2. Format z separatorem ; lub ,
     3. Dowolna kolejność kolumn — detekcja po nagłówkach
  */
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];

  // Wykryj separator
  const sep=lines[0].includes(';')?';':',';

  const headers=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());

  // Mapowanie nagłówków
  const idx={};
  const matchers={
    date:    ['data','date','dzień','dzien','day'],
    cash:    ['gotówka','gotowka','cash','płatność gotówką','platnosc gotowka','utarg gotówka','utarg gotowka','got.'],
    card:    ['karta','card','płatność kartą','platnosc karta','utarg karta','terminal'],
    total:   ['suma','total','przychód','przychod','obrót','obrot','utarg','sprzedaż netto','sprzedaz netto','sprzedaż','sprzedaz'],
    covers:  ['goście','goscie','covers','osoby','liczba gości','liczba gosci','transactions','liczba transakcji','transakcje'],
  };

  for(const [key,words] of Object.entries(matchers)){
    for(let i=0;i<headers.length;i++){
      if(words.some(w=>headers[i].includes(w))){
        if(idx[key]===undefined) idx[key]=i;
      }
    }
  }

  if(idx.date===undefined) return [];

  const results=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
    if(!cols[idx.date]||cols[idx.date].length<8) continue;

    // Parsuj datę (DD.MM.YYYY lub YYYY-MM-DD)
    let dateStr=cols[idx.date];
    if(/^\d{2}\.\d{2}\.\d{4}$/.test(dateStr)){
      const [d,m,y]=dateStr.split('.');
      dateStr=`${y}-${m}-${d}`;
    } else if(/^\d{4}-\d{2}-\d{2}/.test(dateStr)){
      dateStr=dateStr.slice(0,10);
    } else continue;

    const parseAmt=s=>{
      if(!s) return 0;
      return parseFloat(s.replace(/\s/g,'').replace(',','.').replace(/[^\d.-]/g,''))||0;
    };

    let cash=idx.cash!==undefined?parseAmt(cols[idx.cash]):0;
    let card=idx.card!==undefined?parseAmt(cols[idx.card]):0;
    const total=idx.total!==undefined?parseAmt(cols[idx.total]):0;

    // Jeśli mamy tylko total bez podziału gotówka/karta
    if(!cash&&!card&&total>0) cash=total;
    // Jeśli total != cash+card, sprawdź czy total to suma
    if(total>0&&(cash+card)>total*1.01) cash=0,card=total;

    const covers=idx.covers!==undefined?parseInt(parseAmt(cols[idx.covers]))||null:null;

    if(cash+card>0) results.push({date:dateStr,cash,card,covers});
  }
  return results;
}

let tardinessMonthOffset = 0;

async function renderTardiness(mc){
  if(!mc) mc=document.getElementById('main-content');
  if(!mc) return;

  const now = new Date();
  const mo = new Date(now.getFullYear(), now.getMonth() + tardinessMonthOffset, 1);
  const y = mo.getFullYear(), m = mo.getMonth();
  const pad = n=>String(n).padStart(2,'0');
  const from = `${y}-${pad(m+1)}-01`;
  const lastDay = new Date(y,m+1,0).getDate();
  const to   = `${y}-${pad(m+1)}-${pad(lastDay)}`;
  const monthLabel = mo.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});

  // Pobierz sesje pracy z tego miesiąca
  let wSessions=[], monthShifts=[];
  try {
    wSessions = await sbFetch(`/rest/v1/work_sessions?select=*,employees(name,department)&clock_in=gte.${from}T00:00:00&clock_in=lte.${to}T23:59:59&order=clock_in.asc`);
    if(!Array.isArray(wSessions)) wSessions=[];
  } catch(_){}
  try {
    monthShifts = await sbFetch(`/rest/v1/shifts?select=*&date=gte.${from}&date=lte.${to}`);
    if(!Array.isArray(monthShifts)) monthShifts=[];
  } catch(_){}

  // Oblicz spóźnienia: porównaj clock_in z shifts.start_time
  // Spóźnienie = clock_in > start_time + 5 min grace period
  const GRACE = 5; // minuty
  const tardyEvents = [];

  for(const s of wSessions){
    if(!s.clock_in || !s.employee_id) continue;
    const clockDate = s.clock_in.slice(0,10);
    const shift = monthShifts.find(sh=>sh.employee_id===s.employee_id && sh.date===clockDate);
    if(!shift || !shift.start_time) continue;

    const shiftStart = new Date(`${clockDate}T${shift.start_time}`);
    const clockIn    = new Date(s.clock_in);
    const diffMin    = Math.round((clockIn - shiftStart)/60000);

    if(diffMin > GRACE){
      const empName = s.employees?.name || employees.find(e=>e.id===s.employee_id)?.name || '—';
      const dept    = s.employees?.department || employees.find(e=>e.id===s.employee_id)?.department || '';
      tardyEvents.push({
        empId: s.employee_id,
        empName,
        dept,
        date: clockDate,
        shiftStart: shift.start_time.slice(0,5),
        clockIn: s.clock_in,
        diffMin
      });
    }
  }

  // Statystyki per pracownik
  const byEmp = {};
  for(const ev of tardyEvents){
    if(!byEmp[ev.empId]) byEmp[ev.empId]={name:ev.empName, dept:ev.dept, count:0, totalMin:0, worst:0, events:[]};
    byEmp[ev.empId].count++;
    byEmp[ev.empId].totalMin += ev.diffMin;
    byEmp[ev.empId].worst = Math.max(byEmp[ev.empId].worst, ev.diffMin);
    byEmp[ev.empId].events.push(ev);
  }
  const empList = Object.values(byEmp).sort((a,b)=>b.count-a.count||b.totalMin-a.totalMin);

  // Nieobecności: pracownik miał zmianę ale brak sesji
  const absences = [];
  const todayStr = today();
  for(const sh of monthShifts){
    if(sh.date > todayStr) continue; // przyszłość pomiń
    const hasSession = wSessions.some(s=>s.employee_id===sh.employee_id && s.clock_in?.startsWith(sh.date));
    if(!hasSession){
      const emp = employees.find(e=>e.id===sh.employee_id);
      if(emp) absences.push({empName:emp.name, dept:emp.department, date:sh.date, start:sh.start_time?.slice(0,5)||'?'});
    }
  }
  absences.sort((a,b)=>b.date.localeCompare(a.date));

  const fmtDate2 = ds => {
    const d=new Date(ds+'T12:00:00');
    return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
  };
  const fmtMin = m => m>=60 ? `${Math.floor(m/60)}g ${m%60}min` : `${m} min`;

  // HTML rankingu
  const rankHTML = empList.length===0
    ? `<div style="padding:24px;text-align:center;color:var(--green);font-size:13px;font-weight:700">✓ Brak spóźnień w tym miesiącu</div>`
    : empList.map((e,i)=>`
      <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-2)">
        <div style="width:28px;height:28px;border-radius:50%;background:${i===0?'var(--danger-bg)':i===1?'rgba(251,191,36,.12)':'var(--bg-card2)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:${i===0?'var(--danger)':i===1?'var(--warn)':'var(--text-3)'}">${i+1}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:700;color:var(--text)">${e.name}</div>
          <div style="font-size:11px;color:var(--text-3);text-transform:capitalize">${e.dept}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:800;color:var(--danger)">${e.count}×</div>
          <div style="font-size:11px;color:var(--text-3)">śr. ${fmtMin(Math.round(e.totalMin/e.count))}</div>
        </div>
      </div>`).join('');

  // Szczegóły zdarzeń
  const eventsHTML = tardyEvents.length===0 ? '' : `
    <div style="background:var(--bg-card);border-radius:14px;padding:0 14px;border:1px solid var(--border-2);margin-top:12px">
      <div style="font-size:11px;color:var(--text-3);padding:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Wszystkie zdarzenia</div>
      ${[...tardyEvents].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(ev=>`
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-2)">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:var(--text)">${ev.empName}</div>
          <div style="font-size:11px;color:var(--text-3)">${fmtDate2(ev.date)} · zmiana ${ev.shiftStart}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:14px;font-weight:800;color:var(--danger)">+${fmtMin(ev.diffMin)}</div>
          <div style="font-size:11px;color:var(--text-3)">przyszedł ${new Date(ev.clockIn).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>`).join('')}
    </div>`;

  // Nieobecności HTML
  const absHTML = absences.length===0
    ? `<div style="padding:16px;text-align:center;color:var(--green);font-size:13px;font-weight:700">✓ Brak nieobecności</div>`
    : absences.slice(0,20).map(a=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-2)">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--text)">${a.empName}</div>
        <div style="font-size:11px;color:var(--text-3);text-transform:capitalize">${a.dept}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--warn);font-weight:700">${fmtDate2(a.date)}</div>
        <div style="font-size:11px;color:var(--text-3)">zmiana od ${a.start}</div>
      </div>
    </div>`).join('');

  mc.innerHTML = `
  <div style="min-height:100dvh;padding-bottom:80px">
    <div class="page-bar" style="display:flex;align-items:center;justify-content:space-between;padding:0 16px">
      <button class="section-back-btn" onclick="showView('home')" style="margin:0">‹</button>
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="tardinessMonthOffset--;renderTardiness()" style="background:none;border:none;color:var(--text-2);font-size:20px;padding:4px 8px;cursor:pointer">‹</button>
        <div style="font-size:14px;font-weight:700;color:var(--text);min-width:120px;text-align:center;text-transform:capitalize">${monthLabel}</div>
        <button onclick="tardinessMonthOffset++;if(tardinessMonthOffset>0)tardinessMonthOffset=0;renderTardiness()" style="background:none;border:none;color:${tardinessMonthOffset<0?'var(--text-2)':'var(--text-3)'};font-size:20px;padding:4px 8px;cursor:pointer">›</button>
      </div>
      <div style="width:60px"></div>
    </div>

    <div style="padding:0 16px;margin-top:8px">
      <!-- Karty podsumowania -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:var(--bg-card);border-radius:14px;padding:12px 10px;border:1px solid var(--border-2);text-align:center">
          <div style="font-size:24px;font-weight:800;color:${tardyEvents.length>0?'var(--danger)':'var(--green)'}">${tardyEvents.length}</div>
          <div style="font-size:10px;color:var(--text-3);margin-top:2px">spóźnień</div>
        </div>
        <div style="background:var(--bg-card);border-radius:14px;padding:12px 10px;border:1px solid var(--border-2);text-align:center">
          <div style="font-size:24px;font-weight:800;color:${absences.length>0?'var(--warn)':'var(--green)'}">${absences.length}</div>
          <div style="font-size:10px;color:var(--text-3);margin-top:2px">nieobecności</div>
        </div>
        <div style="background:var(--bg-card);border-radius:14px;padding:12px 10px;border:1px solid var(--border-2);text-align:center">
          <div style="font-size:24px;font-weight:800;color:var(--text)">${empList.length}</div>
          <div style="font-size:10px;color:var(--text-3);margin-top:2px">pracowników</div>
        </div>
      </div>

      <!-- Ranking spóźnień -->
      <div style="background:var(--bg-card);border-radius:14px;padding:0 14px;border:1px solid var(--border-2);margin-bottom:12px">
        <div style="font-size:11px;color:var(--text-3);padding:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Ranking spóźnień</div>
        ${rankHTML}
      </div>

      <!-- Nieobecności -->
      <div style="background:var(--bg-card);border-radius:14px;padding:0 14px;border:1px solid var(--border-2);margin-bottom:12px">
        <div style="font-size:11px;color:var(--text-3);padding:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Nieobecności (zmiana bez meldowania)</div>
        ${absHTML}
      </div>

      ${eventsHTML}
    </div>
  </div>`;
}

</script>
</body>
</html>
