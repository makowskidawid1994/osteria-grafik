<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Osteria Antonina</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7A1E17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osteria">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* ═══ OSTERIA — bordeaux czerwień z pomarańczowym akcentem ═══ */
  --brand: #E03520;
  --brand-dark: #A01800;
  --brand-light: #F05030;
  --brand-soft: rgba(220,50,20,.18);
  --brand-mid: rgba(220,50,20,.28);
  --accent: #F05030;
  --accent-hover: #C03010;
  --accent-soft: rgba(220,50,20,.15);
  --bg: transparent;
  --bg-solid: #3D0E0C;
  --bg-card: rgba(255,255,255,.07);
  --bg-card2: rgba(255,255,255,.04);
  --surface: rgba(255,255,255,.05);
  --border: rgba(255,255,255,.10);
  --border-2: rgba(255,255,255,.06);
  --card-shadow: 0 2px 12px rgba(0,0,0,.2);
  --glass: rgba(255,255,255,.07);
  --glass-blur: blur(20px);
  --text: #ffffff;
  --text-2: rgba(255,255,255,.75);
  --text-3: rgba(255,255,255,.45);
  --danger: #F87171;
  --danger-bg: rgba(220,38,38,.2);
  --warn: #FBBF24;
  --green: #34D399;
  --green-bg: rgba(52,211,153,.15);
  --red-soft: rgba(220,38,38,.15);
  --radius: 12px;
  --radius-lg: 16px;
  --font: 'DM Sans', -apple-system, 'Segoe UI', sans-serif;
  --shadow-sm: 0 1px 4px rgba(0,0,0,.3);
  --shadow: 0 2px 12px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font); color: var(--text);
  min-height: 100vh; font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
/* ═══ TŁO — bordeaux gradient jak Revolut (spójny, nie kontrastowy) ═══ */
body {
  background:
    linear-gradient(180deg, #8B1A10 0%, #5A100A 35%, #3A0A07 65%, #200608 100%) fixed;
}
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 120% 50% at 50% 0%, rgba(200,50,30,.35) 0%, transparent 55%),
    radial-gradient(ellipse 80% 40% at 15% 20%, rgba(180,40,20,.15) 0%, transparent 50%);
}

/* Wrappery widoków — zawsze transparent */
#main-content > div:first-child { background: transparent !important; }
#app { background: transparent; }

/* ─── AUTH — pełny ekran ─── */
#auth-screen {
  min-height: 100dvh; height: 100dvh;
  display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
  padding: 0; position: relative; overflow: hidden;
  background: #200810;
}

/* Gradient logowania — ciepłe bordo */
.auth-bg-gradient {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(160deg, #3D1020 0%, #200810 50%, #120408 100%);
}
.auth-bg-gradient::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 90% 60% at 20% 15%, rgba(200,60,30,.22) 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 80% 5%, rgba(150,30,50,.3) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 95%, rgba(240,180,100,.06) 0%, transparent 50%);
}
.auth-bg-pattern { display: none; }

/* Górna część — logo + nazwa */
.auth-top {
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: max(env(safe-area-inset-top), 60px) 36px 40px;
  position: relative; z-index: 2;
  flex: 1;
  /* Stały layout — zapobiega skakaniu przy załadowaniu fontu */
  min-height: 260px;
}

/* Logo — okrąg z ikoną jak w ref */
.auth-logo-wrap {
  width: 90px; height: 90px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  position: relative;
  background: rgba(240,90,40,.15);
  border: 2px solid rgba(240,90,40,.35);
}
.auth-logo-wrap::before {
  content: '';
  position: absolute; inset: -8px; border-radius: 50%;
  border: 1px solid rgba(240,90,40,.12);
}
.auth-logo-wrap::after { display: none; }
.auth-logo-monogram {
  font-size: 32px; font-weight: 800; color: #F05A28;
  letter-spacing: -1.5px; line-height: 1;
}
.auth-logo-wrap img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
}
.auth-avatar-icon {
  display: block;
  width: 44px; height: 44px; opacity: .9;
  stroke: #F05A28;
}

/* Nazwa restauracji — duży, biały */
.auth-app-name { display: none; }
.auth-restaurant-name {
  font-size: 36px; font-weight: 800; letter-spacing: -1.5px;
  color: #fff; text-align: center; line-height: 1.0;
  margin-bottom: 6px;
  font-family: 'Inter',sans-serif;
  min-height: 36px;
}
.auth-tagline {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.3);
  text-align: center; letter-spacing: .3px;
  line-height: 1.4; min-height: 18px;
  font-family: 'Inter',sans-serif;
}
.auth-divider { display: none; }

/* Formularz — dolna część ekranu */
.auth-sheet {
  position: relative; z-index: 2;
  width: 100%;
  background: transparent;
  border-radius: 0;
  border-top: none;
  box-shadow: none;
  padding: 24px 32px calc(max(env(safe-area-inset-bottom), 20px) + 28px);
}
.auth-sheet-handle { display: none; }
.auth-sheet-title { display: none; }
.auth-sheet-sub { display: none; }

/* Pola — podkreślenie jak w ref, nie box */
.field { margin-bottom: 20px; position: relative; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,.35); margin-bottom: 10px; letter-spacing: 1px;
  text-transform: uppercase;
  font-family: 'Inter',sans-serif;
}
.field input {
  width: 100%; padding: 14px 16px 14px 44px;
  border: none;
  border-bottom: 1.5px solid rgba(255,255,255,.10);
  border-radius: 0;
  font-size: 17px; font-weight: 600; font-family: var(--font); outline: none;
  color: #fff; caret-color: #C85A28;
  background: transparent;
  transition: border-color .2s;
}
.field input::placeholder { color: rgba(255,255,255,.12); }
.field input:focus {
  border-bottom-color: #F05A28;
  background: transparent;
  box-shadow: none;
}
.field-icon {
  position: absolute; left: 0; bottom: 12px;
  width: 18px; height: 18px;
  stroke: rgba(255,255,255,.35); fill: none; stroke-width: 1.8;
  pointer-events: none;
}

/* Przycisk — gradient Osterii, pełna szerokość */
.btn-login {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #F05A28 0%, #C0391A 100%);
  color: white; border: none; border-radius: 50px;
  font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 24px;
  font-family: var(--font); letter-spacing: .3px; transition: all .18s;
  box-shadow: 0 8px 28px rgba(240,90,40,.4);
  text-transform: uppercase;
}
.btn-login:active { transform: scale(.97); box-shadow: 0 4px 14px rgba(240,90,40,.3); }

.auth-err {
  color: #FCA5A5; font-size: 12px; margin-top: 12px; text-align: center;
  display: none; padding: 10px;
  background: rgba(239,68,68,.12); border-radius: 10px;
  border: 1px solid rgba(239,68,68,.2);
}

/* ─── App shell ─── */
#app { display: none; }
/* Header ukryty — zastąpiony przez .sub-topbar w każdym widoku */
.header {
  display: none !important;
}

/* Floating topbar — fixed, transparent, zawsze na wierzchu substron */
#sub-topbar {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: calc(env(safe-area-inset-top) + 10px) 20px 10px;
  background: transparent;
  align-items: center; justify-content: space-between;
  pointer-events: none;
}
#sub-topbar > * { pointer-events: auto; }
body:not(.view-home) #sub-topbar { display: flex; }
.sub-topbar-brand {
  font-size: 17px; font-weight: 900; letter-spacing: -0.5px;
  color: rgba(255,255,255,.9); display: flex; align-items: center; gap: 6px;
}
.sub-topbar-brand em { font-style: normal; font-weight: 400; color: rgba(255,255,255,.45); font-size: 15px; }
.sub-topbar-dot { width: 6px; height: 6px; border-radius: 50%; background: #e53935; flex-shrink: 0; }
.sub-topbar-right { display: flex; align-items: center; gap: 8px; }
.sub-topbar-role {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.55);
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  padding: 3px 9px; border-radius: 20px; letter-spacing: .3px; text-transform: uppercase;
}
.sub-topbar-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #e53935, #b71c1c);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff; cursor: pointer;
  border: 2px solid rgba(255,255,255,.2);
}
/* Kompensata za floating sub-topbar */
.main {
  padding-top: calc(env(safe-area-inset-top) + 54px);
}
/* Na home — floating nav */
/* (duplikat usunięty, patrz poniżej) */

/* Na home — header ukryty, hw-wrap ma własny topbar */
body.view-home .header {
  display: none;
}
body.view-home .header-brand { color: rgba(255,255,255,.95); }
body.view-home .header-brand em { color: rgba(255,255,255,.5); }
body.view-home .header-brand-dot { background: rgba(255,255,255,.7); }
body.view-home .role-badge { background: rgba(255,255,255,.07); color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.08); }
body.view-home .header-avatar { border: 1.5px solid rgba(255,255,255,.12); }
body.view-home #main-content {
  background: transparent;
  min-height: 100dvh !important;
  padding: 0 !important;
  margin: 0 !important;
}

/* Bottom nav na home — Revolut-style chmurka */
body.view-home .bnav {
  background: rgba(15,10,9,.75);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
body.view-home .bnav-item { color: rgba(255,255,255,.4); }
body.view-home .bnav-item svg { stroke: rgba(255,255,255,.4); }
body.view-home .bnav-item.active { color: #fff; font-weight: 600; }
body.view-home .bnav-item.active svg { stroke: #E05030; }
body.view-home .bnav-item.active .bnav-icon-wrap { background: rgba(200,50,35,.2); border-radius: 14px; }

.header-brand { font-size: 15px; font-weight: 800; flex: 1; letter-spacing: -.5px; color: var(--text); display: flex; align-items: center; gap: 6px; transition: color .2s; }
.header-brand em { color: var(--text-3); font-style: normal; font-weight: 400; transition: color .2s; }
.header-brand-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
.header-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--brand);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: white; letter-spacing: -.3px; cursor: pointer;
  flex-shrink: 0; border: 2px solid var(--brand-mid); transition: border-color .2s;
}
.role-badge {
  font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  background: var(--accent-soft); color: var(--text-2); letter-spacing: .1px; border: 1px solid var(--border);
  transition: background .2s, color .2s, border-color .2s;
}
.header-name { font-size: 12px; color: var(--text-3); display: none; }
.btn-out {
  font-size: 11px; color: var(--text-3); background: none; border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 20px; cursor: pointer; font-family: var(--font);
  transition: all .12s; font-weight: 500;
}
.btn-out:hover { color: var(--text-2); border-color: var(--border-2); }

/* ─── Bottom nav — app style ─── */
/* ── Floating bottom nav (FB/IG chmurka) ── */
.bnav {
  position: fixed;
  bottom: max(env(safe-area-inset-bottom), 12px);
  left: 16px; right: 16px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.3);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex; z-index: 100;
  padding: 8px 4px;
  height: 60px;
}
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: rgba(255,255,255,.4); font-size: 10px; font-weight: 500;
  border: none; background: none; font-family: var(--font);
  transition: color .2s, transform .12s cubic-bezier(.2,.8,.2,1);
  position: relative; padding: 0 4px; letter-spacing: -.1px;
}
.bnav-item:active { transform: scale(.9); }
.bnav-item.active { color: #fff; }
.bnav-item.active .bnav-icon-wrap { background: rgba(255,255,255,.07); }
.bnav-item.active svg { stroke: #fff; }
.bnav-icon-wrap {
  width: 44px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 14px; transition: background .2s;
}
.bnav-item svg { width: 22px; height: 22px; stroke: rgba(255,255,255,.4); fill: none; stroke-width: 1.8; transition: stroke .2s; }

.main { padding-top: calc(env(safe-area-inset-top) + 54px); padding-bottom: calc(60px + max(env(safe-area-inset-bottom), 12px) + 20px); min-height: 100dvh; background: transparent; position: relative; z-index: 1; }
.main.no-bnav { padding-bottom: 0; }
/* Chat wypełnia dostępną przestrzeń */
.main.chat-view { display: flex; flex-direction: column; height: 100dvh; min-height: 0; padding-bottom: 0; overflow: hidden; box-sizing: border-box; }
.main.view-transition { animation: viewFadeIn .5s cubic-bezier(.16,1,.3,1) both; }
@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ════════════════════════════════════════
   HOME SCREEN
════════════════════════════════════════ */

/* ── Tło aplikacji ── */
/* ═══════════════════════════════════
   HOME SCREEN — dark bordo, lista Revolut-style
═══════════════════════════════════ */
/* ═══════════════════════════════════════
   HOME SCREEN — Revolut-style layout
   Hero górne ~40% ekranu z gradientem
   Lista kafelków wypełnia resztę
   ═══════════════════════════════════════ */

/* Wrapper — cały ekran (header ukryty na home, więc 100dvh) */
.hw-wrap {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  background: transparent;
  overflow: hidden;
  overflow-y: auto;
}

/* Górny pasek — Revolut style */
.hw-topbar {
  position: relative; z-index: 2;
  padding: calc(env(safe-area-inset-top) + 20px) 20px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.hw-topbar-left {
  display: flex; flex-direction: column;
}
.hw-greeting-text {
  font-size: 13px; font-weight: 400; color: rgba(255,255,255,.45);
  letter-spacing: 0;
}
.hw-name-text {
  font-size: 22px; font-weight: 700; color: #fff;
  letter-spacing: -.5px; margin-top: 2px;
}
.hw-hero-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(145deg, #C03020, #8B1A10);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff;
  flex-shrink: 0; cursor: pointer;
  border: none;
  box-shadow: 0 2px 10px rgba(0,0,0,.4);
}
.hw-role-pill { display: none; }

/* Home — cały ekran podzielony: hero karta górna, kafelki dolne */
.hw-hero {
  position: relative; z-index: 1;
  flex: 1;
  display: flex; flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 76px);
}
.hw-hero::before { content: none; }
.hw-wrap::before { content: none; }

/* Hero karta — kompaktowa, nie zajmuje połowy ekranu */
.hw-center-block {
  display: flex; flex-direction: column; align-items: flex-start;
  justify-content: space-between;
  position: relative; z-index: 1;
  width: 100%;
  background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.05) 60%, rgba(255,255,255,.08) 100%);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 16px 18px 14px;
  flex: 0 0 auto;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 4px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) both;
}
.hw-center-block:active { transform: scale(.97); box-shadow: 0 2px 16px rgba(0,0,0,.3); }
.hw-center-block::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  border-radius: 24px 24px 0 0;
}
.hw-center-block::after { content: none; }
.hw-center-label {
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.7);
  letter-spacing: .1px; margin-bottom: 0;
  text-align: left;
}
.hw-center-value {
  font-size: 52px; font-weight: 800; color: #fff;
  letter-spacing: -3px; line-height: 1;
  font-variant-numeric: tabular-nums;
  margin: 4px 0 0;
  text-align: left;
  text-shadow: 0 2px 20px rgba(0,0,0,.2);
  animation: countUp .5s cubic-bezier(.2,.8,.2,1) .1s both;
}
.hw-center-sub {
  font-size: 15px; font-weight: 500; color: rgba(255,255,255,.8);
  letter-spacing: -.1px;
  text-align: left;
  display: flex; align-items: center; justify-content: space-between; width: 100%;
}
.hw-center-sub-small {
  font-size: 12px; color: rgba(255,255,255,.45);
  margin-top: 4px; text-align: left;
}
.hw-bottom-group {
  display: flex; flex-direction: column; gap: 12px;
  width: 100%;
  position: relative; z-index: 1;
  flex-shrink: 0;
}

@keyframes fadeIn { to { opacity:1; } }
@keyframes slideUp { to { transform: translateY(0); } }
@keyframes fadeInUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:none;} }
@keyframes qaIn { from{opacity:0;transform:translateY(16px) scale(.85);} to{opacity:1;transform:none;} }
@keyframes countUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes pulse-live { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.6;transform:scale(.8);} }
@keyframes float-up { 0%{transform:translateY(0);} 50%{transform:translateY(-3px);} 100%{transform:translateY(0);} }

/* ── Status bar (ukryty, zachowany dla timera) ── */
.hw-status-bar { display: none; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.7);} }

/* ── Bąbelki akcji — 4+4 grid ── */
.hw-quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, auto);
  gap: 12px 0;
  padding: 4px 0 2px;
  position: relative; z-index: 1;
  width: 100%;
}
.hw-qa-row { display: contents; }
.hw-qa-item {
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 6px;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  position: relative;
  background: none; border: none; border-radius: 0;
  padding: 0 4px;
  transition: transform .15s cubic-bezier(.2,.8,.2,1), opacity .15s;
  animation: qaIn .35s cubic-bezier(.2,.8,.2,1) both;
}
.hw-qa-item:nth-child(1) { animation-delay: .05s; }
.hw-qa-item:nth-child(2) { animation-delay: .1s; }
.hw-qa-item:nth-child(3) { animation-delay: .15s; }
.hw-qa-item:nth-child(4) { animation-delay: .2s; }
.hw-qa-item:nth-child(5) { animation-delay: .25s; }
.hw-qa-item:nth-child(6) { animation-delay: .3s; }
.hw-qa-item:nth-child(7) { animation-delay: .35s; }
.hw-qa-item:nth-child(8) { animation-delay: .4s; }
.hw-qa-item::before { content: none; }
.hw-qa-item:active { transform: scale(.88); opacity: .7; }
/* Bąbelek — kółko z ikoną */
.hw-qa-circle {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 2px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hw-qa-circle svg { width: 22px; height: 22px; stroke-width: 1.6; stroke: rgba(255,255,255,.9); }
.hw-qa-circle::after { display: none; }
.hw-qa-circle.accent-red { background: rgba(255,255,255,.15); }
.hw-qa-label {
  font-size: 11px; font-weight: 500; color: rgba(255,255,255,.8);
  text-align: center; white-space: nowrap;
  letter-spacing: 0;
}

/* ── Live stats card — subtelna karta w tonie tła ── */
.hw-stats-card {
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.04) 100%);
  border: 1px solid rgba(255,255,255,.09);
  padding: 16px 20px;
  display: flex; gap: 0;
  opacity: 1;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  position: relative; z-index: 1;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 2px 16px rgba(0,0,0,.18);
  animation: fadeInUp .4s cubic-bezier(.2,.8,.2,1) .1s both;
}
.hw-stats-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
}
.hw-stat {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative;
}
.hw-stat + .hw-stat::before {
  content: '';
  position: absolute; left: 0; top: 15%; height: 70%;
  width: 1px; background: rgba(255,255,255,.1);
}
.hw-stat-val {
  font-size: 26px; font-weight: 800; color: #fff;
  letter-spacing: -.5px; line-height: 1;
  font-variant-numeric: tabular-nums;
  animation: countUp .5s cubic-bezier(.2,.8,.2,1) .2s both;
}
.hw-stat-lbl {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.6);
  text-transform: uppercase; letter-spacing: .5px; text-align: center;
}

/* ── Blok zegarowy (ewidencja czasu) — tylko gdy na zmianie ── */
.hw-clock-block {
  position: relative; overflow: hidden; z-index: 1;
  margin: 16px 20px 0;
  border-radius: 18px;
  background: rgba(255,255,255,.07);
  border: none;
  padding: 14px 18px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; gap: 14px;
  transition: background .12s;
  opacity: 0; animation: fadeIn .4s ease .2s forwards;
}
.hw-clock-block:active { background: rgba(255,255,255,.10); }
.hw-clock-block.working {
  background: rgba(34,197,94,.18);
}

.hw-clock-center { display: flex; flex-direction: column; gap: 1px; flex: 1; }
.hw-clock-timer {
  font-size: 26px; font-weight: 300; color: #fff;
  letter-spacing: -1px; line-height: 1;
  font-variant-numeric: tabular-nums; display: none;
}
.hw-clock-block.working .hw-clock-timer { display: block; }
.hw-clock-block.working .hw-clock-icon-wrap .hw-clock-play-icon { display: none; }
.hw-clock-block.working .hw-clock-icon-wrap .hw-clock-stop-icon { display: block; }

.hw-clock-icon-wrap {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.10);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s;
}
.hw-clock-block.working .hw-clock-icon-wrap { background: rgba(34,197,94,.3); }
.hw-clock-play-icon { display: block; }
.hw-clock-stop-icon { display: none; }

.hw-clock-title {
  font-size: 15px; font-weight: 600; color: rgba(255,255,255,.95);
  letter-spacing: -.2px;
}
.hw-clock-block.working .hw-clock-title { color: rgba(255,255,255,.55); font-size: 11px; }
.hw-clock-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 1px; }

.hw-clock-progress {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: rgba(255,255,255,.06); border-radius: 0 0 18px 18px;
  overflow: hidden; display: none;
}
.hw-clock-block.working .hw-clock-progress { display: block; }
.hw-clock-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, rgba(74,222,128,.5), rgba(74,222,128,.9));
  transition: width 1s linear;
}
.hw-clock-pulse {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  width: 7px; height: 7px; display: none;
}
.hw-clock-block.working .hw-clock-pulse { display: block; }
.hw-clock-pulse::before, .hw-clock-pulse::after {
  content:''; position:absolute; inset:0; border-radius:50%;
}
.hw-clock-pulse::before { background:#4ADE80; }
.hw-clock-pulse::after {
  background:rgba(74,222,128,.35);
  animation: pulse-ring 2s ease-out infinite;
}
@keyframes pulse-ring { 0%{transform:scale(1);opacity:.8;} 100%{transform:scale(4);opacity:0;} }

/* ── Menu items — wszystko na ciemnym tle, zero kart ── */
.hw-body {
  flex: 1;
  position: relative; z-index: 1;
  padding: 20px 0 0;
}

/* Sekcja z etykietą */
.hw-section {
  margin-bottom: 4px;
}
.hw-section-label {
  display: block;
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.35);
  letter-spacing: .8px; text-transform: uppercase;
  padding: 0 20px 8px;
}

.hw-blocks {
  display: flex; flex-direction: column;
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: visible;
  padding: 0 16px;
  gap: 10px;
}
.hw-blocks-label { display: none; }

/* Kafelek — subtelne tło w tonie tła, jak Revolut */
.hb-row {
  position: relative; overflow: hidden;
  cursor: pointer;
  display: flex; flex-direction: row;
  align-items: center; gap: 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.04) 100%);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 14px;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s, transform .1s, box-shadow .1s;
  box-shadow: 0 1px 8px rgba(0,0,0,.12);
  opacity: 0; animation: rowIn .3s cubic-bezier(.2,.8,.2,1) forwards;
}
.hb-row:active { background: rgba(255,255,255,.08); transform: scale(.98); }
.hb-row:nth-child(1) { animation-delay: .06s; }
.hb-row:nth-child(2) { animation-delay: .10s; }
.hb-row:nth-child(3) { animation-delay: .14s; }
.hb-row:nth-child(4) { animation-delay: .18s; }
.hb-row:nth-child(5) { animation-delay: .22s; }
.hb-row:nth-child(6) { animation-delay: .26s; }
.hb-row:nth-child(7) { animation-delay: .30s; }
.hb-row:nth-child(8) { animation-delay: .34s; }
.hb-row:nth-child(9) { animation-delay: .38s; }
.hb-row:nth-child(10){ animation-delay: .42s; }
@keyframes rowIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:none;} }

/* Ikona — kółko w tonie kart */
.hb-row-icon {
  display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.08);
  flex-shrink: 0;
}
.hb-row-icon svg { stroke: rgba(255,255,255,.9) !important; }

/* Treść */
.hb-row-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.hb-row-label { display: none; }
.hb-row-title {
  display: block;
  font-size: 15px; font-weight: 600; color: #fff;
  letter-spacing: -.2px; line-height: 1.2;
}
.hb-row-sub {
  font-size: 12px; color: rgba(255,255,255,.4); font-weight: 400;
}

/* Strzałka */
.hb-row-arrow { display: flex; align-items: center; flex-shrink: 0; }
.hb-row-arrow svg { width: 15px; height: 15px; stroke: rgba(255,255,255,.3); }

/* Badge */
.hb-badge {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  background: #fff; color: #BF3080; font-size: 10px; font-weight: 800;
  min-width: 20px; height: 20px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; padding: 0 5px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

/* Ripple */
.hb-ripple-wrap {
  position: absolute; inset: 0; border-radius: inherit;
  overflow: hidden; pointer-events: none; z-index: 10;
}
.hb-ripple {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%) scale(0);
  width: 300%; padding-bottom: 300%;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  animation: ripple-anim .45s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes ripple-anim {
  to { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}

/* Przycisk "Więcej" */
.hw-more-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 14px;
  cursor: pointer;
  font-size: 14px; font-weight: 500; color: rgba(255,255,255,.65);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
  width: 100%;
}
.hw-more-btn:active { background: rgba(255,255,255,.07); }
.hw-more-btn svg { width: 16px; height: 16px; stroke: rgba(255,255,255,.5); fill: none; stroke-width: 2; transition: transform .2s; }
.hw-more-btn.open svg { transform: rotate(180deg); }
.hw-extra-rows { display: none; flex-direction: column; gap: 10px; }
.hw-extra-rows.open { display: flex; }
/* Ikony w menu — subtelne w tonie tła */
.hb-row-icon { background: rgba(255,255,255,.08) !important; }
.hb-row-icon svg { stroke: rgba(255,255,255,.85) !important; }
.hb-row-title { color: #fff !important; }
.hb-row-arrow svg { stroke: rgba(255,255,255,.3) !important; }

/* ── Ciało home — scrollowalna lista kafelków ── */
.hw-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 14px calc(70px + max(env(safe-area-inset-bottom), 12px) + 20px);
  display: flex; flex-direction: column; gap: 8px;
  position: relative; z-index: 1;
}
.hw-body::-webkit-scrollbar { display: none; }

/* ── Banery (legacy — zachowaj css) ── */
.hw-banners {
  display: flex; flex-direction: column; gap: 12px;
  padding: 16px 20px 20px;
  position: relative; z-index: 1;
}
.hw-banner {
  position: relative; overflow: hidden;
  border-radius: 28px;
  padding: 22px 22px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: space-between;
  opacity: 0; animation: fadeIn .4s ease .2s forwards;
  transition: transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s;
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
/* glass shimmer line u góry każdego banera */
.hw-banner::before {
  content: '';
  position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  border-radius: 50%;
}
.hw-banner:active { transform: scale(.96); }
.hw-banner-clock {
  background: linear-gradient(145deg, rgba(255,160,30,.22) 0%, rgba(220,70,10,.14) 60%, rgba(160,30,5,.10) 100%);
  border: 1px solid rgba(255,170,60,.30);
  box-shadow: 0 8px 32px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.08) inset;
}
.hw-banner-shift {
  background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.10) 60%, rgba(255,255,255,.06) 100%);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 8px 32px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.10) inset;
}
.hw-banner-team {
  background: linear-gradient(145deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.07) 60%, rgba(255,255,255,.04) 100%);
  border: 1px solid rgba(255,255,255,.10);
  box-shadow: 0 8px 32px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.08) inset;
}
.hw-banner-left { display: flex; flex-direction: column; gap: 4px; }
.hw-banner-eyebrow { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .8px; }
.hw-banner-big { font-size: 34px; font-weight: 800; color: #fff; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
.hw-banner-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 3px; font-weight: 400; }
.hw-banner-right-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hw-bav { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
.hw-banner-avatars { display: flex; }

/* ── Karta Dzisiaj — LEGACY (ukryta, zastąpiona banerami) ── */
.hw-today-card { display: none; }

/* ── Siatka skrótów ── */
.hw-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 20px 0;
  position: relative; z-index: 1;
}
.hw-grid-item {
  position: relative; overflow: hidden;
  display: flex; flex-direction: row; align-items: center; gap: 12px;
  padding: 16px 16px;
  background: linear-gradient(145deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.08) 100%);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 22px;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.10);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .15s cubic-bezier(.2,.8,.2,1);
  opacity: 0; animation: rowIn .3s ease forwards;
}
/* shimmer u góry każdego kafelka */
.hw-grid-item::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
}
.hw-grid-item:nth-child(1){animation-delay:.1s}
.hw-grid-item:nth-child(2){animation-delay:.14s}
.hw-grid-item:nth-child(3){animation-delay:.18s}
.hw-grid-item:nth-child(4){animation-delay:.22s}
.hw-grid-item:nth-child(5){animation-delay:.26s}
.hw-grid-item:nth-child(6){animation-delay:.30s}
.hw-grid-item:nth-child(7){animation-delay:.34s}
.hw-grid-item:nth-child(8){animation-delay:.38s}
.hw-grid-item:active { transform: scale(.95); }
.hw-grid-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.10);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hw-grid-icon svg { stroke: rgba(255,255,255,.9) !important; width: 18px; height: 18px; }
.hw-grid-label {
  font-size: 13px; font-weight: 600; color: #fff;
  letter-spacing: -.2px; line-height: 1.2;
}
.hw-today-label {
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5);
  letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px;
}
.hw-today-count {
  font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -1.5px; line-height: 1;
}
.hw-today-count span { font-size: 18px; font-weight: 500; color: rgba(255,255,255,.6); }
.hw-today-names {
  font-size: 14px; color: rgba(255,255,255,.8); margin-top: 6px; font-weight: 500;
}
.hw-today-more {
  display: inline-block; background: rgba(255,255,255,.10);
  border-radius: 8px; padding: 1px 7px; font-size: 12px;
}
.hw-today-sub {
  font-size: 12px; color: rgba(255,255,255,.4); margin-top: 4px;
}

/* ── Chat FAB — zawsze widoczny ── */
.chat-fab {
  position: fixed; right: 18px; z-index: 200;
  bottom: calc(max(env(safe-area-inset-bottom), 12px) + 70px);
  width: 54px; height: 54px; border-radius: 50%;
  background: #7B1D2E;
  box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border: none; outline: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s cubic-bezier(.4,0,.2,1), box-shadow .15s;
  will-change: transform;
}
.chat-fab:active { transform: scale(.9); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.chat-fab svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.8; }
.chat-fab-badge {
  position: absolute; top: -2px; right: -2px;
  min-width: 18px; height: 18px; border-radius: 9px;
  background: #EF4444; color: white; font-size: 10px; font-weight: 700;
  display: none; align-items: center; justify-content: center; padding: 0 4px;
  border: 2px solid #0F0A0B;
}
.chat-fab-badge.visible { display: flex; }
/* Na jasnym tle (inne widoki) FAB też działa, bo position:fixed */
body:not(.view-home) .chat-fab {
  bottom: calc(max(env(safe-area-inset-bottom), 12px) + 70px);
}

/* Back button w sekcjach */
.section-back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; font-family: var(--font); font-size: 14px; font-weight: 600;
  color: var(--brand); cursor: pointer; padding: 0; letter-spacing: -.2px;
}
.section-back-btn svg { width: 18px; height: 18px; stroke: var(--brand); fill: none; stroke-width: 2; }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
.home-tile { position: relative; display:flex; flex-direction:column; background:linear-gradient(145deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.08) 100%); border:1px solid rgba(255,255,255,.2); border-radius:18px; cursor:pointer; overflow:hidden; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow: 0 4px 20px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.07); transition: transform .12s; }
.home-tile:active { transform: scale(.97); }
.home-tile-badge {
  position: absolute; top: 12px; right: 12px;
  background: var(--brand); color: white; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 5px;
}

/* ─── Page header bar ─── */
.page-bar {
  background: transparent; border-bottom: none;
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.page-bar-title {
  font-size: 16px; font-weight: 800; flex: 1; min-width: 120px;
  letter-spacing: -.4px; font-family: 'Inter',sans-serif; color: #fff;
}
.view-toggle {
  display: flex; background: rgba(255,255,255,.08); border-radius: var(--radius); padding: 2px; gap: 1px;
  border: 1px solid rgba(255,255,255,.1);
}
.vt-btn {
  padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: none; background: none; font-family: var(--font); color: rgba(255,255,255,.5);
  transition: all .12s;
}
.vt-btn.active { background: rgba(255,255,255,.10); color: #fff; box-shadow: none; font-weight: 600; }

/* ─── Week nav ─── */
.week-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 0; gap: 8px;
}
.wn-btn {
  width: 30px; height: 30px; border: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.08);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: rgba(255,255,255,.7); font-size: 15px; transition: all .12s;
  flex-shrink: 0;
}
.wn-btn:hover { border-color: rgba(255,255,255,.2); color: #fff; }
.wn-label { text-align: center; flex: 1; }
.wn-range { font-size: 14px; font-weight: 700; letter-spacing: -.3px; color: #fff; }
.wn-week { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 2px; }
.today-link { color: rgba(255,255,255,.65); cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255,255,255,.2); }

/* ─── Dept tabs ─── */
.dept-row {
  display: flex; gap: 4px; padding: 10px 16px 0; overflow-x: auto;
  scrollbar-width: none;
}
.dept-row::-webkit-scrollbar { display: none; }
.dtab {
  padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07);
  color: rgba(255,255,255,.55); cursor: pointer; transition: all .12s; font-family: var(--font);
}
.dtab.active { background: rgba(255,255,255,.12); color: white; border-color: rgba(255,255,255,.12); }
.dtab:hover:not(.active) { border-color: rgba(255,255,255,.10); color: rgba(255,255,255,.8); }

/* ─── Cost strip ─── */
.cost-strip {
  margin: 10px 16px 0;
  background: linear-gradient(135deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.05) 100%);
  border-radius: var(--radius-lg); padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid rgba(255,255,255,.11);
  backdrop-filter: none; -webkit-backdrop-filter: none;
  box-shadow: 0 2px 14px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.1);
  position: relative; overflow: hidden;
  animation: fadeInUp .35s cubic-bezier(.2,.8,.2,1) .05s both;
}
.cost-strip::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
}
.cs-label { font-size: 10px; color: rgba(255,255,255,.45); font-weight: 500; letter-spacing: .2px; margin-bottom: 2px; }
.cs-val { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -.5px; }

/* ─── GRAFIK — nowy układ wierszowy ─── */
.sched-wrap { padding: 0; }

/* ── GRAFIK TYGODNIOWY — scroll poziomy ── */
.sw-outer { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
.sw-inner { min-width: 520px; padding: 0 12px; }

/* Nagłówek dni */
.sw-dayheader { display: flex; padding: 6px 0 4px; gap: 3px; }
.sw-dh-emp { width: 92px; flex-shrink: 0; }
.sw-dh-day {
  width: 44px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 4px 2px 3px;
}
.sw-dh-label { font-size: 9px; font-weight: 600; letter-spacing: .3px; color: rgba(255,255,255,.3); text-transform: uppercase; }
.sw-dh-num { font-size: 15px; font-weight: 800; letter-spacing: -.5px; color: rgba(255,255,255,.45); line-height: 1; }
.sw-dh-day.sw-today .sw-dh-label { color: var(--danger); }
.sw-dh-day.sw-today .sw-dh-num {
  color: #fff; background: var(--danger); border-radius: 8px;
  width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.sw-dh-day.sw-wknd .sw-dh-num { color: rgba(252,165,165,.45); }

/* Lista pracowników */
.sw-list { display: flex; flex-direction: column; gap: 2px; }

.sw-emp-row {
  display: flex; gap: 3px; align-items: center;
  animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1) both;
  padding: 2px 0;
}
.sw-emp-row:nth-child(1){animation-delay:.02s}.sw-emp-row:nth-child(2){animation-delay:.05s}
.sw-emp-row:nth-child(3){animation-delay:.08s}.sw-emp-row:nth-child(4){animation-delay:.11s}
.sw-emp-row:nth-child(5){animation-delay:.14s}.sw-emp-row:nth-child(6){animation-delay:.17s}
.sw-emp-row:nth-child(7){animation-delay:.20s}.sw-emp-row:nth-child(8){animation-delay:.23s}
.sw-emp-row:nth-child(9){animation-delay:.26s}.sw-emp-row:nth-child(10){animation-delay:.29s}

/* Lewa kolumna: awatar + imię */
.sw-emp-id { width: 92px; flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding-right: 4px; }
.sw-av {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff; letter-spacing: -.3px;
}
.sw-empname { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.2px; }

/* Kafelki dni — stały rozmiar 44×44 */
.sw-tile {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform .1s, opacity .1s;
  -webkit-tap-highlight-color: transparent;
}
.sw-tile:active { transform: scale(.85); opacity: .75; }

.sw-tile.sw-empty { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.07); }
.sw-tile.sw-empty.sw-wknd { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.05); }
.sw-tile.sw-empty.sw-tod  { background: rgba(200,50,30,.1); border: 1px solid rgba(200,50,30,.25); }
.sw-plus { font-size: 15px; color: rgba(255,255,255,.15); line-height: 1; }

.sw-tile.sw-has {
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.22);
}
.sw-tile.sw-has::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: rgba(255,255,255,.35);
}
.sw-tile.sw-has.sw-wknd { background: rgba(200,50,30,.35); border-color: rgba(200,50,30,.5); }
.sw-tile.sw-has.sw-tod  { background: rgba(200,50,30,.5); border-color: rgba(200,50,30,.7); box-shadow: 0 2px 12px rgba(200,50,30,.3); }
.sw-time { font-size: 8.5px; font-weight: 700; color: #fff; letter-spacing: -.1px; white-space: nowrap; }
.sw-hrs  { font-size: 7px; color: rgba(255,255,255,.5); margin-top: 1px; }

.sw-tile.sw-off { background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.12); }
.sw-off-x { font-size: 10px; color: rgba(252,165,165,.5); font-weight: 700; }

/* Separator działów */
.sw-dept-sep {
  font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
  color: rgba(255,255,255,.2); padding: 8px 0 2px; margin-left: 2px;
}

/* ─── WIDOK MIESIĘCZNY ─── */
.sm-wrap { display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 20px; }
.sm-emp-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 12px;
  background: rgba(255,255,255,.04);
  animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1) both;
}
.sm-emp-id { display: flex; align-items: center; gap: 8px; width: 110px; flex-shrink: 0; }
.sm-emp-stat { font-size: 9px; color: rgba(255,255,255,.35); margin-top: 1px; letter-spacing: -.1px; }
.sm-days { display: flex; gap: 2px; flex: 1; flex-wrap: nowrap; overflow: hidden; align-items: center; }
.sm-dot {
  flex: 1; height: 10px; border-radius: 3px; min-width: 4px; max-width: 14px;
  cursor: pointer; transition: transform .1s, opacity .1s;
  -webkit-tap-highlight-color: transparent;
}
.sm-dot:active { transform: scaleY(1.4); opacity: .8; }
.sm-dot-empty { background: rgba(255,255,255,.07); }
.sm-dot-we-empty { background: rgba(200,50,30,.07); }
.sm-dot-tod-empty { background: rgba(200,50,30,.15); outline: 1px solid rgba(200,50,30,.3); }
.sm-dot-on { background: rgba(255,255,255,.7); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.sm-dot-we.sm-dot-on { background: #FCA5A5; }
.sm-dot-tod.sm-dot-on { background: #fff; box-shadow: 0 1px 8px rgba(200,50,30,.5); outline: 1px solid var(--danger); }
.sm-dot-off { background: rgba(220,38,38,.25); }

/* ── stare klasy (nieużywane, zostają) ── */
.emp-cards-list { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 16px; }

.esc-top { display:flex; align-items:center; gap:10px; padding:12px 14px 10px; }
.esc-av { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; flex-shrink:0; letter-spacing:-.3px; }
.esc-info { flex:1; min-width:0; }
.esc-name { font-size:14px; font-weight:700; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.esc-dept { font-size:11px; color:rgba(255,255,255,.35); margin-top:1px; display:flex; align-items:center; gap:4px; }
.esc-dept-dot { width:5px; height:5px; border-radius:50%; background:#FBBF24; flex-shrink:0; }
.esc-dept-dot.sala { background:#60A5FA; }
.esc-summary { text-align:right; flex-shrink:0; }
.esc-sumval { font-size:13px; font-weight:700; letter-spacing:-.3px; }
.esc-sumlbl { font-size:10px; color:rgba(255,255,255,.35); margin-top:1px; }

.esc-days { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding:0 10px 10px; }
.esc-day {
  border-radius:8px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; min-height:46px;
  position:relative; overflow:hidden;
  transition:transform .12s, opacity .12s;
  -webkit-tap-highlight-color: transparent;
}
.esc-day:active { transform:scale(.88); opacity:.8; }
.esc-day.empty {
  background:rgba(255,255,255,.03);
  border:1px dashed rgba(255,255,255,.07);
}
.esc-day.empty:hover { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); }
.esc-day-plus { color:rgba(255,255,255,.14); font-size:14px; line-height:1; transition:color .12s; }
.esc-day.empty:hover .esc-day-plus { color:rgba(255,255,255,.4); }
.esc-day.has-shift {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}
.esc-day.has-shift::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:rgba(255,255,255,.2); }
.esc-day-time { font-size:9px; font-weight:700; color:#fff; letter-spacing:-.1px; white-space:nowrap; }
.esc-day-hrs { font-size:8px; color:rgba(255,255,255,.5); font-weight:500; margin-top:1px; }
.esc-day.weekend.empty { background:rgba(200,50,30,.04); border-color:rgba(200,50,30,.1); }
.esc-day.weekend.has-shift { background:rgba(200,50,30,.16); border-color:rgba(200,50,30,.28); }
.esc-day.weekend.has-shift .esc-day-time { color:#FCA5A5; }
.esc-day.today-col.has-shift { background:rgba(200,50,30,.22); border-color:rgba(200,50,30,.45); box-shadow:0 2px 10px rgba(200,50,30,.2); }
.esc-day.today-col.empty { border-color:rgba(200,50,30,.22); }
.esc-day.unavail-day { background:rgba(220,38,38,.06); border:1px dashed rgba(220,38,38,.2); }
.esc-day-unavail-x { font-size:11px; color:#FCA5A5; font-weight:600; }
.sched-tbl {
  width: 100%; border-collapse: collapse; min-width: 480px;
  background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.04) 100%);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
  border: 1px solid rgba(255,255,255,.1);
}
.sched-tbl thead th {
  background: rgba(255,255,255,.04); color: rgba(255,255,255,.45); font-size: 10px; font-weight: 600;
  padding: 9px 6px; text-align: center; white-space: nowrap; letter-spacing: .3px;
  border-bottom: 1px solid rgba(255,255,255,.08); text-transform: uppercase;
}
.sched-tbl thead th.th-emp { text-align: left; padding-left: 14px; min-width: 130px; }
.sched-tbl thead th.th-day { min-width: 64px; }
.sched-tbl thead th.th-day .dn { font-size: 16px; font-weight: 700; color: #fff; display: block; margin-top: 1px; letter-spacing: -.3px; text-transform: none; }
.sched-tbl thead th.th-day.today { background: rgba(255,255,255,.10); color: white; }
.sched-tbl thead th.th-day.today .dn { color: white; }
.sched-tbl thead th.th-day.weekend { background: rgba(220,38,38,.15); color: var(--danger); }
.sched-tbl thead th.th-day.weekend .dn { color: var(--danger); }
.td-day-cell.weekend { background: rgba(220,38,38,.06); }
.td-day-cell.weekend:hover { background: rgba(220,38,38,.15); }
.td-day-cell.weekend .shift-chip { background: var(--danger); box-shadow: none; }
.td-day-cell.weekend .shift-cost-lbl { color: var(--danger); }
.sched-tbl thead th.th-sum { min-width: 70px; text-align: right; padding-right: 14px; }
.sched-tbl tbody tr { border-top: 1px solid rgba(255,255,255,.07); }
.sched-tbl tbody tr:hover { background: rgba(255,255,255,.04); }
.sched-tbl tbody td { border-right: 1px solid rgba(255,255,255,.07); padding: 0; }
.sched-tbl tbody td:last-child { border-right: none; }

.td-emp-cell { display: flex; align-items: center; gap: 9px; padding: 9px 14px; min-height: 52px; }
.av {
  width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
}
.td-emp-name { font-size: 13px; font-weight: 600; color: #fff; }
.td-emp-dept { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.dept-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

.td-day-cell {
  text-align: center; cursor: pointer; padding: 7px 3px; min-height: 52px;

}
.td-day-cell:hover { background: var(--bg-solid); }
.td-day-cell.is-today { background: rgba(0,0,0,.025); }
.shift-chip {

  white-space: nowrap; letter-spacing: -.1px; gap: 2px;
}
.shift-cost-lbl { font-size: 9px; color: rgba(255,255,255,.5); font-weight: 500; margin-top: 2px; }
.cell-add { font-size: 16px; color: rgba(255,255,255,.10); font-weight: 300; line-height: 1; }
.td-day-cell:hover .cell-add { color: rgba(255,255,255,.5); }
.td-day-cell.unavail { background: var(--red-soft); }
.cell-unavail { font-size: 11px; color: #FCA5A5; font-weight: 600; }

/* ─── Auto-fill button ─── */
.autofill-btn {
  display: flex; align-items: center; gap: 8px; margin: 10px 16px 0;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: var(--radius);
  padding: 10px 14px; cursor: pointer; font-family: var(--font); font-size: 12px;
  color: rgba(255,255,255,.65); font-weight: 500; width: calc(100% - 32px); transition: all .12s;
}
.autofill-btn:hover { border-color: rgba(255,255,255,.2); color: #fff; background: rgba(255,255,255,.07); }
.autofill-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.autofill-btn strong { font-weight: 700; color: #fff; }

/* ─── Avail header ─── */
.avail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; border-bottom: 1px solid rgba(255,255,255,.08);
}
.avail-header-title { font-size: 16px; font-weight: 700; letter-spacing: -.4px; color: #fff; }
.avail-header-month { font-size: 13px; color: rgba(255,255,255,.45); margin-top: 1px; }
.avail-nav { display: flex; gap: 4px; }
.avail-nav button {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,.07);
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .1s;
}
.avail-nav button:hover { border-color: rgba(255,255,255,.12); color: #fff; }

/* ─── Employee avail form ─── */
.avail-intro {
  padding: 16px 20px 8px; font-size: 13px; color: rgba(255,255,255,.65); line-height: 1.6;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.avail-intro strong { color: #fff; font-weight: 600; }
.avail-status-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 20px;

  font-size: 12px; color: #34D399; font-weight: 500;
}

.avail-days-list { padding: 0 20px 100px; }
.avail-week-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: rgba(255,255,255,.35); padding: 14px 0 6px; border-bottom: 1px solid rgba(255,255,255,.08);
  margin-bottom: 2px;
}
.avail-day-row {
  display: flex; align-items: center; padding: 11px 0;
  border-bottom: 1px solid rgba(255,255,255,.07); gap: 12px; cursor: pointer;
}
.avail-day-row:last-child { border-bottom: none; }
.avail-day-row.past { opacity: .35; cursor: default; }
.avail-day-row.blocked { opacity: .5; cursor: not-allowed; }
.avail-day-num {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;

}

.avail-day-info { flex: 1; }
.avail-day-name { font-size: 13px; font-weight: 600; color: #fff; }
.avail-day-sub { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
.avail-day-row.unavail .avail-day-name { color: #FCA5A5; }
.avail-toggle {

  position: relative; transition: background .15s; flex-shrink: 0;
}
.avail-toggle::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;

}

.avail-blocked-badge {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.35); padding: 3px 8px;
  border: 1px solid rgba(255,255,255,.07); border-radius: 4px; white-space: nowrap;
}
.avail-save-bar {
  position: fixed; bottom: 60px; left: 0; right: 0; padding: 12px 20px;

  backdrop-filter: none; -webkit-backdrop-filter: none;
}
.avail-save-btn {
  flex: 1; padding: 13px; background: var(--accent); color: white;

}

.avail-clear-btn {

}

/* ─── Manager overview ─── */
.avail-manager-wrap { padding: 0 16px 20px; }
.avail-overview-title { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: rgba(255,255,255,.35); padding: 14px 0 8px; }
.avail-emp-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 0;

}
.avail-emp-row:last-child { border-bottom: none; }
